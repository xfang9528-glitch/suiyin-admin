<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>销售使用统计</title><link rel="stylesheet" href="_admin_list.css"></head>
<body>

<div class="filter-bar">
  <div class="f-group" style="gap:4px;">
    <button class="btn sm">今天</button>
    <button class="btn sm">昨天</button>
    <button class="btn sm">前天</button>
  </div>
  <div class="f-group">
    <input class="f-input date" type="date" placeholder="开始日期">
    <span class="f-sep">至</span>
    <input class="f-input date" type="date" placeholder="结束日期">
  </div>
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="销售姓名"></div>
  <button class="btn primary" onclick="render()">🔍 搜索</button>
  <button class="btn" onclick="onReset()">重置</button>
</div>

<div class="table-wrap">
  <div class="table-card">
    <table>
      <thead><tr><th>#</th><th>销售</th><th>消息数</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info" id="pagerInfo">共 0 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button><button class="pager-btn cur">1</button><button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { sale:'杨瑶 yiyi',     msgs:4020 },
  { sale:'杜佳',          msgs:3800 },
  { sale:'陈巧',          msgs:3760 },
  { sale:'聂敏',          msgs:3500 },
  { sale:'Lucy 💗',       msgs:3310 },
  { sale:'罗玲 金金',      msgs:3286 },
  { sale:'刘瑜02',        msgs:3105 },
  { sale:'赵紫颖03',      msgs:2980 },
  { sale:'曹琳',          msgs:2640 },
  { sale:'刘依王01',      msgs:2380 },
  { sale:'牛海兰03',      msgs:2110 },
  { sale:'YeStar 助理-铃铃',msgs:1860 },
];
function render() {
  const kw = document.getElementById('kw').value.trim();
  const list = ROWS.filter(r => !kw || r.sale.includes(kw));
  document.getElementById('tbody').innerHTML = list.map((r,i) => `<tr><td class="col-num muted">${i+1}</td><td>${r.sale}</td><td class="col-num success">${r.msgs.toLocaleString('zh-CN')}</td></tr>`).join('');
  document.getElementById('pagerInfo').textContent = `共 ${list.length} 条`;
}
function onReset() { document.getElementById('kw').value=''; render(); }
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script></body></html>
