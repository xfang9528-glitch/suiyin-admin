<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>分配记录</title><link rel="stylesheet" href="_admin_list.css"></head>
<body>

<div class="filter-bar">
  <div class="f-group">
    <input class="f-input date" type="date" placeholder="开始日期">
    <span class="f-sep">至</span>
    <input class="f-input date" type="date" placeholder="结束日期">
  </div>
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="客户/销售名"></div>
  <div class="f-group"><select class="f-select" id="src"><option value="">来源</option><option>系统分配</option><option>手动转接</option><option>主动认领</option></select></div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <button class="btn" onclick="onReset()">重置</button>
</div>

<div class="table-wrap">
  <div class="table-card scroll" style="min-width:1500px;">
    <table>
      <thead><tr>
        <th>时间</th><th>昵称</th><th>微信账号</th>
        <th>操作人员</th><th>来源</th><th>分配方式</th>
        <th>目标分配</th><th>实际分配</th>
        <th>结束时间</th><th>结束原因</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info">共 2,000 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button>
  <button class="pager-btn cur">1</button><button class="pager-btn">2</button><button class="pager-btn">3</button>
  <span class="pager-ellipsis">…</span><button class="pager-btn">100</button>
  <button class="pager-btn">›</button>
</div>

<script>
const ROWS = [
  { time:'2026-05-06 14:08:21', nick:'雯雯',  wx:'wenwen-cus',  op:'系统',     src:'系统分配', way:'轮询', target:'杨瑶 yiyi', actual:'杨瑶 yiyi', endAt:'',                    reason:'' },
  { time:'2026-05-06 13:30:00', nick:'敏敏',  wx:'minmin-cus',  op:'刘小红',   src:'手动转接', way:'指定', target:'陈巧',     actual:'陈巧',     endAt:'',                    reason:'' },
  { time:'2026-05-06 11:50:11', nick:'琪琪',  wx:'qiqi-cus',    op:'聂敏',     src:'主动认领', way:'抢单', target:'-',        actual:'聂敏',     endAt:'',                    reason:'' },
  { time:'2026-05-06 09:33:02', nick:'琴',    wx:'qin-cus',     op:'系统',     src:'系统分配', way:'权重', target:'Lucy 💗',  actual:'Lucy 💗',  endAt:'',                    reason:'' },
  { time:'2026-05-05 17:08:11', nick:'李',    wx:'li-cus',      op:'罗玲',     src:'主动认领', way:'抢单', target:'-',        actual:'罗玲 金金',endAt:'2026-05-06 11:00:00', reason:'已成交' },
  { time:'2026-05-05 11:08:55', nick:'豆豆',  wx:'doudou-cus',  op:'刘小红',   src:'手动转接', way:'指定', target:'刘瑜02',   actual:'刘瑜02',   endAt:'2026-05-06 10:00:00', reason:'失联 7 天' },
  { time:'2026-05-04 19:30:18', nick:'糖糖',  wx:'tangtang-cus',op:'系统',     src:'系统分配', way:'权重', target:'铃铃',     actual:'铃铃',     endAt:'2026-05-05 14:00:00', reason:'拒绝服务' },
];
function render() {
  const kw = document.getElementById('kw').value.trim();
  const src = document.getElementById('src').value;
  const list = ROWS.filter(r => (!kw || r.nick.includes(kw) || r.actual.includes(kw)) && (!src || r.src === src));
  document.getElementById('tbody').innerHTML = list.map(r => `
    <tr>
      <td class="col-time">${r.time}</td>
      <td>${r.nick}</td>
      <td>${r.wx}</td>
      <td>${r.op}</td>
      <td><span class="tag ${r.src === '系统分配' ? 'blue' : (r.src === '主动认领' ? 'green' : '')}">${r.src}</span></td>
      <td>${r.way}</td>
      <td>${r.target === '-' ? '<span style="color:var(--text-3)">-</span>' : r.target}</td>
      <td>${r.actual}</td>
      <td class="col-time ${r.endAt ? '' : 'empty'}">${r.endAt || '—'}</td>
      <td>${r.reason || '<span style="color:var(--text-3)">进行中</span>'}</td>
    </tr>
  `).join('');
}
function onReset() { ['kw','src'].forEach(id=>document.getElementById(id).value=''); render(); }
render();
</script></body></html>
