<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>拉新记录</title><link rel="stylesheet" href="_admin_list.css"></head>
<body>

<div class="filter-bar">
  <div class="f-group">
    <input class="f-input date" id="d1" type="date" placeholder="开始日期">
    <span class="f-sep">至</span>
    <input class="f-input date" id="d2" type="date" placeholder="结束日期">
  </div>
  <div class="f-group"><input class="f-input wide" id="sale" placeholder="请输入销售名称"></div>
  <div class="f-group"><input class="f-input wide" id="ch" placeholder="请输入渠道名称"></div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <button class="btn" onclick="onReset()">重置</button>
</div>

<div class="table-wrap">
  <div class="table-card scroll" style="min-width:1480px;">
    <table>
      <thead><tr>
        <th>头像昵称</th><th>所在微信号</th><th>销售</th><th>老客户</th>
        <th>渠道</th><th>活动名</th><th>利益点</th><th>合作方</th><th>拉新时间</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info">共 908 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button>
  <button class="pager-btn cur">1</button><button class="pager-btn">2</button><button class="pager-btn">3</button>
  <span class="pager-ellipsis">…</span><button class="pager-btn">46</button>
  <button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { nick:'柚子',     wx:'A 成都艺星专家助理 KK', sale:'KK17775575920', oldCus:'-',          ch:'抖音',     act:'5月医美节', benefit:'限时 9 折', partner:'抖音直播间', at:'2026-05-06 10:42:18' },
  { nick:'小苹果',   wx:'成都艺星医生助理 chloe',sale:'chloe',          oldCus:'琪琪-客户D', ch:'老客介绍', act:'-',         benefit:'-',         partner:'-',           at:'2026-05-06 09:33:02' },
  { nick:'小红',     wx:'艺星专家助理妍妍',     sale:'妍妍',           oldCus:'-',          ch:'小红书',   act:'春日护肤季', benefit:'立减 200',  partner:'小红书博主', at:'2026-05-05 18:08:11' },
  { nick:'敏敏',     wx:'刘瑜02',               sale:'刘瑜02',         oldCus:'-',          ch:'美团',     act:'美团点评',   benefit:'团购价',    partner:'美团医美',   at:'2026-05-05 15:22:09' },
  { nick:'琴',       wx:'Lucy 💗',              sale:'Lucy',          oldCus:'敏敏-客户C', ch:'老客介绍', act:'-',         benefit:'-',         partner:'-',           at:'2026-05-05 11:08:55' },
  { nick:'糖糖',     wx:'YeStar 助理-铃铃',      sale:'铃铃',           oldCus:'-',          ch:'抖音',     act:'5月医美节', benefit:'限时 9 折', partner:'抖音直播间', at:'2026-05-04 19:30:18' },
  { nick:'豆豆',     wx:'A 成都艺星院长助理好好',sale:'好好',           oldCus:'-',          ch:'院内',     act:'-',         benefit:'-',         partner:'院内回头',   at:'2026-05-04 16:50:00' },
  { nick:'果果',     wx:'曹琳',                 sale:'曹琳',           oldCus:'-',          ch:'朋友圈广告',act:'5月医美节', benefit:'限时 9 折', partner:'广点通',    at:'2026-05-04 11:00:00' },
];
function render() {
  document.getElementById('tbody').innerHTML = ROWS.map(r => `
    <tr>
      <td>${r.nick}</td>
      <td>${r.wx}</td>
      <td>${r.sale}</td>
      <td>${r.oldCus === '-' ? '<span style="color:var(--text-3)">-</span>' : r.oldCus}</td>
      <td><span class="tag blue">${r.ch}</span></td>
      <td>${r.act === '-' ? '<span style="color:var(--text-3)">-</span>' : r.act}</td>
      <td>${r.benefit === '-' ? '<span style="color:var(--text-3)">-</span>' : r.benefit}</td>
      <td>${r.partner === '-' ? '<span style="color:var(--text-3)">-</span>' : r.partner}</td>
      <td class="col-time">${r.at}</td>
    </tr>
  `).join('');
}
function onReset() { ['d1','d2','sale','ch'].forEach(id=>document.getElementById(id).value=''); render(); }
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script></body></html>
