<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>数据查看日志</title><link rel="stylesheet" href="_admin_list.css"></head>
<body>

<div class="filter-bar">
  <div class="f-group">
    <input class="f-input date" type="date" placeholder="开始日期">
    <span class="f-sep">至</span>
    <input class="f-input date" type="date" placeholder="结束日期">
  </div>
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="销售姓名 / 客户姓名"></div>
  <button class="btn primary" onclick="render()">🔍 搜索</button>
  <button class="btn" onclick="onReset()">重置</button>
  <div class="f-spacer"></div>
  <button class="btn" onclick="toast('导出表格')">📤 导出表格</button>
</div>

<div class="table-wrap">
  <div class="table-card">
    <table>
      <thead><tr><th>时间</th><th>销售</th><th>客户姓名</th><th>查看内容</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info">共 2,087 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button>
  <button class="pager-btn cur">1</button><button class="pager-btn">2</button><button class="pager-btn">3</button>
  <span class="pager-ellipsis">…</span><button class="pager-btn">105</button>
  <button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { time:'2026-05-06 14:08:21', sale:'杨瑶 yiyi', cus:'雯雯-客户B', content:'查看客户档案' },
  { time:'2026-05-06 13:55:11', sale:'杜佳',     cus:'微微-客户A', content:'查看预付订单' },
  { time:'2026-05-06 11:30:00', sale:'陈巧',     cus:'敏敏-客户C', content:'查看充值记录' },
  { time:'2026-05-06 10:42:18', sale:'聂敏',     cus:'琪琪-客户D', content:'查看交付明细' },
  { time:'2026-05-06 09:33:02', sale:'Lucy 💗',  cus:'琴-客户E',   content:'查看朋友圈互动' },
  { time:'2026-05-05 17:08:11', sale:'罗玲 金金', cus:'李-客户F',   content:'查看客户标签' },
  { time:'2026-05-05 15:22:09', sale:'刘瑜02',   cus:'敏敏-客户C', content:'查看预付订单' },
  { time:'2026-05-05 11:08:55', sale:'赵紫颖03', cus:'微微-客户A', content:'查看充值记录' },
];
function render() {
  const kw = document.getElementById('kw').value.trim();
  const list = ROWS.filter(r => !kw || r.sale.includes(kw) || r.cus.includes(kw));
  document.getElementById('tbody').innerHTML = list.map(r => `<tr><td class="col-time">${r.time}</td><td>${r.sale}</td><td>${r.cus}</td><td>${r.content}</td></tr>`).join('');
}
function onReset() { document.getElementById('kw').value=''; render(); }
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script></body></html>
