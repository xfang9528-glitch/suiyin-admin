<!doctype html><meta charset="utf-8"><title>管理后台关键交互验收</title><style>body{font:14px system-ui;padding:20px}iframe{width:1180px;height:850px;border:1px solid #ddd}pre{white-space:pre-wrap}</style><h1>关键交互验收</h1><p>测试使用独立 QA 存储，不覆盖用户演示记录。</p><button id="run">运行交互验收</button><pre id="report">待运行</pre><div id="stage"></div><script>
const results=[];let frame;const assert=(name,ok,detail='')=>{results.push({name,passed:!!ok,detail});document.querySelector('#report').textContent=JSON.stringify({checks:results.length,passed:results.filter(x=>x.passed).length,failed:results.filter(x=>!x.passed)},null,2);};
function waitFor(fn){return new Promise((res,rej)=>{const start=Date.now(),id=setInterval(()=>{try{if(fn()){clearInterval(id);res();}else if(Date.now()-start>15000){clearInterval(id);rej(Error('等待页面结果超时'));}}catch{}},50);});}
async function load(tenant,route){frame?.remove();frame=document.createElement('iframe');frame.src='admin-content.html?qa=1&tenant='+tenant+'&route='+route;document.querySelector('#stage').append(frame);await waitFor(()=>frame.contentDocument?.body?.dataset.contentReady);return frame.contentDocument;}
const click=(d,label,scope=d)=>{const b=[...scope.querySelectorAll('button')].find(b=>b.textContent.replace(/\s/g,'')===label.replace(/\s/g,''));const target=b||(label==='保存'?[...scope.querySelectorAll('button')].find(b=>b.textContent.replace(/\s/g,'')==='确定'):null);if(!target)throw Error('按钮不存在：'+label);target.click();};const fill=(d,name,value)=>{const e=d.querySelector('[data-field="'+name+'"]');if(!e)throw Error('字段不存在：'+name);e.value=value;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}));return e;};
document.querySelector('#run').onclick=async()=>{results.length=0;try{
 for(const key of Object.keys(localStorage).filter(k=>k.startsWith('admin-qa:v1:')||k.startsWith('admin-qa-nav:')))localStorage.removeItem(key);
 let d=await load('yestar-sz','wechatStatus');assert('账号样本默认20行，与来源一致',d.querySelectorAll('tbody tr').length===20);const group=d.querySelector('[data-filter="群组"]');group.value='会员中心';click(d,'查询');assert('群组筛选为会员中心5行',d.querySelectorAll('tbody tr').length===5);click(d,'重置');const size=d.querySelector('[aria-label="每页条数"]');size.value='10';size.dispatchEvent(new Event('change',{bubbles:true}));click(d,'›');assert('分页切换第二页',d.querySelector('.pager').textContent.includes('2 / 2'));
 click(d,'编辑');fill(d,'人设名称','');click(d,'保存');assert('必填缺失阻止保存',d.querySelector('dialog').open&&!d.querySelector('[data-field="人设名称"]').validity.valid);fill(d,'人设名称','QA-账号保存验证');click(d,'保存');d=await load('yestar-sz','wechatStatus');d.querySelector('[data-filter="人设名称"]').value='QA-账号保存验证';click(d,'查询');assert('账号保存后刷新可读回',d.querySelectorAll('tbody tr').length===1&&d.querySelector('tbody').textContent.includes('QA-账号保存验证'));
 d=await load('yestar-bj','wechatStatus');assert('租户隔离',!d.body.textContent.includes('QA-账号保存验证'));
 d=await load('yestar-sz','medicalDepartments');click(d,'新增科室');fill(d,'科室名称','QA-科室验证');click(d,'保存');let row=[...d.querySelectorAll('tbody tr')].find(r=>r.textContent.includes('QA-科室验证'));assert('新增科室进入列表',!!row);click(d,'删除',row);click(d,'确认删除',d.querySelector('dialog'));assert('删除结果不含目标',!d.querySelector('tbody').textContent.includes('QA-科室验证'));click(d,'撤销删除',d.querySelector('dialog'));assert('撤销恢复目标',d.querySelector('tbody').textContent.includes('QA-科室验证'));
 d=await load('yestar-sz','massMessageListYx');click(d,'创建群发');assert('群发显示完整创建页面',!!d.querySelector('.mass-page'));const title=d.querySelector('[aria-label="群发名称"]');title.value='QA-群发草稿';title.dispatchEvent(new Event('input',{bubbles:true}));click(d,'保存草稿');click(d,'‹ 返回群发列表');click(d,'创建群发');assert('重新进入保留群发草稿',d.querySelector('[aria-label="群发名称"]').value==='QA-群发草稿');assert('群发六类消息',d.querySelector('[aria-label="版本1消息1类型"]').options.length===6);
 d=await load('yestar-sz','appointmentSettings');const radio=d.querySelector('input[name="电子预约码"][value="必填"]');radio.checked=true;radio.dispatchEvent(new Event('change',{bubbles:true}));click(d,'保存预约设置');d=await load('yestar-sz','appointmentSettings');assert('预约设置刷新后保留',d.querySelector('input[name="电子预约码"]:checked').value==='必填');
 d=await load('yestar-sz','salesReceptionQuery');assert('聊天默认展示样本',d.querySelectorAll('.contact').length>0);click(d,'查询');assert('聊天查询展示会话',d.querySelectorAll('.contact').length>0&&d.querySelector('.messages').textContent.includes('合成演示对话'));d.querySelector('[aria-label="客户昵称"]').value='不存在的客户QA';click(d,'查询');assert('聊天无匹配反馈',d.querySelector('.chat-list').textContent.includes('没有匹配会话'));assert('聊天保持只读',!d.querySelector('.compose textarea'));
 d=await load('yestar-sz','messageStats');await waitFor(()=>d.querySelector('.chart svg'));assert('真实消息图表载入',d.querySelector('.chart svg')&&d.body.textContent.includes('936,804'));
 d=await load('bzds','allMenu');click(d,'同步菜单');const target=d.querySelector('[aria-label="目标企业"]');target.value='yestar-sz';target.dispatchEvent(new Event('change',{bubbles:true}));click(d,'预览变更');assert('平台菜单先预览目标和差异',d.querySelector('dialog').textContent.includes('艺星深圳')&&d.querySelector('dialog').textContent.includes('隐藏：无'));click(d,'取消',d.querySelector('dialog'));
 click(d,'批量删减菜单');d.querySelector('[aria-label="目标企业"]').value='yestar-sz';d.querySelector('[aria-label="目标企业"]').dispatchEvent(new Event('change',{bubbles:true}));d.querySelector('.tree-checks input[value="scriptUsageStats"]').checked=true;click(d,'预览变更');click(d,'应用');frame.remove();frame=document.createElement('iframe');frame.src='_shell.html?qa=1&tenant=yestar-sz&page=wechatStatus';document.querySelector('#stage').append(frame);await waitFor(()=>frame.contentDocument?.querySelector('[data-route="salesManage"]'));assert('平台修改反映到目标租户导航',!frame.contentDocument.querySelector('[data-route="scriptUsageStats"]'));assert('其他菜单保持可用',!!frame.contentDocument.querySelector('[data-route="wechatStatus"]'));
 d=await load('yestar-sz','allMenu');assert('不属于租户的路由被拒绝',d.body.dataset.contentReady==='error');
 }catch(e){assert('验收执行异常',false,String(e.stack||e));}finally{for(const key of Object.keys(localStorage).filter(k=>k.startsWith('admin-qa:v1:')||k.startsWith('admin-qa-nav:')))localStorage.removeItem(key);document.querySelector('#report').dataset.results=JSON.stringify(results);document.querySelector('#report').dataset.complete='true';}};
</script>
