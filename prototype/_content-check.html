<!doctype html><meta charset="utf-8"><title>管理后台内容验收</title><style>body{font:14px system-ui;padding:24px}iframe{width:1180px;height:900px;border:1px solid #ddd}pre{white-space:pre-wrap}button{padding:10px}</style><h1>管理后台内容验收</h1><p>逐个打开本地页面，检查标题、加载结果与页面内错误。</p><button id="start">开始检查全部入口</button><button id="unique">检查不同页面</button><p id="status">待开始</p><pre id="report"></pre><div id="stage"></div><script>
const results=[];let running=false;
async function start(unique){if(running)return;running=true;results.length=0;const data=await fetch('data/navigation-snapshot.json').then(r=>r.json());let jobs=data.tenants.flatMap(t=>t.menu.flatMap(g=>g.children||[g]).map(l=>({tenant:t.id,route:l.route,label:l.label})));if(unique){const seen=new Set();jobs=jobs.filter(j=>!seen.has(j.route)&&seen.add(j.route));}const count=jobs.length;let done=0;const status=document.querySelector('#status');async function worker(){while(jobs.length){const job=jobs.shift(),f=document.createElement('iframe');f.src='admin-content.html?tenant='+job.tenant+'&route='+job.route;document.querySelector('#stage').append(f);const errors=[];f.onload=()=>{f.contentWindow.addEventListener('error',e=>errors.push(e.message));f.contentWindow.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));};const started=Date.now();await new Promise(resolve=>{const timer=setInterval(()=>{const d=f.contentDocument,ready=d?.body?.dataset.contentReady;if(ready||Date.now()-started>20000){clearInterval(timer);resolve();}},100);});const d=f.contentDocument;const ready=d?.body?.dataset.contentReady;const item={...job,ok:ready==='true'&&!!d.querySelector('h1')&&!d.querySelector('.error-card'),heading:d?.querySelector('h1')?.textContent||d?.title,errors};if(errors.length)item.ok=false;results.push(item);done++;status.textContent=`${done} / ${count}；通过 ${results.filter(r=>r.ok).length}；失败 ${results.filter(r=>!r.ok).length}`;document.querySelector('#report').textContent=JSON.stringify({total:count,completed:done,passed:results.filter(r=>r.ok).length,failed:results.filter(r=>!r.ok)},null,2);f.remove();}}
await Promise.all([worker(),worker(),worker()]);status.dataset.complete='true';document.querySelector('#report').dataset.results=JSON.stringify(results);running=false;}
document.querySelector('#start').onclick=()=>start(false);document.querySelector('#unique').onclick=()=>start(true);
</script>
