<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>话术统计</title><link rel="stylesheet" href="_admin_list.css">
<style>
  /* 维度切换段 */
  .seg { display:inline-flex; border:1px solid #e5e8ec; border-radius:3px; overflow:hidden; height:30px; }
  .seg button { padding:0 12px; height:30px; font-size:12.5px; color:var(--text-2); background:#fff; border-right:1px solid #e5e8ec; }
  .seg button:last-child { border-right:none; }
  .seg button.active { background:var(--wx-green); color:#fff; }
  /* 口径说明 — 用 position:fixed 脱离父级 .filter-bar 的 overflow:auto，否则气泡会被裁掉 */
  .scope-tip {
    margin-left:auto; color:var(--text-3); font-size:12px; cursor:help;
  }
  .scope-tip:hover .scope-pop { display:block; }
  .scope-pop {
    display:none; position:fixed; right:16px; top:56px; width:380px;
    background:#fff; border:1px solid var(--border); border-radius:6px;
    padding:12px 14px; font-size:12.5px; color:var(--text-2); line-height:1.65;
    box-shadow:0 6px 18px rgba(0,0,0,.12); z-index:200; white-space:normal;
  }
  .scope-pop b { color:var(--text-1); }
  /* 表格中的"使用率"小条 */
  .ratio-cell { display:flex; align-items:center; gap:8px; min-width:140px; }
  .ratio-bar { flex:1; height:6px; background:#f0f2f5; border-radius:3px; overflow:hidden; max-width:90px; }
  .ratio-bar i { display:block; height:100%; background:var(--wx-green); border-radius:3px; }
  .ratio-num { font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--text-2); white-space:nowrap; }
  /* 居中列：表头与单元格内容同步居中 */
  .col-c { text-align: center; }
  .col-c .ratio-cell { justify-content: center; }
  /* modal 内列表 */
  .modal-meta { padding:0 20px 8px; color:var(--text-3); font-size:12.5px; display:flex; gap:14px; flex-wrap:wrap; }
  .modal-meta b { color:var(--text-1); font-weight:500; }
  /* 把弹窗改成 flex 列：列表区可伸缩，pager 锁在底部 */
  .modal-mask.show .modal { display:flex; flex-direction:column; max-height:88vh; }
  .modal-list-wrap { flex:1 1 auto; min-height:0; max-height:none; overflow:auto; padding:4px 20px 8px; }
  .modal-list-wrap table { font-size:12.5px; }
  .modal-list-wrap thead th { background:#fafbfc; position:sticky; top:0; z-index:1; }
  /* modal 内分页器：覆盖外层 .pager 的 fixed 定位，回归弹窗内常驻底部 */
  .modal-pager {
    position:static; left:auto; right:auto; bottom:auto; height:auto;
    flex:0 0 auto; padding:10px 20px 12px; border-top:1px solid var(--border);
  }
  /* 类目路径：二级 / 三级 / 四级 */
  .cat-path { display:inline-flex; align-items:center; gap:6px; line-height:1.4; flex-wrap:wrap; }
  .cat-path .cat-l2 { color:var(--text-1); font-weight:500; }
  .cat-path .cat-sep { color:var(--text-3); }
  .cat-path .cat-l3 { color:var(--text-2); }
  .cat-path .cat-l4 { color:var(--text-3); }
</style>
</head>
<body>

<div class="filter-bar">
  <div class="f-group" style="gap:4px;">
    <button class="btn sm" onclick="setRange('today')">今天</button>
    <button class="btn sm" onclick="setRange('yesterday')">昨天</button>
    <button class="btn sm" onclick="setRange('week')">本周</button>
    <button class="btn sm" onclick="setRange('month')">本月</button>
  </div>
  <div class="f-group">
    <input class="f-input date" type="date" id="dateFrom">
    <span class="f-sep">至</span>
    <input class="f-input date" type="date" id="dateTo">
  </div>
  <div class="f-group">
    <span class="f-label">维度</span>
    <div class="seg" id="segDim">
      <button data-dim="account" class="active" onclick="setDim('account')">按销售账号</button>
      <button data-dim="dept" onclick="setDim('dept')">按部门</button>
    </div>
  </div>
  <div class="f-group" id="grpDept">
    <span class="f-label">部门</span>
    <select class="f-select" id="fDept">
      <option value="">全部部门</option>
      <option>抖音IP</option>
      <option>小红书</option>
      <option>电商</option>
      <option>代运营</option>
      <option>自媒体</option>
    </select>
  </div>
  <div class="f-group" id="grpKw">
    <input class="f-input wide" id="kw" placeholder="销售账号 / 姓名">
  </div>
  <button class="btn primary" onclick="render()">🔍 搜索</button>
  <button class="btn" onclick="onReset()">重置</button>

  <span class="scope-tip">ⓘ 口径说明
    <div class="scope-pop">
      <div><b>话术使用量</b>：单聊场景，同一<b>销售账号</b>（或<b>部门</b>）给同一好友发的同一条话术，无论次数都只计 <b>1 次</b>。</div>
      <div style="margin-top:6px;"><b>沟通好友数</b>：窗口内该销售账号（或部门）发过<b>任何消息</b>的好友数（不限话术）。</div>
      <div style="margin-top:6px;"><b>使用率</b> = 话术使用量 ÷ 沟通好友数，反映"每个被沟通的好友平均收到几条不同话术"。</div>
    </div>
  </span>
</div>

<div class="table-wrap">
  <div class="table-card">
    <table id="tbl">
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info" id="pagerInfo">共 0 条</span>
  <select id="tablePageSize" onchange="onTablePageSize()">
    <option value="10">10条/页</option>
    <option value="20" selected>20条/页</option>
    <option value="50">50条/页</option>
  </select>
  <button class="pager-btn" onclick="goTablePage(-1)">‹</button>
  <span id="pageBtns"></span>
  <button class="pager-btn" onclick="goTablePage(1)">›</button>
</div>

<!-- 下钻 modal：话术使用明细 -->
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal wide">
    <div class="modal-header">
      <span id="modalTitle">话术使用明细</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-meta" id="modalMeta"></div>
    <div class="modal-list-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:60px;">#</th>
            <th>话术</th>
            <th style="width:170px;">使用条数<span style="color:var(--text-3);font-weight:400;"> · 同好友去重</span></th>
            <th style="width:120px;">沟通好友数</th>
            <th style="width:170px;">使用率</th>
          </tr>
        </thead>
        <tbody id="modalTbody"></tbody>
      </table>
    </div>
    <div class="pager modal-pager">
      <span class="pager-info" id="modalPagerInfo">共 0 条</span>
      <select id="modalPageSize" onchange="onModalPageSize()">
        <option value="10">10条/页</option>
        <option value="20">20条/页</option>
        <option value="50">50条/页</option>
      </select>
      <button class="pager-btn" onclick="goModalPage(-1)">‹</button>
      <span id="modalPageBtns"></span>
      <button class="pager-btn" onclick="goModalPage(1)">›</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// 根据部门权重 + 账号 used 总量，生成账号下话术明细（单条话术粒度，l3/l4 可能为空）
const SCRIPT_DETAILS = {};
ACCOUNTS.forEach(a => {
  const pref = DEPT_PREF[a.dept] || [];
  const wsum = pref.reduce((s, [,w]) => s + w, 0);
  const rows = pref.map(([sid, w]) => {
    const lib = SCRIPT_LIB[sid];
    const uses = Math.max(1, Math.round(a.used * w / wsum));
    // 单条话术粒度："使用条数·同好友去重"= 沟通好友数
    return { l2:lib.l2, l3:lib.l3 || null, l4:lib.l4 || null, uses, friends:uses };
  });
  SCRIPT_DETAILS[a.id] = rows;
});

// 类目级衰减系数：同一好友在同类目下平均收到多少条不同话术，决定 friends/uses 的比值
// 越接近 1 = 一个好友只收一次；越小 = 反复发同类话术
const CAT_FRIENDS_FACTOR = {
  '品牌/医院介绍':         0.92, // 一次破冰即可
  '竞对分析':               0.88, // 偶尔答疑
  '高新分院':               0.85,
  '微整科':                 0.85,
  '术后注意事项':           0.80, // 复查/拆线/消肿分次
  '皮肤科':                 0.78,
  '整形外科-鼻部':          0.75,
  '整形外科-眼部':          0.75,
  '外科-产品介绍':          0.75,
  '微创产品介绍':           0.70,
  '皮肤产品介绍':           0.65, // 热玛吉/超声炮/水光多产品轮发
  '明星美学':               0.65,
  '全院医生/医生技术介绍': 0.55, // 多院长团队依次介绍
  '明星博主do脸分享':       0.55, // 多个博主案例轮发
};

// 把单条话术粒度的明细，按"二级 / 三级 / 四级"类目聚合（缺级则只按存在的级聚合）
// uses = 类目内各话术（同好友去重）条数之和
// friends = 该类目下沟通过的不重复好友数；同一好友常会在同一末级类目下收到多条消息，按二级类目衰减系数模拟
function aggregateByCategory(details) {
  const map = {};
  details.forEach(d => {
    const k = d.l2 + '|' + (d.l3 || '') + '|' + (d.l4 || '');
    if (!map[k]) map[k] = { l2:d.l2, l3:d.l3 || null, l4:d.l4 || null, uses:0, friendsRaw:0 };
    map[k].uses       += d.uses;
    map[k].friendsRaw += d.friends;
  });
  return Object.values(map).map(r => {
    const factor = CAT_FRIENDS_FACTOR[r.l2] != null ? CAT_FRIENDS_FACTOR[r.l2] : 0.72;
    return {
      l2:r.l2, l3:r.l3, l4:r.l4,
      uses:r.uses,
      friends:Math.max(1, Math.round(r.friendsRaw * factor)),
    };
  }).sort((a,b) => b.uses - a.uses);
}

/* ========= 状态 ========= */
let DIM = 'account'; // account | dept

/* ========= 工具 ========= */
function fmt(n) { return Number(n).toLocaleString('zh-CN'); }
function ratio(used, talked) { return talked > 0 ? (used / talked) : 0; }
function ratioCell(used, talked) {
  const r = ratio(used, talked);
  // 用 max 1.5 作为条形参考
  const pct = Math.min(100, Math.round(r / 1.5 * 100));
  return `<div class="ratio-cell">
    <div class="ratio-bar"><i style="width:${pct}%"></i></div>
    <span class="ratio-num">${r.toFixed(2)} 条/人</span>
  </div>`;
}

/* ========= 维度切换 ========= */
function setDim(d) {
  DIM = d;
  document.querySelectorAll('#segDim button').forEach(b => {
    b.classList.toggle('active', b.dataset.dim === d);
  });
  document.getElementById('grpKw').style.display = d === 'account' ? '' : 'none';
  render();
}

/* ========= 时间快捷 ========= */
function setRange(k) {
  const today = new Date();
  const fmtD = d => d.toISOString().slice(0,10);
  const fr = document.getElementById('dateFrom');
  const to = document.getElementById('dateTo');
  if (k === 'today') { fr.value = to.value = fmtD(today); }
  else if (k === 'yesterday') {
    const d = new Date(today); d.setDate(d.getDate()-1);
    fr.value = to.value = fmtD(d);
  } else if (k === 'week') {
    const d = new Date(today); d.setDate(d.getDate()-((d.getDay()||7)-1));
    fr.value = fmtD(d); to.value = fmtD(today);
  } else if (k === 'month') {
    const d = new Date(today.getFullYear(), today.getMonth(), 1);
    fr.value = fmtD(d); to.value = fmtD(today);
  }
  render();
}

/* ========= 渲染 ========= */
let TABLE_ROWS = [];
let TABLE_KIND = 'account';
let tablePage = 1;
let tablePageSize = 20;

function render() {
  const dept = document.getElementById('fDept').value;
  const kw   = (document.getElementById('kw').value || '').trim();
  const thead = document.getElementById('thead');

  if (DIM === 'account') {
    thead.innerHTML = `<tr>
      <th style="width:50px;">#</th>
      <th style="width:160px;">销售账号</th>
      <th style="width:120px;">所属部门</th>
      <th class="col-c" style="width:140px;">话术使用量</th>
      <th class="col-c" style="width:120px;">沟通好友数</th>
      <th class="col-c" style="width:180px;">使用率</th>
      <th class="col-c" style="width:80px;">操作</th>
    </tr>`;
    let list = ACCOUNTS.slice();
    if (dept) list = list.filter(a => a.dept === dept);
    if (kw)   list = list.filter(a => a.name.includes(kw) || (a.alias||'').includes(kw));
    list.sort((a,b) => b.used - a.used);
    TABLE_ROWS = list;
    TABLE_KIND = 'account';
  } else {
    thead.innerHTML = `<tr>
      <th style="width:50px;">#</th>
      <th style="width:200px;">部门</th>
      <th style="width:90px;">账号数</th>
      <th class="col-c" style="width:140px;">话术使用量</th>
      <th class="col-c" style="width:120px;">沟通好友数</th>
      <th class="col-c" style="width:180px;">使用率</th>
      <th class="col-c" style="width:80px;">操作</th>
    </tr>`;
    const map = {};
    ACCOUNTS.forEach(a => {
      if (!map[a.dept]) map[a.dept] = { dept:a.dept, count:0, used:0, talked:0 };
      map[a.dept].count++;
      map[a.dept].used   += a.used;
      map[a.dept].talked += a.talked;
    });
    let list = Object.values(map);
    if (dept) list = list.filter(d => d.dept === dept);
    list.sort((a,b) => b.used - a.used);
    TABLE_ROWS = list;
    TABLE_KIND = 'dept';
  }
  tablePage = 1;
  renderTablePage();
}

function renderTablePage() {
  const tbody = document.getElementById('tbody');
  const total = TABLE_ROWS.length;
  const totalPages = Math.max(1, Math.ceil(total / tablePageSize));
  if (tablePage > totalPages) tablePage = totalPages;
  if (tablePage < 1) tablePage = 1;
  const start = (tablePage - 1) * tablePageSize;
  const pageRows = TABLE_ROWS.slice(start, start + tablePageSize);

  if (!pageRows.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">📭</div>暂无数据</div></td></tr>`;
  } else if (TABLE_KIND === 'account') {
    tbody.innerHTML = pageRows.map((a,i) => `
      <tr>
        <td class="col-num muted">${start + i + 1}</td>
        <td>
          <div style="line-height:1.35;">
            <div>${a.name}</div>
            <div style="color:var(--text-3);font-size:11.5px;">${a.alias||''}</div>
          </div>
        </td>
        <td><span class="tag">${a.dept}</span></td>
        <td class="col-num col-c success">${fmt(a.used)}</td>
        <td class="col-num col-c">${fmt(a.talked)}</td>
        <td class="col-c">${ratioCell(a.used, a.talked)}</td>
        <td class="col-actions col-c"><button class="row-action" onclick="openDetail('account','${a.id}')">明细</button></td>
      </tr>`).join('');
  } else {
    tbody.innerHTML = pageRows.map((d,i) => `
      <tr>
        <td class="col-num muted">${start + i + 1}</td>
        <td><span class="tag">${d.dept}</span></td>
        <td class="col-num">${d.count}</td>
        <td class="col-num col-c success">${fmt(d.used)}</td>
        <td class="col-num col-c">${fmt(d.talked)}</td>
        <td class="col-c">${ratioCell(d.used, d.talked)}</td>
        <td class="col-actions col-c"><button class="row-action" onclick="openDetail('dept','${d.dept}')">明细</button></td>
      </tr>`).join('');
  }

  document.getElementById('pagerInfo').textContent = `共 ${total} 条`;
  let btns = '';
  for (let p = 1; p <= totalPages; p++) {
    btns += `<button class="pager-btn ${p === tablePage ? 'cur' : ''}" onclick="goTablePage(0, ${p})">${p}</button>`;
  }
  document.getElementById('pageBtns').innerHTML = btns;
}

function goTablePage(delta, abs) {
  if (abs != null) tablePage = abs;
  else tablePage = tablePage + delta;
  renderTablePage();
}
function onTablePageSize() {
  tablePageSize = parseInt(document.getElementById('tablePageSize').value, 10) || 20;
  tablePage = 1;
  renderTablePage();
}

/* ========= 下钻 ========= */
function openDetail(kind, key) {
  const range = `${document.getElementById('dateFrom').value || '不限'} ~ ${document.getElementById('dateTo').value || '不限'}`;
  let title, meta, rows;
  if (kind === 'account') {
    const acc = ACCOUNTS.find(a => a.id === key);
    title = `${acc.name} 的话术使用明细`;
    meta = [
      `销售账号：<b>${acc.name}</b>${acc.alias ? `（${acc.alias}）` : ''}`,
      `所属部门：<b>${acc.dept}</b>`,
      `时间范围：<b>${range}</b>`,
      `话术使用量：<b>${fmt(acc.used)}</b>`,
      `沟通好友数：<b>${fmt(acc.talked)}</b>`,
      `使用率：<b>${ratio(acc.used, acc.talked).toFixed(2)} 条/人</b>`,
    ];
    rows = aggregateByCategory(SCRIPT_DETAILS[key] || []);
  } else {
    const accs = ACCOUNTS.filter(a => a.dept === key);
    const used   = accs.reduce((s,a)=>s+a.used,0);
    const talked = accs.reduce((s,a)=>s+a.talked,0);
    title = `${key} 的话术使用明细`;
    meta = [
      `部门：<b>${key}</b>`,
      `账号数：<b>${accs.length}</b>`,
      `时间范围：<b>${range}</b>`,
      `话术使用量：<b>${fmt(used)}</b>`,
      `沟通好友数：<b>${fmt(talked)}</b>`,
      `使用率：<b>${ratio(used, talked).toFixed(2)} 条/人</b>`,
    ];
    // 部门视角：把所有账号的明细聚合到"二级/三级"类目
    const allDetails = [];
    accs.forEach(a => allDetails.push(...(SCRIPT_DETAILS[a.id]||[])));
    rows = aggregateByCategory(allDetails);
  }
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMeta').innerHTML = meta.map(s => `<span>${s}</span>`).join('');
  MODAL_ROWS = rows;
  modalPage = 1;
  renderModalRows();
  document.getElementById('modalMask').classList.add('show');
}
function closeModal() { document.getElementById('modalMask').classList.remove('show'); }

let modalPageSize = 10;

  const totalPages = Math.max(1, Math.ceil(total / modalPageSize));

            ${r.l4 ? `<span class="cat-sep">：</span><span class="cat-l4">${r.l4}</span>` : ''}

        <td class="col-num success">${fmt(r.uses)}</td>

  document.getElementById('modalPagerInfo').textContent = `共 ${total} 条`;
  let btns = '';
  for (let p = 1; p <= totalPages; p++) {
    btns += `<button class="pager-btn ${p === modalPage ? 'cur' : ''}" onclick="goModalPage(0, ${p})">${p}</button>`;
  }
  document.getElementById('modalPageBtns').innerHTML = btns;
}
function goModalPage(delta, abs) {
  if (abs != null) modalPage = abs;
  else modalPage = modalPage + delta;
  renderModalRows();
}
function onModalPageSize() {
  modalPageSize = parseInt(document.getElementById('modalPageSize').value, 10) || 10;

  renderModalRows();
}
