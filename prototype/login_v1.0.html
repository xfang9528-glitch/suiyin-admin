<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佰智德三私域 · 管理后台登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #044d2c;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  button, input { font-family: inherit; }

  :root {
    --green: #07c160;
    --green-dark: #06ad56;
    --green-light: rgba(7,193,96,0.1);
  }

  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
  }
  body::before {
    width: 55vw; height: 55vw;
    background: rgba(7,193,96,0.07);
    top: -25vw; left: -20vw;
  }
  body::after {
    width: 40vw; height: 40vw;
    background: rgba(7,193,96,0.05);
    bottom: -18vw; right: -12vw;
  }

  /* ===== 卡片 ===== */
  .card {
    display: flex;
    width: clamp(560px, 88vw, 1200px);
    height: clamp(440px, 78vh, 720px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 28px 90px rgba(0,0,0,0.4);
    position: relative;
    z-index: 1;
  }

  /* ===== 左侧品牌区 ===== */
  .brand {
    flex: 1;
    background: var(--green);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .brand::before {
    content: '';
    position: absolute;
    width: 55%;
    padding-bottom: 55%;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    top: -18%; right: -18%;
  }
  .brand::after {
    content: '';
    position: absolute;
    width: 40%;
    padding-bottom: 40%;
    border-radius: 50%;
    background: rgba(0,0,0,0.07);
    bottom: -14%; left: -12%;
  }
  .brand-logo {
    position: absolute;
    top: 6%; left: 8%;
    display: flex; align-items: center; gap: 8px;
    z-index: 1;
  }
  .brand-logo-icon {
    width: 32px; height: 32px; border-radius: 7px;
    background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .brand-logo-text { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
  .brand-main { text-align: center; position: relative; z-index: 1; }
  .brand-title {
    font-size: clamp(22px, 2.8vw, 32px);
    font-weight: 700;
    letter-spacing: 3px;
  }
  .brand-subtitle {
    font-size: clamp(11px, 1.1vw, 14px);
    color: rgba(255,255,255,0.7);
    letter-spacing: 2px;
    margin-top: 10px;
  }
  .brand-footer {
    position: absolute; bottom: 5%;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    z-index: 1;
  }

  /* ===== 右侧表单区 ===== */
  .form-side {
    width: 42%;
    flex-shrink: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* 面板（views 之间切换） */
  .view {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 0 clamp(28px, 5%, 52px);
  }
  .view.active { display: flex; }
  .view-inner { width: 100%; max-width: 320px; }

  /* 顶部返回链接 */
  .back-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 18px 24px;
    font-size: 13px;
    color: #8a96a3;
    display: none;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: color 0.15s;
  }
  .back-bar:hover { color: var(--green); }
  .back-bar.visible { display: flex; }

  /* 标题 */
  .form-title {
    font-size: clamp(18px, 1.8vw, 22px);
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 28px;
    text-align: center;
  }
  .form-title.green { color: var(--green); }

  /* 步骤条 */
  .steps {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    gap: 0;
  }
  .step-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
  }
  .step-item:not(:last-child)::after {
    content: '';
    position: absolute;
    top: 10px;
    left: calc(50% + 12px);
    width: calc(80px - 24px);
    height: 1px;
    background: #e5e8ec;
  }
  .step-item:not(:last-child).done::after,
  .step-item:not(:last-child).active::after {
    background: var(--green);
  }
  .step-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1px solid #d0d5dd;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: #aab0bb;
    transition: all 0.2s;
    position: relative;
    z-index: 1;
  }
  .step-item.done .step-dot {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .step-item.active .step-dot {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .step-label {
    font-size: 11px;
    color: #aab0bb;
    white-space: nowrap;
    width: 80px;
    text-align: center;
  }
  .step-item.done .step-label,
  .step-item.active .step-label { color: var(--green); font-weight: 500; }

  /* 输入框 */
  .field { margin-bottom: 14px; }
  .input-group {
    display: flex;
    align-items: center;
    height: 44px;
    border: 1px solid #e5e8ec;
    border-radius: 22px;
    background: #f7f8fa;
    padding: 0 16px;
    transition: all 0.15s;
  }
  .input-group:focus-within {
    border-color: var(--green);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(7,193,96,0.1);
  }
  .country-code {
    font-size: 14px;
    color: #4a5564;
    padding-right: 10px;
    border-right: 1px solid #e0e3e8;
    height: 20px;
    line-height: 20px;
    flex-shrink: 0;
    margin-right: 10px;
  }
  .input-group input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: #1a1a1a;
    height: 100%;
  }
  .input-group input::placeholder { color: #c0c6ce; }
  .eye-btn {
    background: none;
    border: none;
    color: #aab0bb;
    cursor: pointer;
    font-size: 15px;
    padding: 2px 0 2px 8px;
    line-height: 1;
    flex-shrink: 0;
  }
  .eye-btn:hover { color: var(--green); }

  /* 主按钮 */
  .btn-primary {
    width: 100%;
    height: 44px;
    border-radius: 22px;
    background: var(--green);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 3px;
    cursor: pointer;
    border: none;
    margin-top: 10px;
    transition: all 0.15s;
    box-shadow: 0 2px 10px rgba(7,193,96,0.3);
  }
  .btn-primary:hover {
    background: var(--green-dark);
    box-shadow: 0 4px 16px rgba(7,193,96,0.4);
    transform: translateY(-1px);
  }
  .btn-primary:active { transform: translateY(0); }

  /* 忘记密码链接 */
  .forgot-link {
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    color: #8a96a3;
    cursor: pointer;
    transition: color 0.15s;
  }
  .forgot-link:hover { color: var(--green); }

  /* 成功态 */
  .success-icon {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    position: relative;
  }
  .success-icon::before {
    content: '✓';
    color: #fff;
    font-size: 32px;
    font-weight: 700;
  }
  /* 散点装饰 */
  .success-dots {
    position: absolute;
    inset: -20px;
    pointer-events: none;
  }
  .success-dots span {
    position: absolute;
    border-radius: 50%;
    background: var(--green);
    opacity: 0.5;
  }
  .success-msg {
    text-align: center;
    font-size: 14px;
    color: #4a5564;
    line-height: 2;
    margin-top: 4px;
  }
  .success-fallback {
    text-align: center;
    font-size: 12px;
    color: #aab0bb;
    margin-top: 10px;
  }
  .success-fallback a {
    color: var(--green);
    cursor: pointer;
    text-decoration: none;
  }
  .success-fallback a:hover { text-decoration: underline; }

  @media (max-width: 620px) {
    .brand { display: none; }
    .form-side { width: 100%; }
    .card { width: 100vw; height: 100vh; border-radius: 0; }
  }
</style>
</head>
<body>

<div class="card">
  <!-- 左侧品牌 -->
  <aside class="brand">
    <div class="brand-logo">
      <div class="brand-logo-icon">☁</div>
      <div class="brand-logo-text">佰智德三私域</div>
    </div>
    <div class="brand-main">
      <div class="brand-title">私域销售新体验</div>
      <div class="brand-subtitle">An evolution of sales</div>
    </div>
    <div class="brand-footer">© 2026 佰智德三 · 碎银私域 SaaS</div>
  </aside>

  <!-- 右侧表单 -->
  <section class="form-side">

    <!-- 返回登录 -->
    <div class="back-bar" id="backBar" onclick="showLogin()">
      ‹ 返回登录
    </div>

    <!-- View 1：登录 -->
    <div class="view active" id="viewLogin">
      <div class="view-inner">
        <div class="form-title">登录</div>

        <div class="field">
          <div class="input-group">
            <span class="country-code">+86</span>
            <input type="tel" id="loginPhone" placeholder="请输入手机号" maxlength="11">
          </div>
        </div>
        <div class="field">
          <div class="input-group">
            <input type="password" id="loginPwd" placeholder="请输入密码（6-16位字母加数字）" maxlength="16">
            <button class="eye-btn" type="button" onclick="toggleEye('loginPwd', this)">👁</button>
          </div>
        </div>

        <button class="btn-primary" onclick="doLogin()">登 录</button>
        <div class="forgot-link" onclick="showForgot()">忘记密码？</div>
      </div>
    </div>

    <!-- View 2：忘记密码 Step 1 校验身份 -->
    <div class="view" id="viewStep1">
      <div class="view-inner">
        <div class="form-title green">忘记密码</div>
        <div class="steps">
          <div class="step-item active" id="s1">
            <div class="step-dot">✓</div>
            <div class="step-label">校验身份</div>
          </div>
          <div class="step-item" id="s2">
            <div class="step-dot"></div>
            <div class="step-label">设置密码</div>
          </div>
          <div class="step-item" id="s3">
            <div class="step-dot"></div>
            <div class="step-label">重置成功</div>
          </div>
        </div>

        <div class="field">
          <div class="input-group">
            <span class="country-code">+86</span>
            <input type="tel" placeholder="请输入手机号" maxlength="11">
          </div>
        </div>
        <div class="field">
          <div class="input-group">
            <input type="password" id="oldPwd" placeholder="请输入旧密码" maxlength="16">
            <button class="eye-btn" type="button" onclick="toggleEye('oldPwd', this)">👁</button>
          </div>
        </div>

        <button class="btn-primary" onclick="goStep2()">下 一 步</button>
      </div>
    </div>

    <!-- View 3：忘记密码 Step 2 设置密码 -->
    <div class="view" id="viewStep2">
      <div class="view-inner">
        <div class="form-title green">忘记密码</div>
        <div class="steps">
          <div class="step-item done" id="s1b">
            <div class="step-dot">✓</div>
            <div class="step-label">校验身份</div>
          </div>
          <div class="step-item active" id="s2b">
            <div class="step-dot">✓</div>
            <div class="step-label">设置密码</div>
          </div>
          <div class="step-item" id="s3b">
            <div class="step-dot"></div>
            <div class="step-label">重置成功</div>
          </div>
        </div>

        <div class="field">
          <div class="input-group">
            <input type="password" id="newPwd1" placeholder="请输入新密码（6-16位字母加数字）" maxlength="16">
            <button class="eye-btn" type="button" onclick="toggleEye('newPwd1', this)">👁</button>
          </div>
        </div>
        <div class="field">
          <div class="input-group">
            <input type="password" id="newPwd2" placeholder="请再次输入新密码（6-16位字母加数字）" maxlength="16">
            <button class="eye-btn" type="button" onclick="toggleEye('newPwd2', this)">👁</button>
          </div>
        </div>

        <button class="btn-primary" onclick="goStep3()">重置密码并登录</button>
      </div>
    </div>

    <!-- View 4：忘记密码 Step 3 成功 -->
    <div class="view" id="viewStep3">
      <div class="view-inner" style="text-align:center;">
        <div class="form-title green">忘记密码</div>
        <div class="steps">
          <div class="step-item done">
            <div class="step-dot">✓</div>
            <div class="step-label">校验身份</div>
          </div>
          <div class="step-item done">
            <div class="step-dot">✓</div>
            <div class="step-label">设置密码</div>
          </div>
          <div class="step-item active">
            <div class="step-dot">✓</div>
            <div class="step-label">重置成功</div>
          </div>
        </div>

        <div style="position:relative; width:72px; margin: 8px auto 20px;">
          <div class="success-icon"></div>
          <!-- 散点 -->
          <span style="position:absolute;width:6px;height:6px;border-radius:50%;background:#07c160;opacity:.5;top:-8px;left:28px;"></span>
          <span style="position:absolute;width:5px;height:5px;border-radius:50%;background:#07c160;opacity:.4;top:4px;right:-10px;"></span>
          <span style="position:absolute;width:4px;height:4px;border-radius:50%;background:#a78bfa;opacity:.5;top:-4px;right:-6px;"></span>
          <span style="position:absolute;width:5px;height:5px;border-radius:50%;background:#60a5fa;opacity:.4;bottom:0;left:-10px;"></span>
          <span style="position:absolute;width:4px;height:4px;border-radius:50%;background:#f59e0b;opacity:.4;bottom:-6px;right:0;"></span>
        </div>

        <div class="success-msg">
          已成功重置密码，正在为您登录中 <span id="countdown">4</span>s
        </div>
        <div class="success-fallback">
          若没有正常跳转，请点击 <a onclick="goShell()">登录</a>
        </div>
      </div>
    </div>

  </section>
</div>

<script>
  let countdownTimer = null;

  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showLogin() {
    showView('viewLogin');
    document.getElementById('backBar').classList.remove('visible');
    clearInterval(countdownTimer);
  }

  function showForgot() {
    showView('viewStep1');
    document.getElementById('backBar').classList.add('visible');
  }

  function goStep2() {
    showView('viewStep2');
  }

  function goStep3() {
    showView('viewStep3');
    document.getElementById('backBar').classList.remove('visible');
    let n = 4;
    document.getElementById('countdown').textContent = n;
    countdownTimer = setInterval(() => {
      n--;
      document.getElementById('countdown').textContent = n;
      if (n <= 0) { clearInterval(countdownTimer); goShell(); }
    }, 1000);
  }

  function goShell() {
    window.location.href = '_shell.html';
  }

  function doLogin() {
    const btn = document.querySelector('#viewLogin .btn-primary');
    btn.textContent = '登录中...';
    btn.style.opacity = '0.8';
    btn.disabled = true;
    setTimeout(() => goShell(), 600);
  }

  function toggleEye(inputId, btn) {
    const input = document.getElementById(inputId);
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
