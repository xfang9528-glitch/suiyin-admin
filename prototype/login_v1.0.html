<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佰智德三私域 · 管理后台登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #044d2c;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  button, input { font-family: inherit; }

  :root {
    --green: #07c160;
    --green-dark: #06ad56;
    --green-light: rgba(7,193,96,0.1);
  }

  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
  }
  body::before {
    width: 55vw; height: 55vw;
    background: rgba(7,193,96,0.07);
    top: -25vw; left: -20vw;
  }
  body::after {
    width: 40vw; height: 40vw;
    background: rgba(7,193,96,0.05);
    bottom: -18vw; right: -12vw;
  }

  /* ===== 卡片 ===== */
  .card {
    display: flex;
    width: clamp(560px, 88vw, 1200px);
    height: clamp(440px, 78vh, 720px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 28px 90px rgba(0,0,0,0.4);
    position: relative;
    z-index: 1;
  }

  /* ===== 左侧品牌区 ===== */
  .brand {
    flex: 1;
    background: var(--green);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .brand::before {
    content: '';
    position: absolute;
    width: 55%;
    padding-bottom: 55%;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    top: -18%; right: -18%;
  }
  .brand::after {
    content: '';
    position: absolute;
    width: 40%;
    padding-bottom: 40%;
    border-radius: 50%;
    background: rgba(0,0,0,0.07);
    bottom: -14%; left: -12%;
  }
  .brand-logo {
    position: absolute;
    top: 6%; left: 8%;
    display: flex; align-items: center; gap: 8px;
    z-index: 1;
  }
  .brand-logo-icon {
    width: 32px; height: 32px; border-radius: 7px;
    background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .brand-logo-text { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
  .brand-main { text-align: center; position: relative; z-index: 1; }
  .brand-title {
    font-size: clamp(22px, 2.8vw, 32px);
    font-weight: 700;
    letter-spacing: 3px;
  }
  .brand-subtitle {
    font-size: clamp(11px, 1.1vw, 14px);
    color: rgba(255,255,255,0.7);
    letter-spacing: 2px;
    margin-top: 10px;
  }
  .brand-footer {
    position: absolute; bottom: 5%;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    z-index: 1;
  }

  /* ===== 右侧表单区 ===== */
  .form-side {
    width: 42%;
    flex-shrink: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* 面板（views 之间切换） */
  .view {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 0 clamp(28px, 5%, 52px);
  }
  .view.active { display: flex; }
  .view-inner { width: 100%; max-width: 320px; }

  /* 顶部返回链接 */
  .back-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 18px 24px;
    font-size: 13px;
    color: #8a96a3;
    display: none;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: color 0.15s;
  }
  .back-bar:hover { color: var(--green); }
  .back-bar.visible { display: flex; }

  /* 标题 */
  .form-title {
    font-size: clamp(18px, 1.8vw, 22px);
    font-weight: 600;
    color: #1a1a1a;
    margin-bottom: 28px;
    text-align: center;
  }
  .form-title.green { color: var(--green); }

  /* 步骤条 */
  .steps {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    gap: 0;
  }
  .step-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
  }
  .step-item:not(:last-child)::after {
    content: '';
    position: absolute;
    top: 10px;
    left: calc(50% + 12px);
    width: calc(80px - 24px);
    height: 1px;
    background: #e5e8ec;
  }
  .step-item:not(:last-child).done::after,
  .step-item:not(:last-child).active::after {
    background: var(--green);
  }
  .step-dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 1px solid #d0d5dd;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: #aab0bb;
    transition: all 0.2s;
    position: relative;
    z-index: 1;
  }
  .step-item.done .step-dot {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .step-item.active .step-dot {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .step-label {
    font-size: 11px;
    color: #aab0bb;
    white-space: nowrap;
    width: 80px;
    text-align: center;
  }
  .step-item.done .step-label,
  .step-item.active .step-label { color: var(--green); font-weight: 500; }

  /* 输入框 */
  .field { margin-bottom: 14px; }
  .input-group {
    display: flex;
    align-items: center;
    height: 44px;
    border: 1px solid #e5e8ec;
    border-radius: 22px;
    background: #f7f8fa;
    padding: 0 16px;
    transition: all 0.15s;
  }
  .input-group:focus-within {
    border-color: var(--green);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(7,193,96,0.1);
  }
  .country-code {
    font-size: 14px;
    color: #4a5564;
    padding-right: 10px;
    border-right: 1px solid #e0e3e8;
    height: 20px;
    line-height: 20px;
    flex-shrink: 0;
    margin-right: 10px;
  }
  .input-group input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    color: #1a1a1a;
    height: 100%;
  }
  .input-group input::placeholder { color: #c0c6ce; }
  .eye-btn {
    background: none;
    border: none;
    color: #aab0bb;
    cursor: pointer;
    font-size: 15px;
    padding: 2px 0 2px 8px;
    line-height: 1;
    flex-shrink: 0;
  }
  .eye-btn:hover { color: var(--green); }

  /* 主按钮 */
  .btn-primary {
    width: 100%;
    height: 44px;
    border-radius: 22px;
    background: var(--green);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 3px;
    cursor: pointer;
    border: none;
    margin-top: 10px;
    transition: all 0.15s;
    box-shadow: 0 2px 10px rgba(7,193,96,0.3);
  }
  .btn-primary:hover {
    background: var(--green-dark);
    box-shadow: 0 4px 16px rgba(7,193,96,0.4);
    transform: translateY(-1px);
  }
  .btn-primary:active { transform: translateY(0); }

  /* 忘记密码链接 */
  .forgot-link {
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    color: #8a96a3;
    cursor: pointer;
    transition: color 0.15s;
  }
  .forgot-link:hover { color: var(--green); }

  /* 成功态 */
  .success-icon {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    position: relative;
  }
  .success-icon::before {
    content: '✓';
    color: #fff;
    font-size: 32px;
    font-weight: 700;
  }
  /* 散点装饰 */
  .success-dots {
    position: absolute;
    inset: -20px;
    pointer-events: none;
  }
  .success-dots span {
    position: absolute;
    border-radius: 50%;
    background: var(--green);
    opacity: 0.5;
  }
  .success-msg {
    text-align: center;
    font-size: 14px;
    color: #4a5564;
    line-height: 2;
    margin-top: 4px;
  }
  .success-fallback {
    text-align: center;
    font-size: 12px;
    color: #aab0bb;
    margin-top: 10px;
  }
  .success-fallback a {
    color: var(--green);
    cursor: pointer;
    text-decoration: none;
  }
  .success-fallback a:hover { text-decoration: underline; }

  /* ===== #4746 弱口令强制改密（复用忘记密码流程的卡片/步骤条/输入框/主按钮） ===== */
  /* 原因说明：_shell.html 的黄色提示条 .source-index-alert（同色值） */
  .source-index-alert {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: -12px 0 20px;
    padding: 8px 14px;
    color: #e6a23c;
    background: #fdf6ec;
    border-radius: 4px;
    font-size: 13px;
    line-height: 20px;
    text-align: left;
  }
  .index-warning-icon { width: 16px; height: 16px; flex: none; display: inline-flex; margin-top: 2px; }
  .index-warning-icon svg { width: 16px; height: 16px; fill: currentColor; }
  .force-pane { display: none; }
  .force-pane.active { display: block; }
  /* 报错：后台已有的 Element 错误红（_admin_list.css 必填星号同色） */
  .input-group.err,
  .input-group.err:focus-within { border-color: #f56c6c; box-shadow: none; }
  .f-err { font-size: 12px; color: #f56c6c; margin: 4px 0 0 16px; line-height: 1.5; text-align: left; }
  .f-tip { font-size: 12px; color: #8a96a3; text-align: center; margin: 2px 0 0; }
  .cd-hint { font-size: 12px; color: #e6a23c; text-align: center; margin-top: 10px; }
  .btn-primary:disabled { cursor: not-allowed; transform: none; }
  /* 提示：后台内容页 #toast（admin-content.css 同款） */
  #toast {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    padding: 12px 22px; background: #253d49eb; color: white; border-radius: 5px;
    box-shadow: 0 5px 20px #0002; z-index: 1000; display: none; max-width: 90vw;
    line-height: 1.5; font-size: 13px;
  }
  #toast.visible { display: block; }

  @media (max-width: 620px) {
    .brand { display: none; }
    .form-side { width: 100%; }
    .card { width: 100vw; height: 100vh; border-radius: 0; }
  }
</style>
</head>
<body>

<div class="card">
  <!-- 左侧品牌 -->
  <aside class="brand">
    <div class="brand-logo">
      <div class="brand-logo-icon">☁</div>
      <div class="brand-logo-text">佰智德三私域</div>
    </div>
    <div class="brand-main">
      <div class="brand-title">私域销售新体验</div>
      <div class="brand-subtitle">An evolution of sales</div>
    </div>
    <div class="brand-footer">© 2026 佰智德三 · 碎银私域 SaaS</div>
  </aside>

  <!-- 右侧表单 -->
  <section class="form-side">

    <!-- 返回登录 -->
    <div class="back-bar" id="backBar" onclick="showLogin()">
      ‹ 返回登录
    </div>

    <!-- View 1：登录 -->
    <div class="view active" id="viewLogin">
      <div class="view-inner">
        <div class="form-title">登录</div>

        <div class="field">
          <div class="input-group">
            <span class="country-code">+86</span>
            <input type="tel" id="loginPhone" placeholder="请输入手机号" maxlength="11">
          </div>
        </div>
        <div class="field">
          <div class="input-group">
            <input type="password" id="loginPwd" placeholder="请输入密码" maxlength="20">
            <button class="eye-btn" type="button" onclick="toggleEye('loginPwd', this)">👁</button>
          </div>
        </div>

        <button class="btn-primary" onclick="doLogin()">登 录</button>
        <div class="forgot-link" onclick="showForgot()">忘记密码？</div>
      </div>
    </div>

    <!-- View 2：忘记密码 Step 1 校验身份 -->
    <div class="view" id="viewStep1">
      <div class="view-inner">
        <div class="form-title green">忘记密码</div>
        <div class="steps">
          <div class="step-item active" id="s1">
            <div class="step-dot">✓</div>
            <div class="step-label">校验身份</div>
          </div>
          <div class="step-item" id="s2">
            <div class="step-dot"></div>
            <div class="step-label">设置密码</div>
          </div>
          <div class="step-item" id="s3">
            <div class="step-dot"></div>
            <div class="step-label">重置成功</div>
          </div>
        </div>

        <div class="field">
          <div class="input-group">
            <span class="country-code">+86</span>
            <input type="tel" placeholder="请输入手机号" maxlength="11">
          </div>
        </div>
        <div class="field">
          <div class="input-group">
            <input type="password" id="oldPwd" placeholder="请输入旧密码" maxlength="20">
            <button class="eye-btn" type="button" onclick="toggleEye('oldPwd', this)">👁</button>
          </div>
        </div>

        <button class="btn-primary" onclick="goStep2()">下 一 步</button>
      </div>
    </div>

    <!-- View 3：忘记密码 Step 2 设置密码 -->
    <div class="view" id="viewStep2">
      <div class="view-inner">
        <div class="form-title green">忘记密码</div>
        <div class="steps">
          <div class="step-item done" id="s1b">
            <div class="step-dot">✓</div>
            <div class="step-label">校验身份</div>
          </div>
          <div class="step-item active" id="s2b">
            <div class="step-dot">✓</div>
            <div class="step-label">设置密码</div>
          </div>
          <div class="step-item" id="s3b">
            <div class="step-dot"></div>
            <div class="step-label">重置成功</div>
          </div>
        </div>

        <div class="field">
          <div class="input-group">
            <input type="password" id="newPwd1" placeholder="请输入新密码（8-20位，含字母和数字）" maxlength="20">
            <button class="eye-btn" type="button" onclick="toggleEye('newPwd1', this)">👁</button>
          </div>
        </div>
        <div class="field">
          <div class="input-group">
            <input type="password" id="newPwd2" placeholder="请再次输入新密码" maxlength="20">
            <button class="eye-btn" type="button" onclick="toggleEye('newPwd2', this)">👁</button>
          </div>
        </div>

        <button class="btn-primary" onclick="goStep3()">重置密码并登录</button>
      </div>
    </div>

    <!-- View 4：忘记密码 Step 3 成功 -->
    <div class="view" id="viewStep3">
      <div class="view-inner" style="text-align:center;">
        <div class="form-title green">忘记密码</div>
        <div class="steps">
          <div class="step-item done">
            <div class="step-dot">✓</div>
            <div class="step-label">校验身份</div>
          </div>
          <div class="step-item done">
            <div class="step-dot">✓</div>
            <div class="step-label">设置密码</div>
          </div>
          <div class="step-item active">
            <div class="step-dot">✓</div>
            <div class="step-label">重置成功</div>
          </div>
        </div>

        <div style="position:relative; width:72px; margin: 8px auto 20px;">
          <div class="success-icon"></div>
          <!-- 散点 -->
          <span style="position:absolute;width:6px;height:6px;border-radius:50%;background:#07c160;opacity:.5;top:-8px;left:28px;"></span>
          <span style="position:absolute;width:5px;height:5px;border-radius:50%;background:#07c160;opacity:.4;top:4px;right:-10px;"></span>
          <span style="position:absolute;width:4px;height:4px;border-radius:50%;background:#a78bfa;opacity:.5;top:-4px;right:-6px;"></span>
          <span style="position:absolute;width:5px;height:5px;border-radius:50%;background:#60a5fa;opacity:.4;bottom:0;left:-10px;"></span>
          <span style="position:absolute;width:4px;height:4px;border-radius:50%;background:#f59e0b;opacity:.4;bottom:-6px;right:0;"></span>
        </div>

        <div class="success-msg">
          已成功重置密码，正在为您登录中 <span id="countdown">4</span>s
        </div>
        <div class="success-fallback">
          若没有正常跳转，请点击 <a onclick="goShell()">登录</a>
        </div>
      </div>
    </div>

    <!-- View 5：#4746 强制改密（沿用忘记密码三步流程；登录直达从第 2 步开始，428 进入从第 1 步开始） -->
    <div class="view" id="viewForce">
      <div class="view-inner" id="forceInner">
        <div class="form-title green">修改密码</div>
        <div class="source-index-alert" id="forceAlert"><span class="index-warning-icon"><svg viewBox="0 0 1024 1024" aria-hidden="true"><path d="M512 64a448 448 0 1 1 0 896 448 448 0 0 1 0-896m0 192a58.43 58.43 0 0 0-58.24 63.744l23.36 256.384a35.072 35.072 0 0 0 69.76 0l23.296-256.384A58.43 58.43 0 0 0 512 256m0 512a51.2 51.2 0 1 0 0-102.4 51.2 51.2 0 0 0 0 102.4"/></svg></span><span id="forceReason"></span></div>
        <div class="steps" id="forceSteps">
          <div class="step-item"><div class="step-dot"></div><div class="step-label">校验身份</div></div>
          <div class="step-item"><div class="step-dot"></div><div class="step-label">设置密码</div></div>
          <div class="step-item"><div class="step-dot"></div><div class="step-label">修改成功</div></div>
        </div>

        <!-- 第 1 步：校验身份（输入旧密码） -->
        <div class="force-pane" id="forcePane1">
          <div class="field">
            <div class="input-group">
              <span class="country-code">+86</span>
              <input type="tel" id="forcePhone" disabled>
            </div>
          </div>
          <div class="field">
            <div class="input-group">
              <input type="password" id="forceOld" placeholder="请输入旧密码" maxlength="20">
              <button class="eye-btn" type="button" onclick="toggleEye('forceOld', this)">👁</button>
            </div>
          </div>
          <button class="btn-primary" id="forceNext" onclick="forceNext()">下 一 步</button>
        </div>

        <!-- 第 2 步：设置密码 -->
        <div class="force-pane" id="forcePane2">
          <div class="field">
            <div class="input-group">
              <input type="password" id="forceNew" placeholder="请输入新密码（8-20位，含字母和数字）" maxlength="20">
              <button class="eye-btn" type="button" onclick="toggleEye('forceNew', this)">👁</button>
            </div>
          </div>
          <div class="field">
            <div class="input-group">
              <input type="password" id="forceConfirm" placeholder="请再次输入新密码" maxlength="20">
              <button class="eye-btn" type="button" onclick="toggleEye('forceConfirm', this)">👁</button>
            </div>
          </div>
          <div class="f-tip" id="forceTip"></div>
          <div class="cd-hint" id="forceCdHint" hidden></div>
          <button class="btn-primary" id="forceSubmit" onclick="forceSubmit()">确认修改</button>
        </div>

        <!-- 第 3 步：修改成功 -->
        <div class="force-pane" id="forcePane3">
          <div style="position:relative; width:72px; margin: 8px auto 20px;">
            <div class="success-icon"></div>
            <span style="position:absolute;width:6px;height:6px;border-radius:50%;background:#07c160;opacity:.5;top:-8px;left:28px;"></span>
            <span style="position:absolute;width:5px;height:5px;border-radius:50%;background:#07c160;opacity:.4;top:4px;right:-10px;"></span>
            <span style="position:absolute;width:4px;height:4px;border-radius:50%;background:#a78bfa;opacity:.5;top:-4px;right:-6px;"></span>
            <span style="position:absolute;width:5px;height:5px;border-radius:50%;background:#60a5fa;opacity:.4;bottom:0;left:-10px;"></span>
            <span style="position:absolute;width:4px;height:4px;border-radius:50%;background:#f59e0b;opacity:.4;bottom:-6px;right:0;"></span>
          </div>
          <div class="success-msg">
            密码修改成功，正在进入系统 <span id="forceCountdown">3</span>s
          </div>
          <div class="success-fallback">
            若没有正常跳转，请点击 <a onclick="goShell()">进入系统</a>
          </div>
        </div>
      </div>
    </div>

  </section>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
  let countdownTimer = null;

  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showLogin() {
    showView('viewLogin');
    document.getElementById('backBar').classList.remove('visible');
    clearInterval(countdownTimer);
    forceReset();
  }

  function showForgot() {
    showView('viewStep1');
    setBackBar('‹ 返回登录');
    document.getElementById('backBar').classList.add('visible');
  }

  function goStep2() {
    showView('viewStep2');
  }

  function goStep3() {
    showView('viewStep3');
    document.getElementById('backBar').classList.remove('visible');
    let n = 4;
    document.getElementById('countdown').textContent = n;
    countdownTimer = setInterval(() => {
      n--;
      document.getElementById('countdown').textContent = n;
      if (n <= 0) { clearInterval(countdownTimer); goShell(); }
    }, 1000);
  }

  function goShell() {
    window.location.href = '_shell.html';
  }

  function doLogin() {
    const btn = document.querySelector('#viewLogin .btn-primary');
    btn.textContent = '登录中...';
    btn.style.opacity = '0.8';
    btn.disabled = true;
    setTimeout(() => afterLogin(btn), 600);
  }

  function toggleEye(inputId, btn) {
    const input = document.getElementById(inputId);
    input.type = input.type === 'password' ? 'text' : 'password';
  }

  /* ===== #4746 弱口令强制改密（本地演示，不接真实认证） =====
   * 演示入口沿用本仓 qa=1 + xxxState 的 URL 参数写法：
   *   ?qa=1&pwState=warn|enforced [&pwReason=default|weak|security|其他]  点「登 录」后直达强制改密页（第 2 步）
   *   ?qa=1&pwState=428                       模拟旧会话收到 HTTP 428：打开即进强制改密页第 1 步（输入旧密码）
   *   ?qa=1&pwState=password_changed          模拟旧凭证收到 401 password_changed：回登录页并提示
   *   ?qa=1&pwState=lock-account|lock-ip|lock-gate   点「登 录」返回 42910 三种锁
   *   &pwResult=ok|40020|40020-default|40020-used|401|42900|50020|neterr   提交新密码时服务端的返回；
   *     错误只返回一次（同 usageState=error 的 failOnce 写法），再次提交按成功处理。 */
  const PW = {
    phone: '18515621527',
    rules(oldPw, newPw, confirmPw, phone) {
      phone = phone || PW.phone;
      if (!/^[\x21-\x7e]*$/.test(newPw)) return { field: 'new', msg: '密码只能包含英文字母、数字和英文符号，不能有空格' };
      if (newPw.length < 8 || newPw.length > 20) return { field: 'new', msg: '密码长度需为 8–20 位' };
      if (!/[A-Za-z]/.test(newPw) || !/[0-9]/.test(newPw)) return { field: 'new', msg: '密码需同时包含字母和数字' };
      if (phone && newPw.indexOf(phone.slice(-6)) >= 0) return { field: 'new', msg: '密码不能包含手机号' };
      if (oldPw && newPw === oldPw) return { field: 'new', msg: '新密码不能与旧密码相同' };
      if (newPw !== confirmPw) return { field: 'confirm', msg: '两次输入的密码不一致' };
      return null;
    },
    E40020: { '40020': '密码太常见，请换一个', '40020-default': '新密码不能是默认密码或手机号', '40020-used': '新密码不能与以前用过的密码相同' },
    E401_LOGIN: '旧密码错误，或密码刚在其他设备上修改过',
    E42900: n => '当前登录人数较多，请 ' + n + ' 秒后重试',
    E50020: '密码已修改，请用新密码登录',
    ADMIN_NETERR: '密码可能已修改成功，请用新密码登录',
    KICKED: '密码已被修改，请向使用该账号的同事获取新密码',
    SECURITY: '为保障账号安全，管理员账号需要修改一次密码',
    GENERIC: '你的密码过于简单，容易被他人登录，请修改后继续使用',
    TIP_SHARED: '请不要和同事使用同一个密码',
    LOCK: {
      'lock-account': '该账号在当前网络登录失败次数过多，请 15 分钟后再试，或联系管理员重置密码',
      'lock-ip': '当前网络登录失败次数过多，请 15 分钟后再试，或换个网络（如改用手机流量）',
      'lock-gate': '登录请求较多，请稍后再试'
    }
  };
  const pwParams = new URLSearchParams(location.search);
  const pwQa = pwParams.get('qa') === '1';
  const pwState = pwQa ? pwParams.get('pwState') || '' : '';
  let pwResult = pwQa ? pwParams.get('pwResult') || 'ok' : 'ok';
  const pwReason = pwParams.get('pwReason') || 'weak';
  let memOld = '';          // 旧密码只放内存，不落 storage
  let forceTimer = null;
  let toastTimer = null;

  function toast(message) {
    const t = document.getElementById('toast');
    t.textContent = message;
    t.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('visible'), 4000);
  }

  function setBackBar(text) { document.getElementById('backBar').textContent = text; }

  function restoreLoginBtn(btn) {
    btn.textContent = '登 录';
    btn.style.opacity = '';
    btn.disabled = false;
  }

  function afterLogin(btn) {
    if (PW.LOCK[pwState]) { restoreLoginBtn(btn); toast(PW.LOCK[pwState]); return; }
    if (pwState === 'warn' || pwState === 'enforced') {
      restoreLoginBtn(btn);
      // 刚登录：旧密码在内存里（演示：未填写时按默认密码=手机号后 6 位），直接从第 2 步开始
      openForce(2, document.getElementById('loginPwd').value || PW.phone.slice(-6));
      return;
    }
    goShell();
  }

  function forceSteps(n) {
    document.querySelectorAll('#forceSteps .step-item').forEach((el, i) => {
      el.classList.toggle('done', i + 1 < n);
      el.classList.toggle('active', i + 1 === n);
      el.querySelector('.step-dot').textContent = i + 1 <= n ? '✓' : '';
    });
    [1, 2, 3].forEach(i => document.getElementById('forcePane' + i).classList.toggle('active', i === n));
    document.getElementById('forceAlert').style.display = n === 3 ? 'none' : '';
    document.getElementById('forceInner').style.textAlign = n === 3 ? 'center' : '';
    document.getElementById('backBar').classList.toggle('visible', n < 3);
  }

  function openForce(step, old) {
    forceReset();
    memOld = old || '';
    document.getElementById('forceReason').textContent = pwReason === 'security' ? PW.SECURITY : PW.GENERIC;
    document.getElementById('forcePhone').value = PW.phone.slice(0, 3) + '****' + PW.phone.slice(-4);
    document.getElementById('forceTip').textContent = PW.TIP_SHARED;
    setBackBar('‹ 退出登录');
    showView('viewForce');
    forceSteps(step);
  }

  function forceReset() {
    clearInterval(forceTimer);
    forceTimer = null;
    memOld = '';
    ['forceOld', 'forceNew', 'forceConfirm'].forEach(id => { document.getElementById(id).value = ''; });
    showFieldErr(null);
    const btn = document.getElementById('forceSubmit');
    btn.disabled = false; btn.style.opacity = ''; btn.textContent = '确认修改';
    document.getElementById('forceCdHint').hidden = true;
  }

  function showFieldErr(r) {
    document.querySelectorAll('#viewForce .f-err').forEach(e => e.remove());
    document.querySelectorAll('#viewForce .input-group.err').forEach(e => e.classList.remove('err'));
    if (!r) return;
    const input = document.getElementById({ old: 'forceOld', new: 'forceNew', confirm: 'forceConfirm' }[r.field]);
    const group = input.parentNode;
    group.classList.add('err');
    const d = document.createElement('div');
    d.className = 'f-err';
    d.textContent = r.msg;
    group.parentNode.appendChild(d);
  }

  function forceNext() {
    const old = document.getElementById('forceOld').value;
    if (!old) { showFieldErr({ field: 'old', msg: '请输入旧密码' }); return; }
    memOld = old;
    showFieldErr(null);
    forceSteps(2);
    document.getElementById('forceNew').focus();
  }

  function liveRecheck() {
    if (document.querySelector('#forcePane2 .f-err')) showFieldErr(PW.rules(memOld, document.getElementById('forceNew').value, document.getElementById('forceConfirm').value));
  }

  function backToLogin(message) {
    // 内存里的旧密码一律清掉，回登录页并提示
    showLogin();
    document.getElementById('loginPwd').value = '';
    toast(message);
  }

  function forceSubmit() {
    const btn = document.getElementById('forceSubmit');
    if (btn.disabled) return;
    const nw = document.getElementById('forceNew').value;
    const cf = document.getElementById('forceConfirm').value;
    const r = PW.rules(memOld, nw, cf);
    showFieldErr(r);
    if (r) return;
    const result = pwResult;
    pwResult = 'ok';   // 错误只演示一次
    if (PW.E40020[result]) { showFieldErr({ field: 'new', msg: PW.E40020[result] }); return; }
    if (result === '401') {
      // 回到第 1 步旧密码输入，清掉内存里的旧密码；新密码草稿保留在第 2 步
      memOld = '';
      forceSteps(1);
      const old = document.getElementById('forceOld');
      old.value = '';
      showFieldErr({ field: 'old', msg: PW.E401_LOGIN });
      old.focus();
      return;
    }
    if (result === '42900') {
      // 沿用登录按钮「登录中...」的禁用写法；倒计时结束后需手动再点，不自动重发
      const hint = document.getElementById('forceCdHint');
      let n = Number(pwParams.get('retryAfterSec')) || 4;
      const tick = () => { btn.textContent = '请 ' + n + ' 秒后重试'; hint.textContent = PW.E42900(n); };
      btn.disabled = true; btn.style.opacity = '0.8'; hint.hidden = false; tick();
      clearInterval(forceTimer);
      forceTimer = setInterval(() => {
        n--;
        if (n <= 0) {
          clearInterval(forceTimer);
          btn.disabled = false; btn.style.opacity = ''; btn.textContent = '确认修改'; hint.hidden = true;
        } else tick();
      }, 1000);
      return;
    }
    if (result === '50020') { backToLogin(PW.E50020); return; }
    if (result === 'neterr' || result === '5xx') { backToLogin(PW.ADMIN_NETERR); return; }
    // 成功：新凭证已签发，倒计时进入系统
    memOld = '';
    forceSteps(3);
    let n = 3;
    document.getElementById('forceCountdown').textContent = n;
    clearInterval(forceTimer);
    forceTimer = setInterval(() => {
      n--;
      document.getElementById('forceCountdown').textContent = n;
      if (n <= 0) { clearInterval(forceTimer); goShell(); }
    }, 1000);
  }

  ['forceNew', 'forceConfirm'].forEach(id => document.getElementById(id).addEventListener('input', liveRecheck));
  document.getElementById('forceOld').addEventListener('keydown', e => { if (e.key === 'Enter') forceNext(); });

  if (pwState === '428') openForce(1, '');
  else if (pwState === 'password_changed') toast(PW.KICKED);
</script>
</body>
</html>
