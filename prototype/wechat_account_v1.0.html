<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="icon" href="data:,"><title>账号状态</title><link rel="stylesheet" href="_admin_list.css">
<script src="_edit_modal.js" defer></script></head>
<body class="wechat-account-page">

<div class="filter-bar account-filter">
  <div class="f-group"><span class="f-label">人设名称</span><input class="f-input wide" id="kw" placeholder="人设名称"></div>
  <div class="f-group"><span class="f-label">群组</span><select class="f-select wide-select" id="group"><option value="">选择群组</option><option>代运营-三方</option><option>会员中心</option><option>电商</option><option>内容中心</option></select></div>
  <div class="f-group"><span class="f-label">状态</span><select class="f-select wide-select" id="status"><option value="">选择状态</option><option>在线</option><option>掉线</option></select></div>
  <button class="btn primary" onclick="render()">查询</button>
  <button class="btn" onclick="onReset()">重置</button>
  <div class="f-spacer"></div>
  <button class="btn primary add-account" onclick="onCreate()">＋ 添加账号</button>
</div>

<div class="table-wrap account-table-wrap">
  <div class="table-card scroll account-table-card">
    <table class="account-table">
      <thead><tr>
        <th class="col-avatar">头像</th><th class="col-nick">微信昵称</th><th class="col-persona">人设名称</th><th class="col-group">群组归属</th>
        <th class="col-channel">渠道归属</th><th class="col-type">类型</th><th class="col-device">登录设备</th><th class="col-agent">代理名称</th>
        <th class="col-auto">自动通友开关</th><th class="col-status">状态</th><th class="col-reception">可接待人</th>
        <th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager account-pager">
  <span class="pager-info" id="pagerInfo">共 0 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button><button class="pager-btn cur">1</button><button class="pager-btn">›</button>
</div>

<div class="modal-mask" id="receptionMask" onclick="closeReceptionModal(event)">
  <div class="modal reception-modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span id="receptionTitle">可接待人列表</span>
      <button class="modal-close" onclick="closeReceptionModal()">✕</button>
    </div>
    <div class="modal-body reception-body" id="receptionBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { avatar:'photo', nick:'A 深圳艺星5A整形院长助理-佳佳', persona:'A 深圳艺星5A整形院长助理-佳佳-卿晓悦', group:'代运营-三方', channel:'代运营-三方', type:'个微', device:'mac', agent:'ajs-深圳126', autoBuddy:false, status:'offline', reception:['张拓','周魏','李妍','王瑜','陈可'] },
  { avatar:'photo', nick:'A-小乔深圳艺星5A整形院长助理', persona:'A-小乔深圳艺星5A整形-罗媛媛', group:'代运营-三方', channel:'代运营-三方', type:'个微', device:'mac', agent:'ajs-深圳153', autoBuddy:false, status:'online', reception:['周魏','张拓','刘婷婷'] },
  { avatar:'', nick:'', persona:'A冬冬-深圳艺星5A整形-卢秋莉', group:'代运营-三方', channel:'代运营-三方', type:'个微', device:'mac', agent:'自动选择', autoBuddy:false, status:'offline', reception:['卢秋莉','陈花','王静','李美玲','张阳','周可可'] },
  { avatar:'', nick:'', persona:'A吴优_深圳艺星5A整形 18123800296 王祝萍', group:'代运营-三方', channel:'代运营-三方', type:'个微', device:'mac', agent:'ajs-深圳148', autoBuddy:false, status:'offline', reception:['王祝萍','赵幸运'] },
  { avatar:'photo', nick:'A小鱼_深圳艺星5A整形院长助理', persona:'A小鱼_深圳艺星5A整形院长助理-张璐璐', group:'代运营-三方', channel:'代运营-三方', type:'个微', device:'mac', agent:'ajs-深圳149', autoBuddy:false, status:'offline', reception:['张璐璐','尹巧缘','吴雨星','柳霜','聂敏'] },
  { avatar:'', nick:'', persona:'A深圳艺星5A整形-雪儿（免费车接）-郑惠玲', group:'代运营-三方', channel:'代运营-三方', type:'个微', device:'mac', agent:'自动选择', autoBuddy:false, status:'offline', reception:['郑惠玲','聂敏01','聂敏02'] },
  { avatar:'photo', nick:'A深圳艺星5A整形陈陈（免费接车）', persona:'A深圳艺星5A整形陈陈-张艳玲', group:'代运营-三方', channel:'代运营-三方', type:'个微', device:'mac', agent:'ajs-深圳127', autoBuddy:false, status:'offline', reception:['张艳玲','柳霜01','柳霜02','柳霜03'] },
  { avatar:'photo', nick:'A深圳艺星5A整形院长助理-昭昭-卿晓悦', persona:'A深圳艺星5A整形院长助理-昭昭-卿晓悦', group:'代运营-三方', channel:'代运营-三方', type:'个微', device:'mac', agent:'ajs-深圳141', autoBuddy:false, status:'online', reception:['卿晓悦','邓梦雨','牛海兰','何晓秀'] },
  { avatar:'', nick:'', persona:'VIP管家-康康', group:'会员中心', channel:'会员中心', type:'企微', device:'iPad', agent:'ajs-深圳150', autoBuddy:false, status:'offline', reception:['康康','林清','许珍'] },
  { avatar:'photo', nick:'聂敏亚', persona:'VIP管家-敏敏', group:'会员中心', channel:'会员中心', type:'企微', device:'iPad', agent:'ajs-深圳130', autoBuddy:false, status:'offline', reception:['敏敏','聂敏','陈优','孙微'] },
  { avatar:'photo', nick:'陈晓贤', persona:'VIP管家-晓贤', group:'会员中心', channel:'会员中心', type:'企微', device:'iPad', agent:'ajs-深圳128', autoBuddy:false, status:'offline', reception:['晓贤','王芳'] },
  { avatar:'', nick:'', persona:'VIP管家-甘子', group:'会员中心', channel:'会员中心', type:'企微', device:'iPad', agent:'自动选择', autoBuddy:true, status:'offline', reception:['甘子','周敏','李思思','Karen','孙莉'] },
  { avatar:'photo', nick:'张紫婷', persona:'VIP管家-紫婷', group:'会员中心', channel:'会员中心', type:'企微', device:'iPad', agent:'自动选择', autoBuddy:true, status:'offline', reception:['紫婷','赵丽','温暖如初'] },
  { avatar:'', nick:'', persona:'VIP管家-静静', group:'会员中心', channel:'会员中心', type:'企微', device:'iPad', agent:'自动选择', autoBuddy:true, status:'offline', reception:['静静','Amy','Grace','吴静','Bella','郑敏'] },
  { avatar:'photo', nick:'Yestar 深圳艺星客服', persona:'Yestar 深圳艺星客服-杨晓结', group:'电商', channel:'电商', type:'个微', device:'mac', agent:'ajs-深圳153', autoBuddy:false, status:'online', reception:['杨晓结','王静','李美玲','张阳'] },
  { avatar:'photo', nick:'Yestar深圳艺星周助理', persona:'Yestar深圳艺星周助理-周嘉伟', group:'内容中心', channel:'内容中心', type:'个微', device:'mac', agent:'ajs-深圳150', autoBuddy:false, status:'online', reception:['周嘉伟','周可可','刘甜'] },
];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function avatarHtml(r) {
  if (r.avatar) return '<span class="account-avatar photo"></span>';
  return '<span class="account-avatar empty"></span>';
}
function statusBadge(s) {
  return s === 'online' ? '<span class="account-status online">在线</span>' : '<span class="account-status offline">掉线</span>';
}
function typeBadge(t) {
  return '<span class="type-badge ' + (t === '企微' ? 'enterprise' : 'personal') + '">' + esc(t) + '</span>';
}
function autoBadge(open) {
  return open ? '<span class="auto-badge on">自动通过</span>' : '<span class="auto-badge off">禁止自动通过</span>';
}
function receptionCell(r, idx) {
  const people = r.reception || [];
  if (!people.length) return '<span class="muted-text">-</span>';
  const visible = people.slice(0, 3).map(p => '<span class="reception-chip">' + esc(p) + '</span>').join('');
  const more = people.length > 3 ? '<button class="more-reception" onclick="openReceptionModal(' + idx + ')">查看更多（' + (people.length - 3) + '）</button>' : '';
  return '<div class="reception-list">' + visible + more + '</div>';
}
function render() {
  const kw = document.getElementById('kw').value.trim();
  const group = document.getElementById('group').value;
  const st = document.getElementById('status').value;
  const list = ROWS.filter(r => (!kw || r.nick.includes(kw) || r.persona.includes(kw)) && (!group || r.group === group) && (!st || (st === '在线' && r.status === 'online') || (st === '掉线' && r.status === 'offline')));
  document.getElementById('tbody').innerHTML = list.map((r) => {
    const idx = ROWS.indexOf(r);
    return `
    <tr>
      <td>${avatarHtml(r)}</td>
      <td class="strong-cell">${esc(r.nick || '-')}</td>
      <td>${esc(r.persona)}</td>
      <td>${esc(r.group)}</td>
      <td>${esc(r.channel)}</td>
      <td>${typeBadge(r.type)}</td>
      <td>${esc(r.device)}</td>
      <td>${esc(r.agent)}</td>
      <td>${autoBadge(r.autoBuddy)}</td>
      <td>${statusBadge(r.status)}</td>
      <td>${receptionCell(r, idx)}</td>
      <td class="col-actions account-actions">
        <button class="row-action primary-link" onclick="onEdit('${esc(r.persona)}')">编辑</button>
        <button class="row-action muted" onclick="toast('记录')">记录</button>
        <button class="row-action muted" onclick="toast('${r.status === 'online' ? '退出登录' : '登录'}')">${r.status === 'online' ? '退出登录' : '登录'}</button>
        <button class="row-action muted" onclick="toast('更新头像')">更新头像</button>
        <button class="row-action muted" onclick="toast('初始化通讯录')">初始化通讯录</button>
        <button class="row-action muted" onclick="toast('测试消息')">测试消息</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('pagerInfo').textContent = `共 ${list.length} 条`;
}
function openReceptionModal(idx) {
  const r = ROWS[idx];
  if (!r) return;
  document.getElementById('receptionTitle').textContent = '可接待人列表 · ' + r.persona;
  document.getElementById('receptionBody').innerHTML = (r.reception || []).map((p, i) => `
    <div class="reception-row">
      <span class="reception-index">${i + 1}</span>
      <span class="reception-name">${esc(p)}</span>
      <span class="reception-meta">${esc(r.group)} / ${esc(r.channel)}</span>
    </div>
  `).join('');
  document.getElementById('receptionMask').classList.add('show');
}
function closeReceptionModal(e) {
  if (e && e.target && e.target.id !== 'receptionMask') return;
  document.getElementById('receptionMask').classList.remove('show');
}
function onReset() { ['kw','group','status'].forEach(id=>document.getElementById(id).value=''); render(); }
function buildAccModal(title, onSubmit) {
  return createEditModal({
    title, width: 640,
    fields: [
      { label:'微信昵称', key:'nick', type:'text', placeholder:'登录后的展示昵称', required:true },
      { label:'人设名称', key:'persona', type:'text', placeholder:'例：A 深圳艺星5A整形院长助理-佳佳' },
      { label:'群组归属', key:'group', type:'select', options:['代运营-三方','会员中心','电商','内容中心'] },
      { label:'渠道归属', key:'channel', type:'select', options:['代运营-三方','会员中心','电商','内容中心'] },
      { label:'类型', key:'type', type:'select', options:['个微','企微'] },
      { label:'登录设备', key:'device', type:'text', placeholder:'例：mac / iPad' },
      { label:'代理名称', key:'agent', type:'text', placeholder:'例：ajs-深圳126' },
      { label:'自动通友开关', key:'autoBuddy', type:'switch' },
    ],
    onSubmit
  });
}
function onCreate() {
  const m = buildAccModal('添加账号', d => { ROWS.unshift({ ...d, status:'offline', reception:[] }); render(); toast('已添加账号'); });
  m.open({ type:'个微', device:'mac', group:'代运营-三方', channel:'代运营-三方', autoBuddy:false });
}
function onEdit(persona) {
  const r = ROWS.find(x => x.persona === persona);
  const m = buildAccModal('编辑账号', d => { Object.assign(r, d); render(); toast('已保存'); });
  m.open(r);
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReceptionModal(); });
render();
</script></body></html>
