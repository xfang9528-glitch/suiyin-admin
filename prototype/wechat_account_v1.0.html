<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>帐号状态</title><link rel="stylesheet" href="_admin_list.css">
<script src="_edit_modal.js" defer></script></head>
<body>

<div class="filter-bar">
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="昵称/人设/手机号"></div>
  <div class="f-group"><select class="f-select" id="status"><option value="">所有状态</option><option>在线</option><option>离线</option><option>异常</option></select></div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <button class="btn" onclick="onReset()">重置</button>
  <div class="f-spacer"></div>
  <button class="btn primary" onclick="onCreate()">＋ 添加账号</button>
</div>

<div class="table-wrap">
  <div class="table-card scroll" style="min-width:1500px;">
    <table>
      <thead><tr>
        <th>头像</th><th>微信昵称</th><th>人设名称</th><th>所属群组</th>
        <th>类型</th><th>登录设备</th><th>代理名称</th>
        <th>自动通友</th><th>状态</th>
        <th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info" id="pagerInfo">共 0 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button><button class="pager-btn cur">1</button><button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { nick:'A 成都艺星专家助理 KK', persona:'KK17775575920', group:'微整组',  type:'专家助理', device:'iPhone 15 Pro',  agent:'代理 A', autoBuddy:true,  status:'online' },
  { nick:'成都艺星医生助理 chloe',persona:'chloe',         group:'微整组',  type:'医生助理', device:'iPhone 14',     agent:'代理 A', autoBuddy:true,  status:'online' },
  { nick:'艺星专家助理妍妍',     persona:'妍妍',          group:'微整组',  type:'专家助理', device:'iPhone 13',     agent:'代理 A', autoBuddy:false, status:'online' },
  { nick:'A 成都艺星院长助理好好',persona:'好好',          group:'院长组',  type:'院长助理', device:'iPhone 14 Pro', agent:'代理 B', autoBuddy:true,  status:'online' },
  { nick:'YeStar 助理-铃铃',    persona:'铃铃',          group:'专家助理',type:'专家助理', device:'iPhone 13',     agent:'代理 B', autoBuddy:false, status:'offline' },
  { nick:'微整助理-Lucy 💗',   persona:'Lucy',          group:'微整组',  type:'专家助理', device:'离线 (异常)',   agent:'代理 C', autoBuddy:false, status:'abnormal' },
];
function avatar(c1, c2, ch) { return `<span class="avatar sq" style="--c1:${c1};--c2:${c2}">${ch}</span>`; }
function statusBadge(s) {
  return s === 'online' ? '<span class="badge">🟢 在线</span>'
    : s === 'offline' ? '<span class="badge gray">⚪ 离线</span>'
    : '<span class="badge danger">⚠ 异常</span>';
}
function render() {
  const kw = document.getElementById('kw').value.trim();
  const st = document.getElementById('status').value;
  const list = ROWS.filter(r => (!kw || r.nick.includes(kw) || r.persona.includes(kw)) && (!st || (st === '在线' && r.status === 'online') || (st === '离线' && r.status === 'offline') || (st === '异常' && r.status === 'abnormal')));
  document.getElementById('tbody').innerHTML = list.map(r => {
    const colors = [['#fbcfe8','#f9a8d4'],['#bbf7d0','#86efac'],['#bfdbfe','#93c5fd'],['#fde68a','#fcd34d'],['#ddd6fe','#c4b5fd'],['#fecaca','#fca5a5']];
    const seed = r.nick.charCodeAt(0) % colors.length;
    return `
    <tr>
      <td>${avatar(colors[seed][0], colors[seed][1], r.nick[0])}</td>
      <td>${r.nick}</td>
      <td>${r.persona}</td>
      <td><span class="tag blue">${r.group}</span></td>
      <td>${r.type}</td>
      <td>${r.device.includes('异常') ? '<span style="color:#f56c6c">' + r.device + '</span>' : r.device}</td>
      <td>${r.agent}</td>
      <td><label class="switch"><input type="checkbox" ${r.autoBuddy ? 'checked' : ''}><span class="switch-slider"></span></label></td>
      <td>${statusBadge(r.status)}</td>
      <td class="col-actions">
        <button class="row-action" onclick="onEdit('${r.persona.replace(/'/g, "\\'")}')">编辑</button>
        <button class="row-action muted" onclick="toast('记录')">记录</button>
        <button class="row-action muted" onclick="toast('退出登录')">退出</button>
        <button class="row-action muted" onclick="toast('更新头像')">更新头像</button>
        <button class="row-action muted" onclick="toast('初始化通讯录')">初始化</button>
        <button class="row-action muted" onclick="toast('测试消息')">测试</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('pagerInfo').textContent = `共 ${list.length} 条`;
}
function onReset() { ['kw','status'].forEach(id=>document.getElementById(id).value=''); render(); }
function buildAccModal(title, onSubmit) {
  return createEditModal({
    title, width: 600,
    fields: [
      { label:'微信昵称',     key:'nick',     type:'text',   placeholder:'登录后的展示昵称', required:true },
      { label:'人设名称',     key:'persona',  type:'text',   placeholder:'内部唯一标识，如：成都艺星专家助理鑫鑫' },
      { label:'所属群组',     key:'group',    type:'select', options:['微整组','院长组','专家助理','PYQ 矩阵','回访组','留存组'] },
      { label:'类型',         key:'type',     type:'select', options:['专家助理','医生助理','院长助理','客服助理','拉新助理'] },
      { label:'登录设备',     key:'device',   type:'text',   placeholder:'例：iPhone 15 Pro' },
      { label:'代理名称',     key:'agent',    type:'select', options:['代理 A','代理 B','代理 C','直连(无代理)'] },
      { label:'自动通友',     key:'autoBuddy',type:'switch' },
    ],
    onSubmit
  });
}
function onCreate() {
  const m = buildAccModal('添加账号', d => { ROWS.unshift({ ...d, status:'offline' }); render(); toast('已添加，请扫码登录'); });
  m.open({ autoBuddy:false });
}
function onEdit(persona) {
  const r = ROWS.find(x => x.persona === persona);
  const m = buildAccModal('编辑账号', d => { Object.assign(r, d); render(); toast('已保存'); });
  m.open(r);
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script></body></html>
