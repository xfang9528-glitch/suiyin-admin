<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>销售管理</title><link rel="stylesheet" href="_admin_list.css">
<script src="_edit_modal.js" defer></script></head>
<body>

<div class="filter-bar">
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="销售姓名"></div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <div class="f-group"><span class="f-label">全体销售每日自动下班时间</span>
    <input class="f-input" type="time" value="04:00" style="width:100px;">
  </div>
  <div class="f-group"><span class="f-label">是否允许转接给离开的销售</span>
    <label class="switch"><input type="checkbox" checked><span class="switch-slider"></span></label>
  </div>
  <div class="f-spacer"></div>
  <button class="btn primary" onclick="toast('创建销售')">＋ 创建</button>
  <button class="btn" onclick="toast('全部记录')">📋 全部记录</button>
</div>

<div class="table-wrap">
  <div class="table-card scroll" style="min-width:1900px;">
    <table>
      <thead><tr>
        <th>销售姓名 ↕</th><th>手机号</th><th>权限角色</th>
        <th>单聊/群聊上限</th><th>师父</th>
        <th>可聊天账号</th><th>销售微信昵称</th>
        <th>核销员编号</th><th>管理员编号</th>
        <th>创建时间</th><th>最新迭代时间</th>
        <th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info">共 121 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button>
  <button class="pager-btn cur">1</button><button class="pager-btn">2</button><button class="pager-btn">3</button>
  <button class="pager-btn">4</button><button class="pager-btn">5</button><button class="pager-btn">6</button>
  <button class="pager-btn">7</button>
  <button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
// 真实数据脱敏：手机号脱敏，姓名保留
const ROWS = [
  { name:'杨亚平', phone:'15219509710', role:'-', limit:'2000 / 50',  master:'-', accs:'-',                              coreNo:0, adminNo:0, createdAt:'2026-04-30 18:28:49', updatedAt:'2026-04-30 18:29:14' },
  { name:'康小蓉', phone:'15983976671', role:'-', limit:'2000 / 50',  master:'-', accs:'-',                              coreNo:0, adminNo:0, createdAt:'2026-04-30 18:28:07', updatedAt:'2026-04-30 18:29:07' },
  { name:'于子尚', phone:'15008205219', role:'-', limit:'2000 / 50',  master:'-', accs:'-',                              coreNo:0, adminNo:0, createdAt:'2026-04-30 18:26:35', updatedAt:'2026-04-30 18:27:21' },
  { name:'李天雯', phone:'13550190740', role:'-', limit:'2000 / 800', master:'-', accs:'小红书 (20/1): 艺星专家助理妍妍',  coreNo:0, adminNo:0, createdAt:'2026-04-28 13:08:50', updatedAt:'2026-04-28 14:33:01' },
  { name:'唐怡情', phone:'18228008847', role:'-', limit:'1 / 1',      master:'-', accs:'-',                              coreNo:0, adminNo:0, createdAt:'2026-04-27 16:04:46', updatedAt:'2026-04-27 16:05:02' },
  { name:'沈欢瑜', phone:'15109537570', role:'-', limit:'1 / 1',      master:'-', accs:'-',                              coreNo:0, adminNo:0, createdAt:'2026-04-27 16:04:09', updatedAt:'2026-04-27 16:05:05' },
  { name:'刘扩昕', phone:'17775515471', role:'-', limit:'1 / 1',      master:'-', accs:'-',                              coreNo:0, adminNo:0, createdAt:'2026-04-27 16:03:28', updatedAt:'2026-04-27 16:05:08' },
  { name:'灵岛兰', phone:'19115274954', role:'-', limit:'1 / 1',      master:'-', accs:'-',                              coreNo:0, adminNo:0, createdAt:'2026-04-27 16:02:44', updatedAt:'2026-04-27 16:05:11' },
  { name:'裴霞',   phone:'17708010376', role:'-', limit:'15 / 15',    master:'-', accs:'电商 (21/1): 胡瑞 02',             coreNo:0, adminNo:0, createdAt:'2026-04-22 13:24:51', updatedAt:'2026-04-22 13:32:05' },
  { name:'毛佳利', phone:'18782077225', role:'-', limit:'2000 / 800', master:'-', accs:'-',                              coreNo:0, adminNo:0, createdAt:'2026-04-22 10:00:51', updatedAt:'2026-04-28 13:49:34' },
  { name:'马驰',   phone:'15940290535', role:'-', limit:'2000 / 800', master:'-', accs:'抖音 (26/1): 马驰 圆圆',            coreNo:0, adminNo:0, createdAt:'2026-04-22 10:00:29', updatedAt:'2026-04-28 13:48:58' },
  { name:'罗玲',   phone:'18780048622', role:'-', limit:'2000 / 800', master:'-', accs:'抖音 (26/2): 罗玲 金金、YeStar 成都艺星专家助理 铃铃', coreNo:0, adminNo:0, createdAt:'2026-04-22 09:59:59', updatedAt:'2026-04-28 14:11:47' },
  { name:'樊燕玲', phone:'15070419346', role:'-', limit:'15 / 15',    master:'-', accs:'-',                              coreNo:0, adminNo:0, createdAt:'2026-04-22 09:59:31', updatedAt:'2026-04-22 09:59:35' },
  { name:'杨珂',   phone:'18585393257', role:'-', limit:'2000 / 15',  master:'-', accs:'小红书 (20/1): 杨珂 yiyi',         coreNo:0, adminNo:0, createdAt:'2026-04-22 09:59:08', updatedAt:'2026-05-05 09:35:08' },
];
function render() {
  const kw = document.getElementById('kw').value.trim();
  const list = ROWS.filter(r => !kw || r.name.includes(kw));
  document.getElementById('tbody').innerHTML = list.map((r, i) => `
    <tr>
      <td>${r.name}</td>
      <td>${r.phone.slice(0,3)}****${r.phone.slice(-4)}</td>
      <td>${r.role === '-' ? '<span style="color:var(--text-3)">-</span>' : `<span class="tag blue">${r.role}</span>`}</td>
      <td><span class="col-num">${r.limit}</span></td>
      <td>${r.master === '-' ? '<span style="color:var(--text-3)">-</span>' : r.master}</td>
      <td>${r.accs === '-' ? '<span style="color:var(--text-3)">-</span>' : `<span style="font-size:12.5px;color:var(--text-2);">${r.accs}</span>`}</td>
      <td><span style="color:var(--text-3)">-</span></td>
      <td class="col-num muted">${r.coreNo}</td>
      <td class="col-num muted">${r.adminNo}</td>
      <td class="col-time">${r.createdAt}</td>
      <td class="col-time">${r.updatedAt}</td>
      <td class="col-actions">
        <button class="row-action" onclick="onEdit(${i})">编辑</button>
        <button class="row-action muted" onclick="onResetPwd(${i})">重置密码</button>
        <button class="row-action danger" onclick="onDel(${i})">删除</button>
      </td>
    </tr>
  `).join('');
}

let editModal;
function onEdit(idx) {
  const r = ROWS[idx];
  if (!editModal) {
    editModal = createEditModal({
      title: '修改销售',
      width: 600,
      fields: [
        { label:'销售名称',     key:'name',    type:'text',   placeholder:'请输入销售名称', required:true },
        { label:'销售手机号',   key:'phone',   type:'text',   placeholder:'请输入销售手机号', required:true },
        { label:'单聊数上限',   key:'soloMax', type:'number', placeholder:'例：2000' },
        { label:'群聊数上限',   key:'groupMax',type:'number', placeholder:'例：50' },
        { label:'权限角色',     key:'role',    type:'select', options:['超级管理员','企业管理员','销售经理','销售','院长助理','财务'] },
        { label:'可聊天账号',   key:'accs',    type:'text',   placeholder:'多个账号用 / 分隔；例：小红书 (20/1): 杨珂 yiyi' },
        { label:'销售微信昵称', key:'wxNick',  type:'text',   placeholder:'选填' },
        { label:'师父',         key:'master',  type:'select', options:['杜佳','杨瑶 yiyi','陈巧','聂敏','刘瑜02'] },
        { label:'核销员编号',   key:'coreNo',  type:'number' },
        { label:'管理员编号',   key:'adminNo', type:'number' },
      ],
      onSubmit: (data) => {
        Object.assign(ROWS[onEdit._curIdx], data, { updatedAt: new Date().toISOString().replace('T', ' ').slice(0, 19) });
        render();
        toast('已保存');
      }
    });
  }
  onEdit._curIdx = idx;
  editModal.open({
    name: r.name, phone: r.phone, soloMax: parseInt(r.limit.split('/')[0]) || 0,
    groupMax: parseInt(r.limit.split('/')[1]) || 0, role: r.role === '-' ? '' : r.role,
    accs: r.accs === '-' ? '' : r.accs, wxNick: '', master: r.master === '-' ? '' : r.master,
    coreNo: r.coreNo, adminNo: r.adminNo
  });
}
function onResetPwd(idx) {
  if (confirm(`重置「${ROWS[idx].name}」的登录密码？新密码会通过短信发送到 ${ROWS[idx].phone.slice(0,3)}****${ROWS[idx].phone.slice(-4)}`)) toast('已重置');
}
function onDel(idx) {
  if (confirm(`确认删除销售「${ROWS[idx].name}」？该操作无法撤销，且会解除其名下客户的归属`)) { ROWS.splice(idx, 1); render(); toast('已删除'); }
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script></body></html>
