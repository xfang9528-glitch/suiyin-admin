<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>回访统计</title><link rel="stylesheet" href="_admin_list.css"></head>
<body>

<div class="filter-bar">
  <div class="f-group">
    <input class="f-input date" type="date" placeholder="开始日期">
    <span class="f-sep">至</span>
    <input class="f-input date" type="date" placeholder="结束日期">
  </div>
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="销售姓名"></div>
  <button class="btn primary" onclick="render()">🔍 搜索</button>
  <button class="btn" onclick="onReset()">重置</button>
</div>

<div class="table-wrap">
  <div class="table-card">
    <table>
      <thead><tr>
        <th>日期</th><th>销售姓名</th>
        <th>应回访数</th><th>已回访数</th><th>帮回访数</th><th>回访率</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info" id="pagerInfo">共 0 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button><button class="pager-btn cur">1</button><button class="pager-btn">›</button>
</div>

<script>
const ROWS = [
  { date:'2026-05-06', sale:'杜佳',         shouldVisit:32, did:30,  helped:2,  rate:0.94 },
  { date:'2026-05-06', sale:'杨瑶 yiyi',    shouldVisit:38, did:38,  helped:0,  rate:1.00 },
  { date:'2026-05-06', sale:'陈巧',         shouldVisit:42, did:36,  helped:0,  rate:0.86 },
  { date:'2026-05-06', sale:'聂敏',         shouldVisit:28, did:24,  helped:1,  rate:0.86 },
  { date:'2026-05-05', sale:'刘瑜02',       shouldVisit:22, did:20,  helped:0,  rate:0.91 },
  { date:'2026-05-05', sale:'Lucy 💗',      shouldVisit:30, did:18,  helped:0,  rate:0.60 },
  { date:'2026-05-05', sale:'罗玲 金金',     shouldVisit:18, did:18,  helped:0,  rate:1.00 },
  { date:'2026-05-04', sale:'赵紫颖03',     shouldVisit:25, did:14,  helped:0,  rate:0.56 },
];
function rateColor(r) { return r >= 0.9 ? 'success' : (r >= 0.7 ? '' : 'fail'); }
function render() {
  const kw = document.getElementById('kw').value.trim();
  const list = ROWS.filter(r => !kw || r.sale.includes(kw));
  document.getElementById('tbody').innerHTML = list.map(r => `
    <tr>
      <td class="col-time">${r.date}</td>
      <td>${r.sale}</td>
      <td class="col-num">${r.shouldVisit}</td>
      <td class="col-num success">${r.did}</td>
      <td class="col-num muted">${r.helped}</td>
      <td class="col-num ${rateColor(r.rate)}">${(r.rate*100).toFixed(0)}%</td>
    </tr>
  `).join('');
  document.getElementById('pagerInfo').textContent = `共 ${list.length} 条`;
}
function onReset() { document.getElementById('kw').value=''; render(); }
render();
</script></body></html>
