<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>AI-Prompt 模板</title><link rel="stylesheet" href="_admin_list.css">
<script src="_edit_modal.js" defer></script></head>
<body>

<div class="filter-bar">
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="模版名称"></div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <div class="f-spacer"></div>
  <button class="btn primary" onclick="onCreate()">＋ 创建</button>
</div>

<div class="table-wrap">
  <div class="table-card">
    <table>
      <thead><tr>
        <th>模版名称</th><th>场景</th><th>绑定模型</th><th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info">共 7 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button><button class="pager-btn cur">1</button><button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { name:'话术润色',         scene:'销售话术优化',      model:'gpt-4o-mini' },
  { name:'消息意图识别',     scene:'客户消息分类',      model:'gpt-4o-mini' },
  { name:'流失风险预警',     scene:'客户流失评估',      model:'claude-3.5-sonnet' },
  { name:'案例匹配推荐',     scene:'根据需求推荐案例',  model:'gpt-4o' },
  { name:'回访提醒生成',     scene:'回访话术自动生成',  model:'gpt-4o-mini' },
  { name:'敏感词监控分析',   scene:'词控告警上下文',    model:'claude-3.5-haiku' },
  { name:'朋友圈文案生成',   scene:'PYQ 自动文案',     model:'gpt-4o' },
];
function render() {
  const kw = document.getElementById('kw').value.trim();
  const list = ROWS.filter(r => !kw || r.name.includes(kw));
  document.getElementById('tbody').innerHTML = list.map(r => `
    <tr>
      <td>${r.name}</td>
      <td>${r.scene}</td>
      <td><span class="tag blue">${r.model}</span></td>
      <td class="col-actions">
        <button class="row-action" onclick="onEdit('${r.name.replace(/'/g, "\\'")}')">编辑</button>
        <button class="row-action danger" onclick="if(confirm('确认删除「${r.name}」？'))toast('已删除')">删除</button>
      </td>
    </tr>
  `).join('');
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
function buildPromptModal(title, onSubmit) {
  return createEditModal({
    title, width: 720,
    fields: [
      { label:'模版名称',     key:'name',   type:'text',     placeholder:'例：话术润色', required:true },
      { label:'场景',         key:'scene',  type:'select',   options:['销售话术优化','客户消息分类','客户流失评估','根据需求推荐案例','回访话术自动生成','词控告警上下文','PYQ 自动文案'] },
      { label:'绑定模型',     key:'model',  type:'select',   options:['gpt-4o-mini','gpt-4o','claude-3.5-sonnet','claude-3.5-haiku','deepseek-chat'] },
      { label:'System Prompt',key:'system', type:'textarea', placeholder:'你是艺星医美的专业销售助手，对话风格专业、亲和、注重客户感受...' },
      { label:'温度 (temperature)', key:'temp', type:'number', placeholder:'0.0 - 1.0' },
      { label:'最大 Token',   key:'maxTok', type:'number',   placeholder:'例：512' },
      { label:'示例输入 / 输出', key:'example', type:'textarea', placeholder:'Few-shot 示例（选填）' },
    ],
    onSubmit
  });
}
function onCreate() {
  const m = buildPromptModal('创建 Prompt 模板', d => { ROWS.unshift(d); render(); toast('已创建'); });
  m.open({ temp: 0.7, maxTok: 512 });
}
function onEdit(name) {
  const r = ROWS.find(x => x.name === name);
  const m = buildPromptModal('编辑 Prompt 模板', d => { Object.assign(r, d); render(); toast('已保存'); });
  m.open(r);
}
render();
</script></body></html>
