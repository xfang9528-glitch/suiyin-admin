<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>群邀请提及率</title><link rel="stylesheet" href="_admin_list.css">
<style>
  /* 维度切换段 */
  .seg { display:inline-flex; border:1px solid #e5e8ec; border-radius:3px; overflow:hidden; height:30px; }
  .seg button { padding:0 12px; height:30px; font-size:12.5px; color:var(--text-2); background:#fff; border-right:1px solid #e5e8ec; }
  .seg button:last-child { border-right:none; }
  .seg button.active { background:var(--wx-green); color:#fff; }

  /* 群多选 chips */
  .chip-group { display:inline-flex; gap:6px; }
  .chip {
    height:30px; padding:0 12px; border-radius:15px;
    border:1px solid #e5e8ec; background:#fff; color:var(--text-2);
    font-size:12.5px; display:inline-flex; align-items:center; gap:6px;
    transition:all .15s; user-select:none; cursor:pointer;
  }
  .chip:hover { border-color:#c8e6d2; color:var(--wx-green); }
  .chip.on { background:var(--wx-green-light); border-color:var(--wx-green); color:var(--wx-green); font-weight:500; }
  .chip .chip-check { display:none; font-size:13px; }
  .chip.on .chip-check { display:inline; }

  /* 口径说明 */
  .scope-tip {
    margin-left:auto; color:var(--text-3); font-size:12px; cursor:help; position:relative;
  }
  .scope-tip:hover .scope-pop { display:block; }
  .scope-pop {
    display:none; position:absolute; right:0; top:24px; width:420px;
    background:#fff; border:1px solid var(--border); border-radius:6px;
    padding:12px 14px; font-size:12.5px; color:var(--text-2); line-height:1.65;
    box-shadow:0 6px 18px rgba(0,0,0,.08); z-index:50; white-space:normal;
  }
  .scope-pop b { color:var(--text-1); }
  .scope-pop .sp-divider { border-top:1px dashed var(--border); margin:8px 0; }

  /* ratio bar 通用 */
  .ratio-bar { flex:1; height:6px; background:#f0f2f5; border-radius:3px; overflow:hidden; max-width:90px; }
  .ratio-bar i { display:block; height:100%; background:var(--wx-green); border-radius:3px; transition:width .25s; }

  /* 提及率—主指标（百分比，强调） */
  .pct-strong { display:flex; align-items:center; gap:8px; min-width:160px; }
  .pct-strong .ratio-bar { max-width:80px; }
  .pct-strong .ratio-bar i { background:linear-gradient(90deg, #07c160, #2bbf6c); }
  .pct-strong .pct-num { font-variant-numeric:tabular-nums; font-size:13.5px; color:var(--text-1); font-weight:600; min-width:46px; }
  .pct-strong .pct-frac { font-size:11.5px; color:var(--text-3); white-space:nowrap; }
  /* 单群提及率—中性灰条 */
  .pct-soft { display:flex; align-items:center; gap:6px; min-width:88px; }
  .pct-soft .ratio-bar { max-width:50px; height:4px; }
  .pct-soft .ratio-bar i { background:#a4d8b7; }
  .pct-soft .pct-num { font-variant-numeric:tabular-nums; font-size:12px; color:var(--text-2); }
  .pct-soft.empty .pct-num { color:#c0c8d1; }
  .pct-soft.empty .ratio-bar i { background:#e5e8ec; }

  /* 未邀好友数：高亮可点击 */
  .uninvited {
    color:#fa5151; font-weight:600; font-variant-numeric:tabular-nums;
    cursor:pointer; padding:2px 6px; border-radius:3px; transition:background .12s;
  }
  .uninvited:hover { background:#fef0f0; }
  .uninvited.zero { color:#a4d8b7; cursor:default; font-weight:500; }
  .uninvited.zero:hover { background:transparent; }

  /* modal 内列表 */
  .modal-meta { padding:0 20px 8px; color:var(--text-3); font-size:12.5px; display:flex; gap:14px; flex-wrap:wrap; }
  .modal-meta b { color:var(--text-1); font-weight:500; }
  .modal-list-wrap { max-height:56vh; overflow:auto; padding:4px 20px 16px; }
  .modal-list-wrap table { font-size:12.5px; }
  .modal-list-wrap thead th { background:#fafbfc; }
  .script-text {
    color:var(--text-2); font-size:12.5px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    max-width:380px;
  }

  /* 明细 modal 的 tab */
  .detail-tabs {
    display:flex; gap:0; padding:0 20px;
    border-bottom:1px solid var(--border);
  }
  .detail-tab {
    padding:10px 14px; font-size:13px; color:var(--text-2);
    border-bottom:2px solid transparent; background:transparent;
    font-weight:500; transition:all .15s;
  }
  .detail-tab.active { color:var(--wx-green); border-bottom-color:var(--wx-green); }
  .detail-tab .tab-count { color:var(--text-3); font-weight:400; margin-left:4px; }
  .detail-tab.active .tab-count { color:var(--wx-green); }
  .detail-pane { display:none; }
  .detail-pane.active { display:block; }

  /* 群标识 chip（用于明细列表的"已邀群"列） */
  .gtag {
    display:inline-flex; align-items:center; gap:3px;
    padding:1px 7px; border-radius:10px;
    background:#f5fbf7; color:var(--wx-green);
    font-size:11.5px; margin-right:4px; line-height:1.6;
  }
  .gtag.weizheng { background:#fff4f0; color:#e8814a; }
  .gtag.yanbu    { background:#f0f4fa; color:#576b95; }
  .gtag.fanyuan  { background:#f7f1fa; color:#8e6cb0; }

  /* 头像（mock 配色） */
  .av-mini {
    width:28px; height:28px; border-radius:50%;
    display:inline-flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--c1, #80b3ff), var(--c2, #4a90e2));
    color:#fff; font-size:11.5px; font-weight:600;
    flex-shrink:0;
  }
  .friend-cell { display:flex; align-items:center; gap:8px; }
  .friend-name { font-size:12.5px; color:var(--text-1); line-height:1.4; }
  .friend-sub  { font-size:11px; color:var(--text-3); margin-top:1px; }

  /* modal 内分页器 */
  .modal-pager {
    padding:8px 20px; border-top:1px solid var(--border);
    background:#fff;
    display:flex; align-items:center; justify-content:flex-end;
    gap:12px;
  }
  .modal-pager .pager-info { color:var(--text-3); font-size:13px; margin-right:4px; }
  .modal-pager .pager-size {
    height:28px; padding:0 8px;
    border:1px solid #d0d7de; border-radius:3px;
    background:#fff; font-size:13px; color:var(--text-2); cursor:pointer; outline:none;
  }
  .modal-pager .pager-btns { display:inline-flex; gap:4px; }
</style>
</head>

/* ============================================================
 *  3 个邀请群定义（每群对应话术库内多条变体——后端按"分类"聚合命中）
 * ============================================================ */
const INVITE_GROUPS = {
  weizheng: { id:'weizheng', name:'微整填充群', short:'微整',     desc:'¥1分钱购千元福利大礼包' },

// 部门偏好：base = 任一群命中率上限，p_x = 单群命中率系数
const DEPT_INVITE_PREF = {
  '抖音IP':  { base:0.74, weizheng:0.62, yanbu:0.40, fanyuan:0.18 },
  '小红书':  { base:0.82, weizheng:0.50, yanbu:0.66, fanyuan:0.22 },
  '电商':    { base:0.68, weizheng:0.46, yanbu:0.30, fanyuan:0.42 },
  '代运营':  { base:0.86, weizheng:0.34, yanbu:0.28, fanyuan:0.78 },
  '自媒体':  { base:0.46, weizheng:0.36, yanbu:0.18, fanyuan:0.10 },
};

// FNV-1a hash → 0..1，mock 稳定且分布均匀
function h(s){
  let x = 2166136261;
  for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); }
  return ((x >>> 0) % 100000) / 100000;
}

// 每账号 newAdded ≈ talked * (0.30~0.55)；按部门 base+jitter 计算"任一群"提及数
const INVITE_STATS = {};
ACCOUNTS.forEach(a => {
  const pref = DEPT_INVITE_PREF[a.dept];
  const ratio = 0.30 + h('na'+a.id)*0.25;
  const newAdded = Math.max(8, Math.round(a.talked * ratio));
  const jitter = 0.85 + h('jt'+a.id)*0.30;
  const anyHit = Math.min(0.96, pref.base * jitter);
  const anyMentioned = Math.round(newAdded * anyHit);
  const wzHit = Math.min(0.95, pref.weizheng * jitter);
  const ybHit = Math.min(0.95, pref.yanbu    * jitter);
  const fyHit = Math.min(0.95, pref.fanyuan  * jitter);
  INVITE_STATS[a.id] = {
    newAdded,
    mentioned: anyMentioned,
    perGroup: {
      weizheng: Math.round(newAdded * wzHit),
      yanbu:    Math.round(newAdded * ybHit),
      fanyuan:  Math.round(newAdded * fyHit),
    },
  };
});

// 按需生成"逐个新好友"的明细
const FRIEND_DETAILS_CACHE = {};
const FRIEND_FIRST_NAMES = ['林','陈','王','李','张','刘','黄','周','吴','徐','孙','马','朱','胡','郭','何','高','罗','宋','谢','唐','韩','曹','许','邓','萧','冯','曾','程','蔡'];
const FRIEND_LAST_NAMES  = ['雨涵','梓萱','欣怡','可馨','若汐','沐辰','一诺','语桐','苡彤','婧妍','梓琪','思颖','曼娜','晨曦','嘉宁','念安','念慈','千千','茗茗','静怡','若萱','妙可','念念','雅琪','倩倩','晓婷','韵涵','丹妮','姗姗','歆媛'];
function pickFriendName(seed){
  const a = FRIEND_FIRST_NAMES[(h('fn'+seed)*FRIEND_FIRST_NAMES.length)|0];
  const b = FRIEND_LAST_NAMES [(h('ln'+seed)*FRIEND_LAST_NAMES.length)|0];
  return a+b;
}
function pickRemark(seed, hasInvited){
  const choices = hasInvited
    ? ['热玛吉意向','双眼皮意向','水光针','咨询过价格','已面诊待定','预约面诊','双眼皮+开眼角','嗨体熊猫针','复购客户']
    : ['仅扫码未沟通','加好友未回复','加好友 1 条试探','回复"了解一下"','只问价格未跟进','已读未回'];
  return choices[(h('rk'+seed)*choices.length)|0];
}
function buildFriendList(accId){
  if (FRIEND_DETAILS_CACHE[accId]) return FRIEND_DETAILS_CACHE[accId];
  const stat = INVITE_STATS[accId];
  const groupKeys = ['weizheng','yanbu','fanyuan'];
  const targets = {
    weizheng: stat.perGroup.weizheng,
    yanbu:    stat.perGroup.yanbu,
    fanyuan:  stat.perGroup.fanyuan,
  };
  const list = [];
  for (let i = 0; i < stat.newAdded; i++) {
    const seed = accId + '#' + i;
    list.push({
      id: seed,
      name: pickFriendName(seed),
      addedAt: mockAddedAt(seed),
      invitedTo: [],
      lastTalked: mockLastTalked(seed),
      inviteScript: '',
      inviteAt: '',
    });
  }
  const sortedByHash = list.slice().sort((x,y) => h(x.id) - h(y.id));
  const mentionedSet = new Set(sortedByHash.slice(0, stat.mentioned).map(f => f.id));
  groupKeys.forEach(gid => {
    const tgt = targets[gid];
    if (tgt <= 0) return;
    const sortedForG = sortedByHash
      .filter(f => mentionedSet.has(f.id))
      .sort((x,y) => h(gid+x.id) - h(gid+y.id))
      .slice(0, tgt);
    sortedForG.forEach(f => f.invitedTo.push(gid));
  });
  list.forEach(f => {
    if (mentionedSet.has(f.id) && f.invitedTo.length === 0) {
      const candidates = groupKeys.filter(g => targets[g] > 0).sort((x,y) => h(x+f.id) - h(y+f.id));
      f.invitedTo.push(candidates[0] || 'weizheng');
    }
  });
  list.forEach(f => {
    if (f.invitedTo.length > 0) {
      const gid = f.invitedTo[0];
      const variants = INVITE_SCRIPTS[gid];
      f.inviteScript = variants[(h('sc'+f.id)*variants.length)|0];
      f.inviteAt = mockInviteAt(f.addedAt, f.id);
    }
  });
  list.forEach(f => f.remark = pickRemark(f.id, f.invitedTo.length>0));
  FRIEND_DETAILS_CACHE[accId] = list;
  return list;
}
function mockAddedAt(seed){
  const days = (h('dd'+seed)*14)|0;
  const d = new Date(); d.setDate(d.getDate() - days);
  d.setHours(8 + ((h('hh'+seed)*12)|0), ((h('mm'+seed)*60)|0));
  return d.toISOString().slice(0,16).replace('T',' ');
}
function mockLastTalked(seed){
  if (h('lt'+seed) < 0.18) return '';
  const days = (h('lt'+seed)*7)|0;
  const d = new Date(); d.setDate(d.getDate() - days);
  d.setHours(9 + ((h('lh'+seed)*12)|0));
  return d.toISOString().slice(0,16).replace('T',' ');
}
function mockInviteAt(addedAt, seed){
  if (!addedAt) return '';
  const base = new Date(addedAt.replace(' ','T'));
  const min = 5 + ((h('iv'+seed)*180)|0);
  base.setMinutes(base.getMinutes() + min);
  return base.toISOString().slice(0,16).replace('T',' ');
}

function fmt(n){ return Number(n).toLocaleString('zh-CN'); }
function pctStrong(num, den){
  const p = den > 0 ? num/den : 0;
  const pct = Math.round(p*100);
  return `<div class="pct-strong">
    <div class="ratio-bar"><i style="width:${Math.min(100,pct)}%"></i></div>
    <span class="pct-num">${pct}%</span>
    <span class="pct-frac">${fmt(num)}/${fmt(den)}</span>
  </div>`;
}
function pctSoft(num, den){
  const p = den > 0 ? num/den : 0;
  const pct = Math.round(p*100);
  const cls = num === 0 ? 'pct-soft empty' : 'pct-soft';
  return `<div class="${cls}">
    <div class="ratio-bar"><i style="width:${Math.min(100,pct)}%"></i></div>
    <span class="pct-num">${pct}%</span>
  </div>`;
}
function avatarColor(seed){
  const palette = [
    ['#ffb38a','#ff7a45'], ['#80b3ff','#4a90e2'], ['#a4d8b7','#52c41a'],
    ['#f9c84d','#fa8c16'], ['#ce9eff','#8e6cb0'], ['#7ed3fc','#0284c7'],
    ['#fda4af','#f43f5e'], ['#a7f3d0','#10b981'],
  ];
  const i = ((h('av'+seed)*palette.length)|0);
  return palette[i];
}
function gtags(invitedTo){
  if (!invitedTo || invitedTo.length === 0) return '<span style="color:var(--text-3);font-size:12px;">—</span>';
  return invitedTo.map(g => {
    const meta = INVITE_GROUPS[g];

}

/* ============================================================
 *  汇总（OR 任一群命中估算）
 * ============================================================ */
function aggInvite(accIds){
  let newAdded=0, mentionedAny=0, mentionedW=0, mentionedY=0, mentionedF=0;
  accIds.forEach(id => {
    const s = INVITE_STATS[id];
    newAdded     += s.newAdded;
    const sel = ['weizheng','yanbu','fanyuan'].filter(g => SELECTED_GROUPS.has(g));
    const sumSel = sel.reduce((sum,g) => sum + s.perGroup[g], 0);
    const maxSel = Math.max(0, ...sel.map(g => s.perGroup[g]));
    const fullAny = s.mentioned;
    const orEst   = Math.min(sumSel, Math.max(maxSel, Math.round(fullAny * (sumSel / Math.max(1, s.perGroup.weizheng + s.perGroup.yanbu + s.perGroup.fanyuan)))));
    mentionedAny += orEst;
    mentionedW   += s.perGroup.weizheng;
    mentionedY   += s.perGroup.yanbu;
    mentionedF   += s.perGroup.fanyuan;
  });
  return { newAdded, mentionedAny, mentionedW, mentionedY, mentionedF };
}

function openDetail(kind, key){
  const range = `${document.getElementById('dateFrom').value || '不限'} ~ ${document.getElementById('dateTo').value || '不限'}`;
  const sel = Array.from(SELECTED_GROUPS);
  let title, ids, headerLine;
  if (kind === 'account') {
    const acc = ACCOUNTS.find(a => a.id === key);
    title = `${acc.name} · 群邀请明细`;
    ids = [acc.id];
    headerLine = [
      `销售账号：<b>${acc.name}</b>${acc.alias?`(${acc.alias})`:''}`,
      `所属部门：<b>${acc.dept}</b>`,
    ];
  } else {
    const accs = ACCOUNTS.filter(a => a.dept === key);
    title = `${key} · 群邀请明细`;
    ids = accs.map(a => a.id);
    headerLine = [
      `部门：<b>${key}</b>`,
      `账号数：<b>${accs.length}</b>`,
    ];
  }
  const all = ids.flatMap(id => buildFriendList(id).map(f => ({...f, accountId:id, account: ACCOUNTS.find(a=>a.id===id) })));
  const invitedList   = all.filter(f => f.invitedTo.some(g => SELECTED_GROUPS.has(g)));
  const uninvitedList = all.filter(f => !f.invitedTo.some(g => SELECTED_GROUPS.has(g)));
  uninvitedList.sort((a,b) => (b.addedAt||'').localeCompare(a.addedAt||''));
  invitedList.sort((a,b) => (b.inviteAt||'').localeCompare(a.inviteAt||''));

  const meta = [
    ...headerLine,
    `时间范围：<b>${range}</b>`,
    `选中群：<b>${sel.map(g => INVITE_GROUPS[g].short).join(' / ')}</b>`,
    `新增好友：<b>${fmt(all.length)}</b>`,
    `已邀：<b style="color:var(--wx-green)">${fmt(invitedList.length)}</b>`,
    `未邀：<b style="color:#fa5151">${fmt(uninvitedList.length)}</b>`,
    `提及率：<b>${(invitedList.length / Math.max(1,all.length) * 100).toFixed(1)}%</b>`,
  ];
  document.getElementById('modalInviteTitle').textContent = title;
  document.getElementById('modalInviteMeta').innerHTML = meta.map(s => `<span>${s}</span>`).join('');
  document.getElementById('cntUn').textContent = `(${uninvitedList.length})`;
  document.getElementById('cntIn').textContent = `(${invitedList.length})`;

  CURRENT_DRILL = { kind, key, uninvitedList, invitedList, pageUn:1, pageIn:1, pageSize:20, activePane:'uninvited' };
  document.getElementById('modalPageSize').value = '20';
  setDetailPane('uninvited');
  document.getElementById('modalInvite').classList.add('show');
}

function renderModalPager(){
  if (!CURRENT_DRILL) return;
  const { activePane, uninvitedList, invitedList, pageUn, pageIn, pageSize } = CURRENT_DRILL;
  const list = activePane === 'uninvited' ? uninvitedList : invitedList;
  const page = activePane === 'uninvited' ? pageUn : pageIn;
  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  document.getElementById('modalPagerInfo').textContent = `共 ${total} 条`;
  const btns = [];
  btns.push(`<button class="pager-btn" ${page===1?'disabled':''} onclick="goModalPage(${page-1})">‹</button>`);
  const pages = new Set();
  pages.add(1); pages.add(totalPages);
  for (let p = page-2; p <= page+2; p++) if (p>=1 && p<=totalPages) pages.add(p);
  const sorted = Array.from(pages).sort((a,b)=>a-b);
  let last = 0;
  sorted.forEach(p => {
    if (p - last > 1) btns.push(`<span class="pager-ellipsis">…</span>`);
    btns.push(`<button class="pager-btn ${p===page?'cur':''}" onclick="goModalPage(${p})">${p}</button>`);
    last = p;
  });
  btns.push(`<button class="pager-btn" ${page===totalPages?'disabled':''} onclick="goModalPage(${page+1})">›</button>`);
  document.getElementById('modalPagerBtns').innerHTML = btns.join('');
}

function goModalPage(p){
  if (!CURRENT_DRILL) return;
  const { activePane, uninvitedList, invitedList, pageSize } = CURRENT_DRILL;
  const list = activePane === 'uninvited' ? uninvitedList : invitedList;
  const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
  const np = Math.max(1, Math.min(totalPages, p));
  if (activePane === 'uninvited') CURRENT_DRILL.pageUn = np;
  else CURRENT_DRILL.pageIn = np;
  if (activePane === 'uninvited') renderUninvitedRows(); else renderInvitedRows();
  renderModalPager();
}
