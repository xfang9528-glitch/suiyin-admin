<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>销售排名</title><link rel="stylesheet" href="_admin_list.css">
<style>
.dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px 16px; }
.dash-card { background: #fff; border-radius: 6px; border: 1px solid var(--border); padding: 14px 16px; }
.dash-title { font-size: 13.5px; font-weight: 600; margin-bottom: 8px; color: var(--text-1); border-left: 3px solid var(--wx-green); padding-left: 8px; }
.dash-card table { font-size: 12.5px; }
.rank-num { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; background: #f0f2f5; color: var(--text-2); }
.rank-num.r1 { background: linear-gradient(135deg,#fcd34d,#f59e0b); color: #fff; }
.rank-num.r2 { background: linear-gradient(135deg,#c0c8d1,#94a3b8); color: #fff; }
.rank-num.r3 { background: linear-gradient(135deg,#fdba74,#f97316); color: #fff; }
.table-wrap { padding: 0; }
</style></head>
<body>

<div class="filter-bar">
  <div class="f-group" style="gap:4px;">
    <button class="btn sm">今天</button>
    <button class="btn sm">昨天</button>
    <button class="btn sm">本周</button>
    <button class="btn sm">本月</button>
    <button class="btn sm">上月</button>
    <button class="btn sm">本年度</button>
    <button class="btn sm">近七天</button>
    <button class="btn sm">近一月</button>
  </div>
</div>

<div class="table-wrap">
  <div class="dash-grid">

    <div class="dash-card">
      <div class="dash-title">销售预付金额排名</div>
      <table><thead><tr><th>排名</th><th>名称</th><th>总金额(元)</th></tr></thead><tbody id="t1"></tbody></table>
    </div>

    <div class="dash-card">
      <div class="dash-title">销售拉新数量排名</div>
      <table><thead><tr><th>排名</th><th>名称</th><th>数量</th></tr></thead><tbody id="t2"></tbody></table>
    </div>

    <div class="dash-card">
      <div class="dash-title">销售交付金额排名</div>
      <table><thead><tr><th>排名</th><th>名称</th><th>总金额(元)</th></tr></thead><tbody id="t3"></tbody></table>
    </div>

  </div>
</div>

<script>
const T1 = [['杨瑶 yiyi',180600],['陈巧',158800],['杜佳',142800],['聂敏',128400],['Lucy 💗',98600],['刘瑜02',85600],['罗玲 金金',72400],['赵紫颖03',60800]];
const T2 = [['杜佳',128],['聂敏',102],['杨瑶 yiyi',96],['陈巧',82],['Lucy 💗',68],['罗玲 金金',55],['刘瑜02',48],['赵紫颖03',32]];
const T3 = [['杨瑶 yiyi',158800],['陈巧',128400],['杜佳',98600],['聂敏',85600],['Lucy 💗',72400],['刘瑜02',55600],['罗玲 金金',45200],['赵紫颖03',32800]];
function rankBadge(i) { return `<span class="rank-num ${i<3?'r'+(i+1):''}">${i+1}</span>`; }
function fill(id, data, money) {
  document.getElementById(id).innerHTML = data.map((r,i) => `
    <tr><td>${rankBadge(i)}</td><td>${r[0]}</td><td class="col-num ${money?'success':''}">${money?'¥'+r[1].toLocaleString('zh-CN'):r[1]}</td></tr>
  `).join('');
}
fill('t1', T1, true);
fill('t2', T2, false);
fill('t3', T3, true);
</script></body></html>
