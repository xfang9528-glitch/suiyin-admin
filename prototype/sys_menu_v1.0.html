<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>菜单管理</title><link rel="stylesheet" href="_admin_list.css">
<script src="_edit_modal.js" defer></script>
<style>
.tree-row { padding-left: var(--lvl, 0); }
.tree-toggle { display: inline-block; width: 14px; text-align: center; color: var(--text-3); cursor: pointer; }
</style>
</head>
<body>

<div class="filter-bar">
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="菜单名称"></div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <div class="f-spacer"></div>
  <button class="btn" onclick="toast('全部记录')">📋 全部记录</button>
</div>

<div class="table-wrap">
  <div class="table-card">
    <table>
      <thead><tr>
        <th>菜单名称</th><th>超级权限</th><th>菜单状态</th><th>排序</th>
        <th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const TREE = [
  { name:'销售管理', sup:false, status:true, order:1 },
  { name:'专家管理', sup:false, status:true, order:2, children:[
    { name:'专家信息', sup:false, status:true, order:1 },
  ]},
  { name:'好友管理', sup:false, status:true, order:3, children:[
    { name:'好友列表', sup:false, status:true, order:1 },
    { name:'群列表', sup:false, status:true, order:2 },
    { name:'添加好友', sup:false, status:true, order:3 },
    { name:'删退审核', sup:false, status:true, order:4 },
    { name:'好友标签', sup:false, status:true, order:5 },
  ]},
  { name:'话术管理', sup:false, status:true, order:4 },
  { name:'商品管理', sup:false, status:true, order:5 },
  { name:'群发管理', sup:false, status:true, order:6 },
  { name:'PYQ 管理', sup:false, status:true, order:7 },
  { name:'分佣管理', sup:false, status:true, order:8, children:[
    { name:'分佣明细', sup:false, status:true, order:1 },
    { name:'分佣合计', sup:false, status:true, order:2 },
    { name:'充值确认', sup:false, status:true, order:3 },
    { name:'预付确认', sup:false, status:true, order:4 },
    { name:'收入确认', sup:false, status:true, order:5 },
  ]},
  { name:'数据展示', sup:false, status:true, order:9 },
  { name:'聊天管理', sup:false, status:true, order:10 },
  { name:'微信管理', sup:false, status:true, order:11 },
  { name:'AI 管理', sup:true, status:true, order:12 },
  { name:'系统管理', sup:true, status:true, order:13 },
];
function flat(arr, lvl, out) {
  arr.forEach(n => {
    out.push({ ...n, lvl });
    if (n.children) flat(n.children, lvl + 1, out);
  });
}
function render() {
  const kw = document.getElementById('kw').value.trim();
  const out = []; flat(TREE, 0, out);
  const list = out.filter(r => !kw || r.name.includes(kw));
  document.getElementById('tbody').innerHTML = list.map(r => `
    <tr>
      <td><div class="tree-row" style="--lvl:${r.lvl * 18}px; padding-left:var(--lvl);"><span class="tree-toggle">${r.children ? '▶' : '·'}</span> ${r.name}</div></td>
      <td>${r.sup ? '<span class="badge danger">超级权限</span>' : '<span class="badge gray">普通</span>'}</td>
      <td><label class="switch"><input type="checkbox" ${r.status ? 'checked' : ''}><span class="switch-slider"></span></label></td>
      <td class="col-num muted">${r.order}</td>
      <td class="col-actions">
        <button class="row-action" onclick="onEdit('${r.name.replace(/'/g, "\\'")}')">编辑</button>
        <button class="row-action danger" onclick="if(confirm('确认删除菜单「${r.name}」？'))toast('已删除')">删除</button>
        <button class="row-action muted" onclick="toast('记录')">记录</button>
      </td>
    </tr>
  `).join('');
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
function buildMenuModal(title, onSubmit) {
  return createEditModal({
    title,
    fields: [
      { label:'菜单名称',   key:'name',   type:'text',   placeholder:'例：销售管理', required:true },
      { label:'路由 path',  key:'path',   type:'text',   placeholder:'例：/salesManage' },
      { label:'图标',       key:'icon',   type:'text',   placeholder:'选填，例：👥' },
      { label:'父级菜单',   key:'parent', type:'select', options:['(无 / 顶级)','销售管理','专家管理','好友管理','分佣管理','数据展示','聊天管理','微信管理','AI 管理','系统管理'] },
      { label:'是否超级权限', key:'sup',  type:'switch' },
      { label:'菜单状态',   key:'status', type:'switch' },
      { label:'排序',       key:'order',  type:'number', placeholder:'数字小靠前' },
    ],
    onSubmit
  });
}
function onEdit(name) {
  const out = []; flat(TREE, 0, out);
  const r = out.find(x => x.name === name);
  const m = buildMenuModal('编辑菜单', d => { Object.assign(r, d); render(); toast('已保存'); });
  m.open(r);
}
render();
</script></body></html>
