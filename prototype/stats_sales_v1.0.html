<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>销售统计</title><link rel="stylesheet" href="_admin_list.css">
<style>
.dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 16px; }
.dash-card { background: #fff; border-radius: 6px; border: 1px solid var(--border); padding: 14px 16px; }
.dash-title { font-size: 13.5px; font-weight: 600; margin-bottom: 8px; color: var(--text-1); border-left: 3px solid var(--wx-green); padding-left: 8px; }
.dash-card table { font-size: 12.5px; }
.rank-num { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; background: #f0f2f5; color: var(--text-2); }
.rank-num.r1 { background: linear-gradient(135deg, #fcd34d, #f59e0b); color: #fff; }
.rank-num.r2 { background: linear-gradient(135deg, #c0c8d1, #94a3b8); color: #fff; }
.rank-num.r3 { background: linear-gradient(135deg, #fdba74, #f97316); color: #fff; }
.table-wrap { padding: 0; }
</style>
</head>
<body>

<div class="filter-bar">
  <div class="f-group" style="gap:4px;">
    <button class="btn sm">今天</button>
    <button class="btn sm">昨天</button>
    <button class="btn sm">本周</button>
    <button class="btn sm">本月</button>
    <button class="btn sm">上月</button>
    <button class="btn sm">本年度</button>
    <button class="btn sm">近七天</button>
    <button class="btn sm">近一月</button>
  </div>
  <div class="f-group">
    <input class="f-input date" type="date" placeholder="开始日期">
    <span class="f-sep">至</span>
    <input class="f-input date" type="date" placeholder="结束日期">
  </div>
  <button class="btn primary" onclick="toast('搜索')">🔍 搜索</button>
  <button class="btn" onclick="toast('重置')">重置</button>
</div>

<div class="table-wrap">
  <div class="dash-grid">

    <div class="dash-card">
      <div class="dash-title">商品预付人数 TOP</div>
      <table><thead><tr><th>排名</th><th>商品名称</th><th>预付人数</th></tr></thead>
        <tbody id="t1"></tbody></table>
    </div>

    <div class="dash-card">
      <div class="dash-title">商品预付金额 TOP</div>
      <table><thead><tr><th>排名</th><th>商品名称</th><th>预付金额</th></tr></thead>
        <tbody id="t2"></tbody></table>
    </div>

    <div class="dash-card">
      <div class="dash-title">商品交付人数 TOP</div>
      <table><thead><tr><th>排名</th><th>商品名称</th><th>交付人数</th></tr></thead>
        <tbody id="t3"></tbody></table>
    </div>

    <div class="dash-card">
      <div class="dash-title">商品交付金额 TOP</div>
      <table><thead><tr><th>排名</th><th>商品名称</th><th>交付金额</th></tr></thead>
        <tbody id="t4"></tbody></table>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>
<script>
const T1 = [['玻尿酸丰唇 1ml',128],['肉毒素瘦脸针(进口)',96],['光子嫩肤 体验卡 3 次',82],['热玛吉 5 代',68],['韩式双眼皮(无痕)',55],['半永久眉毛(雾眉)',42],['童颜针 1 支',38],['M22 王者之冠',24]];
const T2 = [['热玛吉 5 代',1278800],['蝉翼双拱架鼻综合',995000],['吸脂手术(大腿环吸)',582400],['韩式双眼皮(无痕)',539000],['童颜针 1 支',258400],['肉毒素瘦脸针(进口)',268800],['玻尿酸丰唇 1ml',102400],['光子嫩肤 体验卡 3 次',162360]];
const T3 = [['玻尿酸丰唇 1ml',102],['肉毒素瘦脸针(进口)',78],['光子嫩肤 体验卡 3 次',65],['热玛吉 5 代',55],['韩式双眼皮(无痕)',48],['童颜针 1 支',32],['半永久眉毛(雾眉)',38],['蝉翼双拱架鼻综合',12]];
const T4 = [['热玛吉 5 代',1034000],['蝉翼双拱架鼻综合',477600],['韩式双眼皮(无痕)',470400],['吸脂手术(大腿环吸)',390400],['童颜针 1 支',217600],['肉毒素瘦脸针(进口)',218400],['光子嫩肤 体验卡 3 次',128700],['玻尿酸丰唇 1ml',81600]];
function rankBadge(i) { return `<span class="rank-num ${i<3?'r'+(i+1):''}">${i+1}</span>`; }
function fillTable(id, rows, money) {
  document.getElementById(id).innerHTML = rows.map((r,i) => `
    <tr><td>${rankBadge(i)}</td><td>${r[0]}</td><td class="col-num ${money?'success':''}">${money ? '¥'+r[1].toLocaleString('zh-CN') : r[1]}</td></tr>
  `).join('');
}
fillTable('t1', T1, false);
fillTable('t2', T2, true);
fillTable('t3', T3, false);
fillTable('t4', T4, true);
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
</script></body></html>
