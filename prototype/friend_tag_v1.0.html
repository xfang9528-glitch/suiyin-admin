<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>好友标签</title>
<link rel="stylesheet" href="_admin_list.css">
<script src="_edit_modal.js" defer></script>
</head>
<body>

<div class="filter-bar">
  <div class="f-group"><span class="f-label">标题</span><input class="f-input wide" id="kw" placeholder="关键词"></div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <button class="btn" onclick="onReset()">重置</button>
  <div class="f-spacer"></div>
  <button class="btn primary" onclick="onCreate()">＋ 新增标签</button>
</div>

<div class="table-wrap">
  <div class="table-card">
    <table>
      <thead><tr>
        <th>标题</th><th>类型</th><th>状态</th><th>创建时间</th><th>更新时间</th><th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info" id="pagerInfo">共 0 条</span>
  <select><option>10条/页</option></select>
  <button class="pager-btn">‹</button>
  <button class="pager-btn cur">1</button>
  <button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>

<script>
// 真实只有 1 条"全部客户"，补几条艺星常用标签作为示意
const ROWS = [
  { title:'全部客户',  type:'-',     status:'使用', createdAt:'2025-11-07 15:26:15', updatedAt:'2025-11-07 15:26:15' },
  { title:'高意向客户', type:'系统', status:'使用', createdAt:'2026-01-12 09:12:30', updatedAt:'2026-04-20 14:08:55' },
  { title:'已成交',     type:'系统', status:'使用', createdAt:'2026-01-12 09:13:45', updatedAt:'2026-05-01 11:22:18' },
  { title:'到院未成交', type:'系统', status:'使用', createdAt:'2026-01-12 09:14:11', updatedAt:'2026-04-28 16:50:33' },
  { title:'敏感客户',   type:'人工', status:'使用', createdAt:'2026-02-08 11:08:20', updatedAt:'2026-04-30 10:15:00' },
  { title:'老客转介绍', type:'系统', status:'使用', createdAt:'2026-02-15 14:30:00', updatedAt:'2026-04-25 09:40:12' },
  { title:'失联客户',   type:'系统', status:'停用', createdAt:'2026-03-02 10:00:00', updatedAt:'2026-04-15 17:20:45' },
];
function render() {
  const kw = document.getElementById('kw').value.trim();
  const list = ROWS.filter(r => !kw || r.title.includes(kw));
  document.getElementById('tbody').innerHTML = list.length ? list.map(r => `
    <tr>
      <td>${r.title}</td>
      <td>${r.type === '-' ? '<span style="color:var(--text-3)">-</span>' : `<span class="tag ${r.type === '系统' ? 'blue' : 'green'}">${r.type}</span>`}</td>
      <td>${r.status === '使用' ? '<span class="badge">使用</span>' : '<span class="badge gray">停用</span>'}</td>
      <td class="col-time">${r.createdAt}</td>
      <td class="col-time">${r.updatedAt}</td>
      <td class="col-actions">
        <button class="row-action" onclick="toast('打开标签管理（管理标签下的好友/分类）')">🏷 标签管理</button>
        <button class="row-action muted" onclick="onEdit('${r.title.replace(/'/g, "\\'")}')">✏ 修改标签</button>
        <button class="row-action danger" onclick="toast('删除（需二次确认）')">🗑 删除</button>
      </td>
    </tr>
  `).join('') : `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🏷</div>暂无标签</div></td></tr>`;
  document.getElementById('pagerInfo').textContent = `共 ${list.length} 条`;
}
function onReset() { document.getElementById('kw').value = ''; render(); }
function buildTagModal(title, onSubmit) {
  return createEditModal({
    title,
    fields: [
      { label:'标签名称',     key:'title',  type:'text',   placeholder:'例：高意向客户', required:true },
      { label:'类型',         key:'type',   type:'select', options:['系统','人工','规则触发'] },
      { label:'状态',         key:'status', type:'select', options:['使用','停用'] },
      { label:'触发规则',     key:'rule',   type:'textarea',placeholder:'例：聊天关键词包含「面诊/价格/案例」且未成交' },
      { label:'对客户端可见', key:'visible',type:'switch' },
    ],
    onSubmit
  });
}
function onCreate() {
  const m = buildTagModal('新增标签', d => { ROWS.unshift({ title:d.title, type:d.type, status:d.status, createdAt:new Date().toISOString().replace('T',' ').slice(0,19), updatedAt:new Date().toISOString().replace('T',' ').slice(0,19) }); render(); toast('已新增'); });
  m.open({ type:'人工', status:'使用' });
}
function onEdit(title) {
  const r = ROWS.find(x => x.title === title);
  const m = buildTagModal('编辑标签', d => { Object.assign(r, d, { updatedAt:new Date().toISOString().replace('T',' ').slice(0,19) }); render(); toast('已保存'); });
  m.open(r);
}
let tt;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }
render();
</script>
</body>
</html>
