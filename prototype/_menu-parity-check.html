<!doctype html><meta charset="utf-8"><title>菜单结构与交互验收</title><style>body{font:14px system-ui;padding:20px}iframe{width:1480px;height:1000px;border:0}pre{white-space:pre-wrap}button{padding:10px}</style><h1>菜单结构与交互验收</h1><p>仅使用独立 QA 存储。检查所有保留租户的菜单结构及本地交互。</p><button id="run">运行菜单验收</button><pre id="report">待运行</pre><div id="stage"></div><script>
let frame;const results=[];
const check=(name,ok,detail='')=>{results.push({name,passed:!!ok,detail});report.textContent=JSON.stringify({checks:results.length,passed:results.filter(x=>x.passed).length,failed:results.filter(x=>!x.passed)},null,2);};
const wait=fn=>new Promise((resolve,reject)=>{const start=Date.now(),id=setInterval(()=>{try{if(fn()){clearInterval(id);resolve();}else if(Date.now()-start>15000){clearInterval(id);reject(Error('页面超时'));}}catch{}},30)});
async function load(tenant,route,shell=false){frame?.remove();frame=document.createElement('iframe');frame.src=(shell?'_shell.html?qa=1&tenant='+tenant+'&page=':'admin-content.html?qa=1&tenant='+tenant+'&route=')+route;stage.append(frame);await wait(()=>shell?frame.contentDocument?.querySelector('iframe')?.contentDocument?.body.dataset.contentReady:frame.contentDocument?.body.dataset.contentReady);return frame.contentDocument;}
const click=(d,label,scope=d)=>{const b=[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===label||b.getAttribute('aria-label')===label);if(!b)throw Error('按钮缺失 '+label);b.click();};
const row=(d,name)=>[...d.querySelectorAll('.menu-tree-table tbody tr')].find(r=>r.cells[0].textContent.trim()===name);
const reset=()=>Object.keys(localStorage).filter(k=>k.startsWith('admin-qa:v1:')||k.startsWith('admin-qa-nav:')).forEach(k=>localStorage.removeItem(k));
run.onclick=async()=>{run.disabled=true;results.length=0;reset();try{
 const nav=await fetch('data/navigation-snapshot.json').then(r=>r.json());
 for(const t of nav.tenants){const d=await load(t.id,'menu'),rows=[...d.querySelectorAll('.menu-tree-table tbody tr')];check(t.id+' 菜单完整树结构',rows.length===t.settings.length&&rows.every((r,i)=>Number(r.dataset.depth)===t.settings[i].level));check(t.id+' 原站专用布局',!!d.querySelector('.menu-page-header')&&!d.querySelector('.filter-panel,.pager,.table-column-settings')&&d.querySelectorAll('.menu-permission-switch').length===rows.length&&[...d.querySelectorAll('td.menu-flex-space')].every(c=>!c.textContent.trim()));}
 let d=await load('yestar-sz','menu');check('表头、行高和宽度',Math.abs(d.querySelector('thead tr').getBoundingClientRect().height-39.8)<.3&&Math.abs(d.querySelector('tbody tr').getBoundingClientRect().height-57.4)<.3&&d.querySelector('.menu-table-wrap').clientWidth===d.querySelector('table').clientWidth);
 click(d,'收起医生管理');check('收起隐藏整组子菜单',row(d,'医生列表').hidden&&row(d,'项目管理').hidden&&!row(d,'好友管理').hidden);click(d,'展开医生管理');check('展开恢复子菜单',!row(d,'医生列表').hidden);
 click(d,'编辑',row(d,'销售管理'));check('菜单名称只读且三个字段列',d.querySelector('[data-field="菜单名称"]').disabled&&d.defaultView.getComputedStyle(d.querySelector('.menu-edit-form')).gridTemplateColumns.split(' ').length===3);d.querySelector('[data-field="排序"]').value='-1';click(d,'减少排序');check('排序允许负数',d.querySelector('[data-field="排序"]').value==='-2');click(d,'取 消');check('取消不写入',row(d,'销售管理').cells[3].textContent==='14');
 click(d,'销售管理超级权限');d=await load('yestar-sz','menu');check('权限开关刷新保留',row(d,'销售管理').querySelector('[role="switch"]').getAttribute('aria-checked')==='true');click(d,'记录',row(d,'销售管理'));check('记录关联修改的菜单',d.querySelector('.menu-audit-table').textContent.includes('超级权限')&&d.querySelector('.menu-audit-table').textContent.includes('UPDATE'));click(d,'关闭对话框');
 click(d,'编辑',row(d,'医生管理'));d.querySelector('.radio-group input[value="隐藏"]').click();click(d,'确 定');d=await load('yestar-sz','menu',true);check('菜单隐藏同步侧栏',![...d.querySelectorAll('.nav-group>summary')].some(e=>e.textContent==='医生管理'));check('备注需求词库属于聊天管理',[...d.querySelectorAll('.nav-group')].some(e=>e.querySelector('summary').textContent==='聊天管理'&&e.textContent.includes('备注需求词库')));click(d,'关闭 菜单管理');check('最后一个页签可关闭',!d.querySelector('.frame-wrap')&&!d.querySelector('.shell-state'));click(d,'菜单管理');await wait(()=>d.querySelector('iframe')?.contentDocument?.body.dataset.contentReady);check('关闭后可再次打开',!!d.querySelector('iframe').contentDocument.querySelector('.menu-tree-table'));
 d=await load('yestar','menu');check('租户修改隔离',row(d,'销售管理').querySelector('[role="switch"]').getAttribute('aria-checked')==='false');check('成都保留自身菜单状态',row(d,'分佣管理').cells[2].textContent==='隐藏');
 d=await load('bzds','allMenu');check('平台菜单100行树表',d.querySelectorAll('tbody tr').length===100&&!!d.querySelector('.platform-menu-page')&&!d.querySelector('.pager'));click(d,'编辑',row(d,'销售管理'));check('平台菜单弹窗两列',d.defaultView.getComputedStyle(d.querySelector('.menu-edit-form')).gridTemplateColumns.split(' ').length===2);click(d,'父级菜单');check('父级菜单选项完整且禁止自己',d.querySelectorAll('.menu-parent-row').length===22&&[...d.querySelectorAll('.menu-parent-row button')].some(b=>b.textContent==='销售管理'&&b.disabled));click(d,'展开专家管理');check('父级下拉支持展开子级',!d.querySelector('.menu-parent-children').hidden);click(d,'取 消');
 click(d,'编辑',row(d,'专家管理'));click(d,'父级菜单');check('禁止将父菜单移动到自己子菜单',d.querySelector('.menu-parent-children button').disabled);click(d,'取 消');
 click(d,'编辑',row(d,'销售管理'));click(d,'确 定');check('仅修改属性不会移动菜单位置',d.querySelector('tbody tr').cells[0].textContent==='销售管理');click(d,'删除',row(d,'销售管理'));check('删除使用警告确认框',d.querySelector('dialog').classList.contains('menu-delete-dialog')&&d.querySelector('dialog').textContent.includes('确认删除菜单?'));click(d,'取消');check('取消删除保留原记录',!!row(d,'销售管理'));
 click(d,'全部记录');check('全部记录表头符合原站',d.querySelectorAll('.menu-audit-table th').length===6&&!d.querySelector('#dialogFooter').textContent);click(d,'关闭对话框');
 check('菜单交互过程中无加载错误',!d.querySelector('.error-card'));
 }catch(e){check('执行异常',false,e.stack);}finally{reset();document.body.dataset.done='true';run.disabled=false;}};
</script>
