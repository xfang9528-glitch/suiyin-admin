<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>好友列表</title><link rel="stylesheet" href="_admin_list.css">
<script src="_edit_modal.js" defer></script>
<style>
.dropdown-row { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
.total-card { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1.5px solid var(--wx-green); color: var(--wx-green); border-radius: 6px; font-size: 13px; font-weight: 500; }
.total-card .num { font-size: 18px; font-weight: 700; }
.dd-trigger {
  display: inline-flex; align-items: center; gap: 4px;
  height: 32px; padding: 0 12px; border-radius: 4px;
  border: 1px solid #d0d7de; background: #fff; color: var(--text-2);
  font-size: 13px; cursor: pointer;
}
.dd-trigger:hover { border-color: var(--wx-green); color: var(--wx-green); }
.dd-trigger .arrow { font-size: 10px; opacity: 0.6; }
.filter-bar { height: auto; min-height: 56px; padding: 12px 16px; flex-wrap: wrap; }
.table-wrap { top: 130px; }
.col-check { width: 36px; }
.batch-bar {
  position: fixed; bottom: var(--pager-h); left: 0; right: 0;
  height: 40px; padding: 0 16px;
  background: #fff; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; z-index: 4;
}
.table-wrap { bottom: calc(var(--pager-h) + 40px); }
.cell-info {
  font-size: 11.5px; color: var(--text-3); line-height: 1.5;
}
.cell-info strong { color: var(--text-2); font-weight: 500; }
</style></head>
<body>

<div class="filter-bar">
  <div class="dropdown-row" style="padding:0;background:transparent;border:none;">
    <span class="total-card">全部好友 <span class="num">993,226</span> 人 ▾</span>
    <button class="dd-trigger">来源信息 <span class="arrow">▾</span></button>
    <button class="dd-trigger">好友信息 <span class="arrow">▾</span></button>
    <button class="dd-trigger">用户信息 <span class="arrow">▾</span></button>
    <button class="dd-trigger">购买信息 <span class="arrow">▾</span></button>
  </div>
  <div class="f-group" style="margin-top:8px;">
    <span class="f-label">关键词</span>
    <input class="f-input wide" id="kw" placeholder="好友名/备注/手机号">
  </div>
  <div class="f-group" style="margin-top:8px;">
    <span class="f-label">接待好友</span>
    <select class="f-select"><option>请选择</option></select>
  </div>
  <div class="f-group" style="margin-top:8px;">
    <span class="f-label">按待中销售</span>
    <select class="f-select"><option>请选择</option></select>
  </div>
  <div class="f-group" style="margin-top:8px;">
    <span class="f-label">专属销售</span>
    <select class="f-select"><option>请选择</option></select>
  </div>
  <button class="btn primary" style="margin-top:8px;" onclick="render()">🔍 查询</button>
  <button class="btn" style="margin-top:8px;" onclick="onReset()">重置</button>
  <button class="btn" style="margin-top:8px;" onclick="toast('导出')">📤 导出表格</button>
  <button class="btn" style="margin-top:8px;" onclick="toast('保存为标签')">💾 保存为标签</button>
  <div class="f-spacer"></div>
  <button class="btn primary" style="margin-top:8px;" onclick="toast('创建虚拟好友')">＋ 创建虚拟好友</button>
  <button class="btn" style="margin-top:8px;" onclick="toast('全部记录')">📋 全部记录</button>
</div>

<div class="table-wrap" style="top:130px;">
  <div class="table-card scroll" style="min-width:1900px;">
    <table>
      <thead><tr>
        <th class="col-check"><input type="checkbox"></th>
        <th>微信昵称</th><th>好友名称</th><th>基本信息</th>
        <th>可接待销售</th><th>来源信息</th><th>好友状态</th>
        <th>所在账号</th><th>销售 SPU</th><th>购买 SPU</th>
        <th>用户信息</th><th>免打扰</th>
        <th>添加时间</th><th>更新时间</th>
        <th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="batch-bar">
  <button class="btn">批量删除</button>
</div>

<div class="pager">
  <span class="pager-info">共 903,395 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button>
  <button class="pager-btn cur">1</button><button class="pager-btn">2</button><button class="pager-btn">3</button>
  <button class="pager-btn">4</button><button class="pager-btn">5</button><button class="pager-btn">6</button>
  <span class="pager-ellipsis">…</span><button class="pager-btn">45170</button>
  <button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
function avatarChip(seed, ch) {
  const colors = [['#fbcfe8','#f9a8d4'],['#bbf7d0','#86efac'],['#bfdbfe','#93c5fd'],['#fde68a','#fcd34d'],['#ddd6fe','#c4b5fd'],['#fecaca','#fca5a5'],['#a5f3fc','#67e8f9'],['#fed7aa','#fdba74']];
  const [c1, c2] = colors[seed % colors.length];
  return `<span class="avatar" style="--c1:${c1};--c2:${c2}">${ch}</span>`;
}
// 真实数据脱敏（昵称保留，手机号脱敏）
const ROWS = [
  { nick:'有有',          name:'Y 点评 260425 水光',   phone:'13880056316', sex:'',  birth:'',  city:'',                  scope:'全部', src:'',     status:'',  acc:'AA Yostar 艺星小品 17882352550', saleSpu:'', buySpu:'', userInfo:'PDM 卡号: -\n客户等级: -\n到院: -',           dnd:false, addAt:'',                   updAt:'2026-05-06 11:58' },
  { nick:'pianouan',      name:'Y 点评 260502 玻尿酸', phone:'15080761033', sex:'',  birth:'',  city:'',                  scope:'全部', src:'',     status:'',  acc:'AA Yostar 艺星小品 17882352550', saleSpu:'', buySpu:'', userInfo:'PDM 卡号: -\n客户等级: -\n到院: -',           dnd:false, addAt:'',                   updAt:'2026-05-06 11:58' },
  { nick:'云上开车老司机',name:'Y 点评 260502 祛斑',   phone:'15008206791', sex:'',  birth:'',  city:'',                  scope:'全部', src:'',     status:'',  acc:'AA Yostar 艺星小品 17882352550', saleSpu:'', buySpu:'', userInfo:'PDM 卡号: -\n客户等级: -\n到院: -',           dnd:false, addAt:'',                   updAt:'2026-05-06 11:57' },
  { nick:'灵',            name:'Y 230506 胸部 15528811139', phone:'',     sex:'',  birth:'',  city:'',                  scope:'全部', src:'',     status:'',  acc:'AA Yostar 艺星小品 17882352550', saleSpu:'', buySpu:'', userInfo:'PDM 卡号: -\n客户等级: -\n到院: -',           dnd:false, addAt:'',                   updAt:'2026-05-06 11:56' },
  { nick:'rosy',          name:'rosy',                phone:'',           sex:'',  birth:'',  city:'',                  scope:'',     src:'A 成都艺星院长助理好好 17713619739', status:'', acc:'',                                saleSpu:'', buySpu:'', userInfo:'PDM 卡号: -\n客户等级: -\n到院: -',           dnd:false, addAt:'2026-05-06 11:54',   updAt:'2026-05-06 11:54' },
  { nick:'小狮籍~',       name:'Y 抖音填充 19808331579', phone:'',         sex:'',  birth:'',  city:'四川省 乐山市',     scope:'全部', src:'',     status:'',  acc:'贾敏',                            saleSpu:'', buySpu:'', userInfo:'',                                              dnd:false, addAt:'2026-05-06 11:50',   updAt:'2026-05-06 11:50' },
  { nick:'😈',           name:'Y 点评 191123 鼻子 18848458937', phone:'', sex:'',  birth:'',  city:'',                  scope:'全部', src:'',     status:'',  acc:'孙丽威',                          saleSpu:'', buySpu:'', userInfo:'',                                              dnd:false, addAt:'2026-05-06 11:48',   updAt:'2026-05-06 11:48' },
  { nick:'9826',          name:'w 260506 周 18783951824', phone:'',       sex:'',  birth:'',  city:'四川省 南充市',     scope:'全部', src:'',     status:'',  acc:'艺星专家助理妍妍',                saleSpu:'', buySpu:'', userInfo:'',                                              dnd:false, addAt:'2026-05-06 11:45',   updAt:'2026-05-06 11:46' },
  { nick:'',              name:'Y 抖音祛斑 17711083896', phone:'',        sex:'',  birth:'',  city:'',                  scope:'全部', src:'',     status:'',  acc:'贾敏',                            saleSpu:'', buySpu:'', userInfo:'PDM 卡号: -\n客户等级: -\n到院: -',           dnd:false, addAt:'2026-05-06 11:44',   updAt:'2026-05-06 11:53' },
  { nick:'豪德自萎',      name:'Y 点评 260429 兜子 15079173510', phone:'', sex:'', birth:'',  city:'',                  scope:'全部', src:'',     status:'',  acc:'AA Yostar 艺星小品 17882352550', saleSpu:'', buySpu:'', userInfo:'PDM 卡号: -\n客户等级: -\n到院: -',           dnd:false, addAt:'',                   updAt:'2026-05-06 11:49' },
  { nick:'豆公子',        name:'Y 260506 脱毛 13880132371',     phone:'138****2371', sex:'', birth:'', city:'四川省 成都市', scope:'全部', src:'', status:'', acc:'何陈秀', saleSpu:'', buySpu:'', userInfo:'PDM 卡号: cd260506130\n客户等级: -\n到院: -', dnd:false, addAt:'2026-05-06 11:37',   updAt:'2026-05-06 11:54' },
  { nick:'Ww 蕊蕊_',     name:'Ww 蕊蕊_',                       phone:'',        sex:'', birth:'', city:'',                 scope:'全部', src:'', status:'', acc:'何陈秀',                          saleSpu:'', buySpu:'', userInfo:'',                                              dnd:false, addAt:'2026-05-06 11:35',   updAt:'2026-05-06 11:51' },
  { nick:'jiujiu',        name:'W 260506 哈 18819519381',       phone:'',        sex:'', birth:'', city:'',                 scope:'全部', src:'', status:'', acc:'桂佳',                            saleSpu:'', buySpu:'', userInfo:'PDM 卡号: -\n客户等级: -\n到院: -',           dnd:false, addAt:'2026-05-06 11:34',   updAt:'2026-05-06 11:43' },
];
function render() {
  document.getElementById('tbody').innerHTML = ROWS.map((r,i) => {
    const ch = (r.nick || '?')[0];
    return `
    <tr>
      <td><input type="checkbox"></td>
      <td><div class="user-cell">${avatarChip(i, ch)}<div class="user-name">${r.nick || '<span style="color:var(--text-3)">(未命名)</span>'}</div></div></td>
      <td><div style="font-size:12.5px;line-height:1.5;">${r.name}<br><span style="color:var(--text-3)">${r.phone}</span></div></td>
      <td><div class="cell-info">性别: ${r.sex || '-'}<br>生日: ${r.birth || '-'}<br>省市区: ${r.city || '-'}</div></td>
      <td>${r.scope || '<span style="color:var(--text-3)">-</span>'}</td>
      <td>${r.src ? `<span style="font-size:12px;color:var(--text-2);">${r.src}</span>` : '<span style="color:var(--text-3)">-</span>'}</td>
      <td>${r.status || '<span style="color:var(--text-3)">-</span>'}</td>
      <td><span style="font-size:12.5px;color:var(--text-2);">${r.acc}</span></td>
      <td>${r.saleSpu || '<span style="color:var(--text-3)">-</span>'}</td>
      <td>${r.buySpu || '<span style="color:var(--text-3)">-</span>'}</td>
      <td><div class="cell-info">${(r.userInfo || '-').split('\n').join('<br>')}</div></td>
      <td>${r.dnd ? '<span class="badge">是</span>' : '<span style="color:var(--text-3)">-</span>'}</td>
      <td class="col-time ${r.addAt ? '' : 'empty'}">${r.addAt || '—'}</td>
      <td class="col-time">${r.updAt}</td>
      <td class="col-actions">
        <button class="row-action" onclick="onEdit(${i})">编辑</button>
        <button class="row-action danger" onclick="toast('删除好友')">删除</button>
        <button class="row-action muted" onclick="toast('查看记录')">记录</button>
      </td>
    </tr>`;
  }).join('');
}
function onReset() { document.getElementById('kw').value=''; render(); }
let editModal;
function onEdit(idx) {
  const r = ROWS[idx];
  if (!editModal) editModal = createEditModal({
    title: '修改好友',
    fields: [
      { label:'用户昵称',  key:'nick',    type:'text',   placeholder:'请输入好友昵称' },
      { label:'专属销售',  key:'persona', type:'select', options:['杜佳','杨瑶 yiyi','陈巧','聂敏','刘瑜02','艺星专家助理妍妍','贾敏','孙丽威','何陈秀','桂佳'] },
      { label:'微信号',    key:'wxid',    type:'text',   placeholder:'请输入微信号' },
      { label:'性别',      key:'sex',     type:'radio',  options:['未知','男','女'] },
      { label:'免打扰',    key:'dnd',     type:'switch' },
    ],
    onSubmit: (d) => { Object.assign(ROWS[onEdit._idx], { nick: d.nick, sex: d.sex, dnd: d.dnd }); render(); toast('已保存'); }
  });
  onEdit._idx = idx;
  editModal.open({ nick: r.nick, persona: r.acc, wxid: '', sex: r.sex || '未知', dnd: r.dnd });
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script></body></html>
