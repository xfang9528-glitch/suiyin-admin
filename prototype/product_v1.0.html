<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>商品管理</title>
<link rel="stylesheet" href="_admin_list.css">
<script src="_edit_modal.js" defer></script>
</head>
<body>

<div class="filter-bar">
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="商品名称"></div>
  <div class="f-group">
    <input class="f-input date" id="d1" type="date" placeholder="上架开始日期">
    <span class="f-sep">至</span>
    <input class="f-input date" id="d2" type="date" placeholder="上架结束日期">
  </div>
  <div class="f-group">
    <select class="f-select" id="status">
      <option value="">商品状态</option>
      <option value="online">已上架</option>
      <option value="offline">已下架</option>
      <option value="draft">草稿</option>
    </select>
  </div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <div class="f-spacer"></div>
  <button class="btn primary" onclick="onCreate()">＋ 创建</button>
  <button class="btn" onclick="toast('查看全部记录')">📋 全部记录</button>
</div>

<div class="table-wrap">
  <div class="table-card scroll">
    <table>
      <thead><tr>
        <th>商品名称</th><th>价格(元) ↕</th><th>使用次数 ↕</th><th>单价 ↕</th>
        <th>佣金比例 ↕</th><th>访问量 ↕</th><th>类目</th><th>门店</th>
        <th>商品状态 ↕</th><th>创建时间 ↕</th><th>最新迭代时间 ↕</th>
        <th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info" id="pagerInfo">共 0 条</span>
  <select><option>10条/页</option></select>
  <button class="pager-btn">‹</button>
  <button class="pager-btn cur">1</button>
  <button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>

<script>
// 艺星医美场景 mock：常见医美套餐
const ROWS = [
  { name:'玻尿酸丰唇 1ml',          price:800,    times:1,  unit:800,    rate:'15%', visits:2148, cat:'微整注射', store:'全店通用',     status:'online',  createdAt:'2026-01-20 10:00:00', updatedAt:'2026-04-25 11:30:18' },
  { name:'韩式双眼皮 (无痕)',        price:9800,   times:1,  unit:9800,   rate:'12%', visits:1820, cat:'眼部整形', store:'旗舰店',       status:'online',  createdAt:'2026-01-22 09:30:21', updatedAt:'2026-05-02 14:08:44' },
  { name:'蝉翼双拱架鼻综合',         price:39800,  times:1,  unit:39800,  rate:'10%', visits:986,  cat:'鼻部整形', store:'高新店',       status:'online',  createdAt:'2026-02-01 11:15:00', updatedAt:'2026-05-04 09:20:11' },
  { name:'热玛吉 5 代 全脸',         price:18800,  times:1,  unit:18800,  rate:'18%', visits:3420, cat:'抗衰提升', store:'全店通用',     status:'online',  createdAt:'2026-02-08 13:00:00', updatedAt:'2026-05-05 17:00:20' },
  { name:'半永久眉毛 (雾眉)',        price:1280,   times:1,  unit:1280,   rate:'25%', visits:4530, cat:'半永久',   store:'旗舰店',       status:'online',  createdAt:'2026-02-10 08:50:00', updatedAt:'2026-05-03 10:48:50' },
  { name:'肉毒素瘦脸针 (进口)',      price:2800,   times:1,  unit:2800,   rate:'20%', visits:5612, cat:'微整注射', store:'全店通用',     status:'online',  createdAt:'2026-02-15 09:00:00', updatedAt:'2026-05-06 09:00:01' },
  { name:'光子嫩肤 体验卡 (3次)',    price:1980,   times:3,  unit:660,    rate:'30%', visits:2240, cat:'激光美肤', store:'全店通用',     status:'online',  createdAt:'2026-03-01 10:00:00', updatedAt:'2026-04-30 12:00:00' },
  { name:'吸脂手术 (大腿环吸)',      price:48800,  times:1,  unit:48800,  rate:'8%',  visits:512,  cat:'形体雕塑', store:'旗舰店',       status:'online',  createdAt:'2026-03-08 14:00:00', updatedAt:'2026-04-28 11:22:30' },
  { name:'童颜针 1 支',             price:6800,   times:1,  unit:6800,   rate:'12%', visits:1180, cat:'抗衰提升', store:'全店通用',     status:'online',  createdAt:'2026-03-12 10:30:00', updatedAt:'2026-05-04 16:50:00' },
  { name:'M22 王者之冠',            price:5800,   times:1,  unit:5800,   rate:'15%', visits:1605, cat:'激光美肤', store:'高新店',       status:'offline', createdAt:'2026-01-15 09:00:00', updatedAt:'2026-04-15 15:33:21' },
];
function statusBadge(s) { return s === 'online' ? '<span class="badge">已上架</span>' : (s === 'offline' ? '<span class="badge gray">已下架</span>' : '<span class="badge warn">草稿</span>'); }
function render() {
  const kw = document.getElementById('kw').value.trim();
  const st = document.getElementById('status').value;
  const list = ROWS.filter(r => (!kw || r.name.includes(kw)) && (!st || r.status === st));
  document.getElementById('tbody').innerHTML = list.length ? list.map(r => `
    <tr>
      <td>${r.name}</td>
      <td class="col-num">¥${r.price.toLocaleString('zh-CN')}</td>
      <td class="col-num">${r.times}</td>
      <td class="col-num">¥${r.unit.toLocaleString('zh-CN')}</td>
      <td class="col-num">${r.rate}</td>
      <td class="col-num muted">${r.visits.toLocaleString('zh-CN')}</td>
      <td><span class="tag blue">${r.cat}</span></td>
      <td>${r.store}</td>
      <td>${statusBadge(r.status)}</td>
      <td class="col-time">${r.createdAt}</td>
      <td class="col-time">${r.updatedAt}</td>
      <td class="col-actions">
        <button class="row-action" onclick="onEdit(${ROWS.indexOf(r)})">✏ 编辑</button>
        <button class="row-action muted" onclick="toast('${r.status === 'online' ? '下架' : '上架'}')">⇄ ${r.status === 'online' ? '下架' : '上架'}</button>
        <button class="row-action muted" onclick="toast('查看记录')">📋 记录</button>
      </td>
    </tr>
  `).join('') : `<tr><td colspan="12"><div class="empty-state"><div class="empty-icon">📦</div>暂无数据</div></td></tr>`;
  document.getElementById('pagerInfo').textContent = `共 ${list.length} 条`;
}
let tt;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }
let pModal;
function buildModal(title, onSubmit) {
  return createEditModal({
    title, width: 720,
    fields: [
      { label:'商品名称', key:'name',  type:'text',   placeholder:'例：玻尿酸丰唇 1ml', required:true },
      { label:'商品类目', key:'cat',   type:'select', options:['鼻部整形','眼部整形','形体雕塑','微整注射','激光美肤','抗衰提升','半永久','私密整形','咨询其他'] },
      { label:'门店',     key:'store', type:'select', options:['全店通用','旗舰店','高新店'] },
      { label:'使用次数', key:'times', type:'number', placeholder:'例：1' },
      { label:'单位',     key:'unit',  type:'select', options:['次','ml','支','瓶','片','盒','疗程','台'] },
      { label:'佣金比例', key:'rate',  type:'number', placeholder:'%', suffix:'%' },
      { label:'价格',     key:'price', type:'number', placeholder:'元', suffix:'元' },
      { label:'商品卖点', key:'sellPoint', type:'textarea', placeholder:'1-3 行核心卖点，如「无痕 / 当天能化妆 / 谢斐院长亲诊」' },
      { label:'商品头图', key:'cover', type:'image' },
      { label:'商品详情', key:'detail',type:'rich', placeholder:'富文本：图文 / 视频 / 案例对比' },
    ],
    onSubmit
  });
}
function onEdit(idx) {
  const r = ROWS[idx];
  if (!pModal) pModal = buildModal('编辑商品', d => { Object.assign(ROWS[onEdit._idx], d); render(); toast('已保存'); });
  onEdit._idx = idx;
  pModal.open({ name: r.name, cat: r.cat, store: r.store, times: r.times, unit: '次', rate: parseInt(r.rate), price: r.price });
}
function onCreate() {
  const m = buildModal('新增商品', d => { ROWS.unshift({ name: d.name, price: parseInt(d.price)||0, times:parseInt(d.times)||1, unit: parseInt(d.price)||0, rate: d.rate+'%', visits:0, cat:d.cat, store:d.store, status:'draft', createdAt: new Date().toISOString().replace('T',' ').slice(0,19), updatedAt:'-' }); render(); toast('已创建'); });
  m.open({});
}
render();
</script>
</body>
</html>
