<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>客户词控</title><link rel="stylesheet" href="_admin_list.css">
<script src="_edit_modal.js" defer></script></head>
<body>

<div class="filter-bar">
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="监控词关键词"></div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <div class="f-spacer"></div>
  <button class="btn primary" onclick="onCreate()">＋ 创建</button>
  <button class="btn" onclick="toast('监控日志')">📋 监控日志</button>
</div>

<div class="table-wrap">
  <div class="table-card">
    <table>
      <thead><tr>
        <th>监控词</th><th>启用</th><th>备注信息</th><th>创建时间</th>
        <th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info">共 63 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button>
  <button class="pager-btn cur">1</button><button class="pager-btn">2</button><button class="pager-btn">3</button>
  <button class="pager-btn">4</button>
  <button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { word:'退款',     enabled:true,  note:'客户提到退款，需立即跟进',         createdAt:'2026-03-15 09:00:18' },
  { word:'投诉',     enabled:true,  note:'客户投诉关键词，触发管理层告警',   createdAt:'2026-03-15 09:01:30' },
  { word:'差评',     enabled:true,  note:'消极评价，避免影响品牌',           createdAt:'2026-03-15 09:02:11' },
  { word:'起诉',     enabled:true,  note:'极端关键词，立即升级处理',         createdAt:'2026-03-15 09:03:00' },
  { word:'同行价格', enabled:true,  note:'客户提到竞品价格，研判流失风险',   createdAt:'2026-04-08 14:50:00' },
  { word:'后悔',     enabled:false, note:'暂时观察',                         createdAt:'2026-04-15 10:11:00' },
  { word:'失败',     enabled:true,  note:'手术结果担忧',                     createdAt:'2026-04-22 16:30:00' },
  { word:'感染',     enabled:true,  note:'医疗事故关键词，立即介入',         createdAt:'2026-04-22 16:32:11' },
];
function render() {
  const kw = document.getElementById('kw').value.trim();
  const list = ROWS.filter(r => !kw || r.word.includes(kw));
  document.getElementById('tbody').innerHTML = list.map(r => `
    <tr>
      <td><strong style="color:#f59e0b;">${r.word}</strong></td>
      <td><label class="switch"><input type="checkbox" ${r.enabled ? 'checked' : ''}><span class="switch-slider"></span></label></td>
      <td><span style="color:var(--text-3)">${r.note}</span></td>
      <td class="col-time">${r.createdAt}</td>
      <td class="col-actions">
        <button class="row-action" onclick="onEdit('${r.word.replace(/'/g, "\\'")}')">编辑</button>
        <button class="row-action danger" onclick="if(confirm('确认删除「${r.word}」？'))toast('已删除')">删除</button>
      </td>
    </tr>
  `).join('');
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
function buildModal(title, onSubmit) {
  return createEditModal({
    title,
    fields: [
      { label:'监控词',  key:'word',    type:'text',     placeholder:'例：投诉 / 退款', required:true },
      { label:'启用',    key:'enabled', type:'switch' },
      { label:'备注',    key:'note',    type:'textarea', placeholder:'触发条件 / 处理建议' },
    ],
    onSubmit
  });
}
function onCreate() {
  const m = buildModal('创建监控词', d => { ROWS.unshift({ ...d, createdAt:new Date().toISOString().replace('T',' ').slice(0,19) }); render(); toast('已新增'); });
  m.open({ enabled: true });
}
function onEdit(word) {
  const r = ROWS.find(x => x.word === word);
  const m = buildModal('编辑监控词', d => { Object.assign(r, d); render(); toast('已保存'); });
  m.open(r);
}
render();
</script></body></html>
