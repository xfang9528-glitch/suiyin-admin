<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>分佣明细</title><link rel="stylesheet" href="_admin_list.css"></head>
<body>

<div class="filter-bar">
  <div class="f-group"><span class="f-label">统计时间</span>
    <input class="f-input date" id="d1" type="date" value="2026-05-01">
    <span class="f-sep">至</span>
    <input class="f-input date" id="d2" type="date" value="2026-05-06">
  </div>
  <div class="f-group"><span class="f-label">分佣类型</span>
    <select class="f-select" id="type">
      <option value="">请选择分佣类型</option>
      <option>预付分佣</option><option>交付分佣</option><option>充值分佣</option>
    </select>
  </div>
  <div class="f-spacer"></div>
  <button class="btn primary" onclick="toast('导出 Excel')">📤 导出 Excel</button>
</div>

<div class="table-wrap">
  <div class="table-card scroll" style="min-width:1500px;">
    <table>
      <thead><tr>
        <th>分佣日期 ↕</th><th>分佣人姓名 ↕</th><th>分佣金额(元) ↕</th>
        <th>分佣原因</th><th>来自客户(微信昵称/姓名)</th>
        <th>订单日期</th><th>订单 SPU</th>
        <th>交付/预付</th><th>交付/预付单价(元)</th><th>交付/预付金额(元)</th>
        <th>分佣版本</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info" id="pagerInfo">共 0 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button><button class="pager-btn cur">1</button><button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { date:'2026-05-06', name:'杜佳',   amount:288.00, reason:'预付分佣', cus:'微微-客户A', orderDate:'2026-05-06', spu:'玻尿酸丰唇 1ml',     dpType:'预付', unit:800,   total:1600,  ver:'v2026.04' },
  { date:'2026-05-06', name:'杨瑶',   amount:1568.00,reason:'交付分佣', cus:'雯雯-客户B', orderDate:'2026-05-05', spu:'韩式双眼皮(无痕)',  dpType:'交付', unit:9800,  total:9800,  ver:'v2026.04' },
  { date:'2026-05-05', name:'陈巧',   amount:3980.00,reason:'交付分佣', cus:'敏敏-客户C', orderDate:'2026-05-04', spu:'蝉翼双拱架鼻综合',  dpType:'交付', unit:39800, total:39800, ver:'v2026.04' },
  { date:'2026-05-05', name:'聂敏',   amount:564.00, reason:'预付分佣', cus:'琪琪-客户D', orderDate:'2026-05-05', spu:'热玛吉 5 代',       dpType:'预付', unit:18800, total:18800, ver:'v2026.04' },
  { date:'2026-05-04', name:'刘瑜02', amount:128.00, reason:'交付分佣', cus:'-（半永久）', orderDate:'2026-05-04', spu:'半永久眉毛(雾眉)',  dpType:'交付', unit:1280,  total:1280,  ver:'v2026.04' },
  { date:'2026-05-04', name:'Lucy 💗',amount:560.00, reason:'交付分佣', cus:'琴-客户E',   orderDate:'2026-05-04', spu:'肉毒素瘦脸针(进口)',dpType:'交付', unit:2800,  total:2800,  ver:'v2026.04' },
  { date:'2026-05-03', name:'罗玲 金金',amount:594.00,reason:'交付分佣', cus:'李-客户F',   orderDate:'2026-05-03', spu:'光子嫩肤 体验卡 3 次', dpType:'交付', unit:660, total:1980, ver:'v2026.04' },
];
function render() {
  document.getElementById('tbody').innerHTML = ROWS.map(r => `
    <tr>
      <td class="col-time">${r.date}</td>
      <td>${r.name}</td>
      <td class="col-num success">¥${r.amount.toFixed(2)}</td>
      <td><span class="tag green">${r.reason}</span></td>
      <td>${r.cus}</td>
      <td class="col-time">${r.orderDate}</td>
      <td>${r.spu}</td>
      <td>${r.dpType === '预付' ? '<span class="tag blue">预付</span>' : '<span class="tag green">交付</span>'}</td>
      <td class="col-num">¥${r.unit.toLocaleString('zh-CN')}</td>
      <td class="col-num">¥${r.total.toLocaleString('zh-CN')}</td>
      <td><span class="tag">${r.ver}</span></td>
    </tr>
  `).join('');
  document.getElementById('pagerInfo').textContent = `共 ${ROWS.length} 条`;
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script></body></html>
