<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>分佣合计</title><link rel="stylesheet" href="_admin_list.css"></head>
<body>

<div class="filter-bar">
  <div class="f-group"><span class="f-label">统计时间</span>
    <input class="f-input date" id="d1" type="date" value="2026-05-01">
    <span class="f-sep">至</span>
    <input class="f-input date" id="d2" type="date" value="2026-05-06">
  </div>
  <div class="f-group" style="gap:4px;">
    <button class="btn sm" onclick="setRange('today')">今天</button>
    <button class="btn sm" onclick="setRange('yesterday')">昨天</button>
    <button class="btn sm" onclick="setRange('week')">本周</button>
    <button class="btn sm" onclick="setRange('month')">本月</button>
    <button class="btn sm" onclick="setRange('lastMonth')">上月</button>
    <button class="btn sm" onclick="setRange('7d')">最近一周</button>
    <button class="btn sm" onclick="setRange('30d')">最近一个月</button>
    <button class="btn sm" onclick="setRange('90d')">最近三个月</button>
  </div>
  <div class="f-spacer"></div>
  <button class="btn primary" onclick="toast('导出表格')">📤 导出表格</button>
</div>

<div class="table-wrap">
  <div class="table-card">
    <table>
      <thead><tr>
        <th>分佣人姓名</th>
        <th>总金额(元)</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info" id="pagerInfo">共 0 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button><button class="pager-btn cur">1</button><button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { name:'杜佳',           amount:18560.00 },
  { name:'杨瑶 yiyi',      amount:15820.50 },
  { name:'陈巧',           amount:14998.00 },
  { name:'聂敏',           amount:13560.00 },
  { name:'刘瑜02',         amount:9870.50 },
  { name:'Lucy 💗',        amount:8640.00 },
  { name:'罗玲 金金',       amount:7560.00 },
  { name:'赵紫颖03',       amount:6890.00 },
  { name:'曹琳',           amount:5760.00 },
  { name:'刘依王01',       amount:4980.00 },
  { name:'牛海兰03',       amount:3210.00 },
  { name:'YeStar 助理-铃铃',amount:2860.00 },
];
function render() {
  document.getElementById('tbody').innerHTML = ROWS.map(r => `
    <tr><td>${r.name}</td><td class="col-num success">¥${r.amount.toLocaleString('zh-CN', {minimumFractionDigits:2})}</td></tr>
  `).join('');
  document.getElementById('pagerInfo').textContent = `共 ${ROWS.length} 条`;
}
function setRange(k) { toast('已切换：' + k); }
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script></body></html>
