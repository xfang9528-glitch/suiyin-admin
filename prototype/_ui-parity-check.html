<!doctype html><meta charset="utf-8"><title>UI 与 UX 对照验收</title><style>body{font:14px system-ui;padding:20px}iframe{width:1280px;height:900px;border:1px solid #ddd}pre{white-space:pre-wrap}</style><h1>UI 与 UX 对照验收</h1><p>依据原网页计算样式和展开表单；使用独立 QA 数据。</p><button id="run">开始检查</button><pre id="report">待检查</pre><div id="stage"></div><script>
const results=[],report=document.querySelector('#report');let f;
const wait=fn=>new Promise((resolve,reject)=>{const start=Date.now(),id=setInterval(()=>{try{if(fn()){clearInterval(id);resolve();}else if(Date.now()-start>15000){clearInterval(id);reject(Error('载入超时'));}}catch{}},30);});
const check=(name,ok,detail)=>{results.push({name,passed:!!ok,detail});report.textContent=JSON.stringify({checks:results.length,passed:results.filter(r=>r.passed).length,failures:results.filter(r=>!r.passed)},null,2);};
async function load(tenant,route){f?.remove();f=document.createElement('iframe');f.src='admin-content.html?qa=1&tenant='+tenant+'&route='+route;document.querySelector('#stage').append(f);await wait(()=>f.contentDocument?.body?.dataset.contentReady);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));return f.contentDocument;}
const click=(d,label,scope=d)=>{const b=[...scope.querySelectorAll('button')].find(e=>e.textContent.replace(/\s/g,'')===label.replace(/\s/g,''));if(!b)throw Error('未找到 '+label);b.click();};
document.querySelector('#run').onclick=async()=>{results.length=0;report.dataset.complete='false';try{
 let d=await load('yestar-sz','wechatStatus'),w=f.contentWindow;
 check('正文使用原网页字体栈',w.getComputedStyle(d.body).fontFamily===w.AdminLiveUI.fontFamily);
 check('表格文字 14px',w.getComputedStyle(d.querySelector('td')).fontSize==='14px');
 check('主按钮颜色 #00C4AF',w.getComputedStyle(d.querySelector('.filter-actions .primary')).backgroundColor==='rgb(0, 196, 175)');
 check('输入框 32px',Math.abs(d.querySelector('[data-filter="人设名称"]').getBoundingClientRect().height-32)<1);
 const cols=w.AdminLiveUI.profiles.wechatStatus.tables[0].columns;check('账号所有列宽与来源一致',[...d.querySelectorAll('th')].every((th,i)=>Math.abs(th.getBoundingClientRect().width-cols[i].width)<=1));
 check('来源无排序的列没有伪排序入口',!d.querySelector('th[aria-sort]'));
 check('表格和分页都在视口内',d.querySelector('.pager').getBoundingClientRect().bottom<=w.innerHeight+1);
 check('操作按钮完整直接展示',d.querySelector('tbody tr .actions-cell').querySelectorAll('button').length===7&&!d.querySelector('tbody tr .actions-cell').textContent.includes('更多'));
 check('接待人使用标签并有可点入口',d.querySelectorAll('tbody tr:first-child .reception-cell .status').length===3&&!!d.querySelector('.reception-more'));
 click(d,'编辑');await new Promise(r=>requestAnimationFrame(r));
 check('账号弹窗宽 600px',Math.abs(d.querySelector('dialog').getBoundingClientRect().width-600)<1);
 check('账号代理保留不可切换规则',d.querySelectorAll('.proxy-control input[type=radio]:disabled').length===2);
 const device=d.querySelector('[data-field="登录设备"]').closest('.live-select'),trigger=device.querySelector('[role=combobox]');trigger.click();check('单选下拉点击展开',trigger.getAttribute('aria-expanded')==='true'&&device.querySelector('.live-popover').matches(':popover-open'));[...device.querySelectorAll('.live-option')].find(b=>b.textContent==='ipad').click();check('单选选择回填且收起',trigger.getAttribute('aria-expanded')==='false'&&d.querySelector('[data-field="登录设备"]').value==='ipad');
 click(d,'取消');check('取消不修改记录',w.Admin.getTable().rows[0].cells[w.Admin.getTable().headers.indexOf('登录设备')]==='mac');
 d=await load('yestar-sz','salesManage');w=f.contentWindow;click(d,'编辑');await new Promise(r=>requestAnimationFrame(r));check('销售弹窗 800px 双列',Math.abs(d.querySelector('dialog').getBoundingClientRect().width-800)<1&&w.getComputedStyle(d.querySelector('.form-grid')).gridTemplateColumns.split(' ').length===2);
 const multi=d.querySelector('[data-field="可聊天账号"]');await wait(()=>multi.querySelector('[role=combobox]'));const mt=multi.querySelector('[role=combobox]');check('多选默认折叠',mt.getAttribute('aria-expanded')==='false'&&!multi.querySelector('.live-popover').matches(':popover-open'));mt.click();const pop=multi.querySelector('.live-popover');check('多选弹层不越视口',pop.getBoundingClientRect().left>=0&&pop.getBoundingClientRect().right<=w.innerWidth&&pop.getBoundingClientRect().bottom<=w.innerHeight);check('保留真实不可用账号',multi.querySelectorAll('input[type=checkbox]:disabled').length===17);const disabled=multi.querySelector('input:disabled');const old=disabled.checked;disabled.click();check('禁用账号不能被选择',disabled.checked===old);mt.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check('Esc 仅关闭下拉，保留表单',!pop.matches(':popover-open')&&d.querySelector('dialog').open);check('数值上限包含加减步进器',d.querySelectorAll('.number-control').length===2);
 d=await load('yestar-sz','asrLexicon');click(d,'编辑');check('纠错方式使用原生单选组',d.querySelector('[data-field="纠错方式"]').querySelectorAll('input[type=radio]').length===2);
 d=await load('yestar-hz','caseLibraryEntries');click(d,'编辑');check('案例编辑是完整页面',!!d.querySelector('.case-page-editor')&&!d.querySelector('dialog').open);check('案例复用来源图片与编辑器图标',d.querySelectorAll('.source-media-card img').length===2&&d.querySelectorAll('.rich-toolbar svg').length>=10);check('案例图片卡片与源页面宽高一致',Math.abs(d.querySelector('.source-media-card').getBoundingClientRect().width-180)<1&&Math.abs(d.querySelector('.source-media-card img').getBoundingClientRect().height-120)<1);check('案例上传使用按钮，排序有步进器',!!d.querySelector('.source-media-list>button')&&d.querySelector('.source-media-list>input').hidden&&d.querySelectorAll('.number-control button').length===2);for(const [key,count]of [['fontSize',13],['fontFamily',14],['lineHeight',7]]){d.querySelector('[data-tool="'+key+'"]').click();check('富文本 '+key+' 实际选项和下拉形态',d.querySelector('.rich-options:popover-open')?.querySelectorAll('button').length===count&&!d.querySelector('dialog').open);d.querySelector('.rich-options button').click();}const first=d.querySelector('.source-media-card');click(d,'设为首图',first);check('设置首图仅有一个首图',d.querySelectorAll('.source-media-card .source-cover-mark').length===1&&d.querySelector('.source-media-card').textContent.includes('首图'));click(d,'返回案例列表');check('案例返回保留列表',d.querySelectorAll('tbody tr').length>0);
 d=await load('bzds','expertList');click(d,'编辑');check('专家编辑是完整页面',!!d.querySelector('.expert-page-editor')&&!d.querySelector('dialog').open);check('排班含 7 天与 32 个半小时时段',d.querySelectorAll('.schedule-days button').length===7&&d.querySelectorAll('.schedule-slots-grid button').length===32);d.querySelector('.schedule-slots-grid button').click();check('排班状态切换',d.querySelector('.schedule-slots-grid button').getAttribute('aria-pressed')==='true');d.querySelectorAll('.schedule-days button')[1].click();check('星期之间独立',d.querySelector('.schedule-slots-grid button').getAttribute('aria-pressed')==='false');
 d=await load('bzds','versionList');click(d,'编辑');await new Promise(r=>requestAnimationFrame(r));check('版本号在编辑时只读',d.querySelector('[data-field="版本号"]').disabled);check('版本平台8项、状态3项',d.querySelector('[aria-label="平台1类型"]').options.length===8&&d.querySelector('[aria-label="平台1状态"]').options.length===3);const count=d.querySelectorAll('.version-platform').length;click(d,'添加平台');check('添加平台保留原配置',d.querySelectorAll('.version-platform').length===count+1);d.querySelector('[aria-label="移除平台'+(count+1)+'"]').click();check('移除平台保持其他配置',d.querySelectorAll('.version-platform').length===count);d.querySelector('[data-field="更新说明"]').value='QA-版本说明保存验证';click(d,'确认提交');d=await load('bzds','versionList');click(d,'编辑');check('版本说明与平台配置刷新可读回',d.querySelector('[data-field="更新说明"]').value==='QA-版本说明保存验证'&&d.querySelectorAll('.version-platform').length===count);
 }catch(e){check('执行无异常',false,e.stack);}finally{for(const k of Object.keys(localStorage).filter(k=>k.startsWith('admin-qa:v1:')))localStorage.removeItem(k);report.dataset.complete='true';report.dataset.results=JSON.stringify(results);}};
</script>
