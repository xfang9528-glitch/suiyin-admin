<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页面对照状态</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px Arial,'Microsoft YaHei',sans-serif;color:#606266;background:white}.page-title{padding:16px 18px;border-bottom:1px solid #ebeef5;color:#303133;font-size:16px}.state{min-height:430px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:36px 20px}.symbol{width:66px;height:66px;border-radius:50%;background:#eaf8f6;color:#24afa4;display:grid;place-items:center;margin-bottom:16px}.symbol svg{width:30px;height:30px}h1{font-size:20px;font-weight:500;margin:10px 0;color:#515a65}p{max-width:440px;line-height:1.8;margin:6px 0;color:#909399}.context{font-size:13px;color:#606266}.date{font-size:12px;margin-top:22px}@media(max-width:500px){.state{min-height:360px;padding:28px 16px}h1{font-size:18px}}</style></head><body data-reference-state="not-captured"><header class="page-title" id="title"></header><main class="state"><div class="symbol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 3h10l3 3v15H4V3zM8 9h8M8 13h8M8 17h5"/></svg></div><p class="context" id="context"></p><h1 id="status">本页尚未完成对照</h1><p id="explain">已按当前企业的真实菜单保留入口。页面内容及数据快照将在后续对照中补齐。</p><p class="date" id="date"></p></main><script>'use strict';const p=new URLSearchParams(location.search);document.getElementById('title').textContent=p.get('pageName')||'页面对照';document.getElementById('context').textContent=p.get('tenantName')||'';const states={partial:['本页仍在对照中','部分内容已采集，尚未完成核对。'],empty:['当前筛选下暂无数据','仅表示已采集筛选快照中没有记录。'],unavailable:['页面暂不可用','该入口的页面当前无法打开。'],'permission-denied':['当前账号无法查看此页面','已明确核实访问权限限制。'],'load-error':['页面读取失败','请关闭此页签后重试。']};const state=p.get('status')||'not-captured';if(states[state]){document.getElementById('status').textContent=states[state][0];document.getElementById('explain').textContent=states[state][1];document.body.dataset.referenceState=state;}const date=p.get('capturedAt');if(date&&!isNaN(Date.parse(date)))document.getElementById('date').textContent='导航核对于 '+new Date(date).toLocaleDateString('zh-CN');</script></body></html>
