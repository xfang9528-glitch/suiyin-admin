<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>数据与展开交互验收</title><style>body{font:14px system-ui;padding:24px}button{padding:10px}pre{white-space:pre-wrap}iframe{width:1250px;height:850px;border:1px solid #ddd}</style><h1>数据与展开交互验收</h1><p>独立 QA 存储；检查默认样本、查询结果、下拉选项与展开流程。</p><button id="all">检查全部租户页面</button><button id="flows">检查展开交互</button><p id="status">待运行</p><pre id="report"></pre><div id="stage"></div><script>
const results=[];const stage=document.querySelector('#stage'),status=document.querySelector('#status'),report=document.querySelector('#report');let running=false;
const wait=fn=>new Promise((res,rej)=>{const start=Date.now(),id=setInterval(()=>{if(fn()){clearInterval(id);res();}else if(Date.now()-start>18000){clearInterval(id);rej(Error('页面超时'));}},30);});
function record(name,ok,details){results.push({name,passed:!!ok,details});report.textContent=JSON.stringify({checks:results.length,passed:results.filter(x=>x.passed).length,failures:results.filter(x=>!x.passed)},null,2);}
async function load(tenant,route){const f=document.createElement('iframe');f.src=`admin-content.html?qa=1&tenant=${tenant}&route=${route}`;stage.append(f);await wait(()=>f.contentDocument?.body?.dataset.contentReady);return f;}
const click=(d,text,scope=d)=>{const b=[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text);if(!b)throw Error('按钮不存在：'+text);b.click();};
function finish(){running=false;status.textContent='检查完成';report.dataset.complete='true';report.dataset.results=JSON.stringify(results);}
document.querySelector('#all').onclick=async()=>{if(running)return;running=true;results.length=0;report.dataset.complete='false';const nav=await fetch('data/navigation-snapshot.json').then(r=>r.json());const jobs=nav.tenants.flatMap(t=>t.menu.flatMap(g=>g.children||[g]).map(p=>({tenant:t.id,route:p.route})));const total=jobs.length;let done=0;async function worker(){while(jobs.length){const job=jobs.shift();let f;try{f=await load(job.tenant,job.route);const d=f.contentDocument,A=f.contentWindow.Admin;const errors=[];if(d.body.dataset.contentReady!=='true')errors.push('页面未就绪');const source=A.source;if(source.tables.length&&job.route!=='setting'){if(!d.querySelectorAll('tbody tr').length)errors.push('默认列表为空');if(source.tables.some(t=>!t.rows.length))errors.push('原始样本有空表');const q=[...d.querySelectorAll('button')].find(b=>b.textContent==='查询');q?.click();if(!d.querySelectorAll('tbody tr').length)errors.push('默认条件查询后为空');}if(['allChat','salesReceptionQuery'].includes(job.route)&&!d.querySelectorAll('.contact').length)errors.push('默认会话为空');const emptySelect=[...d.querySelectorAll('select')].filter(s=>s.options.length<2).map(s=>s.closest('label')?.textContent);if(emptySelect.length)errors.push('空选项:'+emptySelect.join('/'));record(job.tenant+'/'+job.route,!errors.length,errors);}catch(e){record(job.tenant+'/'+job.route,false,String(e));}finally{f?.remove();done++;status.textContent=done+' / '+total;}}}await Promise.all([worker(),worker(),worker()]);finish();};
document.querySelector('#flows').onclick=async()=>{if(running)return;running=true;results.length=0;report.dataset.complete='false';let f;try{
 f=await load('yestar-sz','salesManage');let d=f.contentDocument;click(d,'编辑');record('销售角色为真实多选',d.querySelector('[data-field="权限角色"] .multi-options')?.querySelectorAll('input').length===9);record('可聊天账号 307 项（不含分组标题）',d.querySelector('[data-field="可聊天账号"] .multi-options')?.querySelectorAll('input').length>=307);const search=d.querySelector('[aria-label="搜索可聊天账号选项"]');search.value='佳佳';search.dispatchEvent(new Event('input',{bubbles:true}));record('多选搜索缩小列表',[...d.querySelectorAll('[data-field="可聊天账号"] .multi-options label')].some(l=>l.hidden));f.remove();
 f=await load('yestar-sz','asrLexicon');d=f.contentDocument;click(d,'编辑');record('实际纠错方式',d.querySelector('[data-field="纠错方式"]').textContent.includes('结合语境'));record('实际大类六项',d.querySelector('[data-field="大类"] .multi-options')?.querySelectorAll('input').length===6);f.remove();
 f=await load('yestar-sz','massMessageListYx');d=f.contentDocument;click(d,'创建群发');record('群发完整创建页',!!d.querySelector('.mass-page')&&!d.querySelector('dialog').open);d.querySelector('[aria-label="群发名称"]').value='QA-完整群发';d.querySelector('[aria-label="群发名称"]').dispatchEvent(new Event('input',{bubbles:true}));const ta=d.querySelector('textarea');ta.value='您好，欢迎了解我们的服务。';ta.dispatchEvent(new Event('input',{bubbles:true}));click(d,'客户昵称');record('客户昵称插入消息',ta.value.includes('{客户昵称}'));click(d,'选择表情');click(d,'😊');record('表情插入消息',ta.value.includes('😊'));click(d,'选择标签');record('标签选择器有真实样本',d.querySelectorAll('.picker-row').length>0);d.querySelector('.picker-row input').click();click(d,'确认选择');record('标签选择回填',d.querySelector('.mass-page').textContent.includes('已选 1 个标签'));const type=d.querySelector('[aria-label="版本1消息1类型"]');record('六类消息选项',type.options.length===6);click(d,'添加消息');const type2=d.querySelector('[aria-label="版本1消息2类型"]');type2.value='商品';type2.dispatchEvent(new Event('change',{bubbles:true}));click(d,'选择商品');d.querySelector('.picker-row input').click();click(d,'确认选择');record('商品选择回填',d.querySelectorAll('.message-editor')[1].textContent.includes('¥'));const sendMode=[...d.querySelectorAll('select')].find(s=>[...s.options].some(o=>o.value==='定时发送'));sendMode.value='定时发送';sendMode.dispatchEvent(new Event('change',{bubbles:true}));record('定时发送展开时间',!d.querySelector('[aria-label="设定发布时间"]').closest('label').hidden);sendMode.value='立即发送';sendMode.dispatchEvent(new Event('change',{bubbles:true}));click(d,'预览并创建');record('群发预览含正文与商品',d.querySelector('dialog').open&&d.querySelector('dialog').textContent.includes('商品'));click(d,'返回修改');record('返回修改保留文本',d.querySelector('textarea').value.includes('欢迎'));click(d,'预览并创建');click(d,'确认演示');record('群发创建后列表可见',d.querySelector('tbody').textContent.includes('QA-完整群发'));f.remove();
 f=await load('yestar-sz','salesStatsNew');d=f.contentDocument;record('销售统计四个有数据的图表',d.querySelectorAll('.dashboard-charts .card').length===4&&d.querySelectorAll('.rank-row').length>=4);f.remove();
 f=await load('yestar-sz','aiAssistStats');d=f.contentDocument;record('深圳AI统计默认有数据',d.querySelectorAll('tbody tr').length>0);const mode=[...d.querySelectorAll('select')].find(s=>s.options.length===2&&s.options[1].value==='按部门');mode.value='按部门';mode.dispatchEvent(new Event('change',{bubbles:true}));record('部门汇总仍有数据',d.querySelectorAll('tbody tr').length>0);f.remove();
 f=await load('yestar-sz','products');d=f.contentDocument;click(d,'预览');record('商品专门预览界面',!!d.querySelector('.product-preview')&&d.querySelector('.product-preview').textContent.includes('49.8'));f.remove();
 }catch(e){record('交互执行',false,e.stack);}finally{f?.remove();for(const k of Object.keys(localStorage).filter(k=>k.startsWith('admin-qa:v1:')))localStorage.removeItem(k);finish();}};
</script></html>
