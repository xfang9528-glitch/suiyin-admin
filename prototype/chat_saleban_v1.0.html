<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>销售词控</title><link rel="stylesheet" href="_admin_list.css">
<script src="_edit_modal.js" defer></script></head>
<body>

<div class="filter-bar">
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="敏感词关键词"></div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <div class="f-spacer"></div>
  <button class="btn primary" onclick="onCreate()">＋ 创建</button>
  <button class="btn" onclick="toast('监控日志')">📋 监控日志</button>
</div>

<div class="table-wrap">
  <div class="table-card">
    <table>
      <thead><tr>
        <th>敏感词</th><th>监控方式</th><th>启用</th><th>备注信息</th><th>创建时间</th>
        <th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info">共 63 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button>
  <button class="pager-btn cur">1</button><button class="pager-btn">2</button><button class="pager-btn">3</button>
  <button class="pager-btn">4</button>
  <button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { word:'微信号',     way:'禁止发送', enabled:true,  note:'防止销售流失客户到私人微信',     createdAt:'2026-03-12 09:00:18' },
  { word:'手机号',     way:'记录告警', enabled:true,  note:'识别销售可能转私域',             createdAt:'2026-03-12 09:01:30' },
  { word:'转账',       way:'记录告警', enabled:true,  note:'识别可能绕开公司收款',           createdAt:'2026-03-12 09:02:11' },
  { word:'红包',       way:'记录告警', enabled:true,  note:'可能涉及私下交易',               createdAt:'2026-03-12 09:03:00' },
  { word:'加我个人',   way:'禁止发送', enabled:true,  note:'强制加私人微信流失客户',         createdAt:'2026-04-08 14:50:00' },
  { word:'回扣',       way:'记录告警', enabled:false, note:'暂时停用观察',                   createdAt:'2026-04-15 10:11:00' },
  { word:'院长开后门', way:'禁止发送', enabled:true,  note:'承诺特殊待遇',                   createdAt:'2026-04-22 16:30:00' },
  { word:'保证治愈',   way:'禁止发送', enabled:true,  note:'医美绝不能承诺治愈/包好',         createdAt:'2026-04-22 16:32:11' },
];
function render() {
  const kw = document.getElementById('kw').value.trim();
  const list = ROWS.filter(r => !kw || r.word.includes(kw));
  document.getElementById('tbody').innerHTML = list.map(r => `
    <tr>
      <td><strong style="color:#f56c6c;">${r.word}</strong></td>
      <td><span class="tag ${r.way === '禁止发送' ? 'blue' : ''}">${r.way}</span></td>
      <td><label class="switch"><input type="checkbox" ${r.enabled ? 'checked' : ''}><span class="switch-slider"></span></label></td>
      <td><span style="color:var(--text-3)">${r.note}</span></td>
      <td class="col-time">${r.createdAt}</td>
      <td class="col-actions">
        <button class="row-action" onclick="onEdit('${r.word.replace(/'/g, "\\'")}')">编辑</button>
        <button class="row-action danger" onclick="if(confirm('确认删除「${r.word}」？'))toast('已删除')">删除</button>
      </td>
    </tr>
  `).join('');
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
function buildBanModal(title, onSubmit) {
  return createEditModal({
    title,
    fields: [
      { label:'敏感词',     key:'word',    type:'text',     placeholder:'例：微信号 / 转账', required:true },
      { label:'监控方式',   key:'way',     type:'radio',    options:['禁止发送','记录告警'] },
      { label:'启用',       key:'enabled', type:'switch' },
      { label:'备注',       key:'note',    type:'textarea', placeholder:'告警原因或场景说明' },
    ],
    onSubmit
  });
}
function onCreate() {
  const m = buildBanModal('创建敏感词', d => { ROWS.unshift({ ...d, createdAt:new Date().toISOString().replace('T',' ').slice(0,19) }); render(); toast('已新增'); });
  m.open({ way:'禁止发送', enabled:true });
}
function onEdit(word) {
  const r = ROWS.find(x => x.word === word);
  const m = buildBanModal('编辑敏感词', d => { Object.assign(r, d); render(); toast('已保存'); });
  m.open(r);
}
render();
</script></body></html>
