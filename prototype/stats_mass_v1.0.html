<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>群发统计</title><link rel="stylesheet" href="_admin_list.css"></head>
<body>

<div class="filter-bar">
  <div class="f-group">
    <input class="f-input date" type="date" placeholder="开始日期">
    <span class="f-sep">至</span>
    <input class="f-input date" type="date" placeholder="结束日期">
  </div>
  <div class="f-group">
    <select class="f-select" id="src"><option value="">来源</option><option>留存群发</option><option>手动创建</option></select>
  </div>
  <div class="f-group">
    <select class="f-select" id="task"><option value="">任务名称</option><option>5月医美节</option><option>留存群发</option></select>
  </div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <div class="f-spacer"></div>
  <button class="btn" onclick="toast('导出')">📤 导出</button>
</div>

<div class="table-wrap">
  <div class="table-card scroll" style="min-width:1280px;">
    <table>
      <thead><tr>
        <th>任务名称</th><th>来源</th><th>群发日期</th><th>群发内容</th>
        <th>群发数量</th><th>回复人数</th><th>回复率</th><th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info">共 1,287 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button>
  <button class="pager-btn cur">1</button><button class="pager-btn">2</button><button class="pager-btn">3</button>
  <span class="pager-ellipsis">…</span><button class="pager-btn">65</button>
  <button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { name:'吴雨贵 109',  src:'手动',     date:'2026-05-06', preview:'5 月医美节 满 8000 减 1500 …', sent:10423, replied:1186, rate:0.114 },
  { name:'尹巧珠 038',  src:'手动',     date:'2026-05-06', preview:'热玛吉 5 代体验 限时…',     sent:10447, replied:980,  rate:0.094 },
  { name:'姚通 172',    src:'手动',     date:'2026-05-06', preview:'谢斐院长玻尿酸丰唇案例…',   sent:8195,  replied:780,  rate:0.095 },
  { name:'黎容',         src:'手动',     date:'2026-05-06', preview:'高顺波院长鼻修复手术全过程…',sent:11951, replied:856,  rate:0.072 },
  { name:'留存群发：自媒体杨博文 04', src:'留存群发', date:'2026-05-03', preview:'好久不见，最近有什么…', sent:84,    replied:18,   rate:0.214 },
  { name:'留存群发：自媒体林一 10',  src:'留存群发', date:'2026-05-03', preview:'好久不见，最近有什么…', sent:89,    replied:22,   rate:0.247 },
  { name:'留存群发：自媒体杨博文 01', src:'留存群发', date:'2026-05-03', preview:'好久不见，最近有什么…', sent:143,   replied:28,   rate:0.196 },
];
function rateColor(r) { return r >= 0.2 ? 'success' : (r >= 0.1 ? '' : 'fail'); }
function render() {
  const src = document.getElementById('src').value;
  const list = ROWS.filter(r => !src || r.src === src);
  document.getElementById('tbody').innerHTML = list.map(r => `
    <tr>
      <td>${r.name}</td>
      <td>${r.src === '留存群发' ? '<span class="tag blue">留存群发</span>' : '<span class="tag">手动</span>'}</td>
      <td class="col-time">${r.date}</td>
      <td><span style="display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);">${r.preview}</span></td>
      <td class="col-num">${r.sent.toLocaleString('zh-CN')}</td>
      <td class="col-num success">${r.replied}</td>
      <td class="col-num ${rateColor(r.rate)}">${(r.rate*100).toFixed(1)}%</td>
      <td class="col-actions"><button class="row-action" onclick="toast('查看回复')">查看回复</button></td>
    </tr>
  `).join('');
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
render();
</script></body></html>
