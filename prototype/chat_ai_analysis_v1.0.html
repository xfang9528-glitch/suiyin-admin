<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能分析</title>
<link rel="stylesheet" href="_admin_list.css">
<style>
  /* ========= 智能分析占位页 v1.0 ========= */
  .content-wrap {
    position: fixed;
    top: var(--filter-h);
    left: 0; right: 0; bottom: 0;
    overflow: auto;
    padding: 12px 16px 24px;
  }

  /* 日期快捷切换 */
  .date-quick {
    display: inline-flex; gap: 0;
    border: 1px solid #e5e8ec; border-radius: 3px;
    overflow: hidden;
  }
  .date-quick button {
    padding: 0 12px; height: 30px;
    font-size: 12.5px; color: var(--text-2);
    background: #fff; border-right: 1px solid #e5e8ec;
    cursor: pointer;
  }
  .date-quick button:last-child { border-right: none; }
  .date-quick button:hover { background: #f5fbf7; color: var(--wx-green); }
  .date-quick button.cur {
    background: var(--wx-green); color: #fff;
  }

  /* 模块标题 */
  .section-title {
    font-size: 14px; font-weight: 600;
    color: var(--text-1);
    padding: 8px 4px 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .hint {
    font-size: 12px; font-weight: 400;
    color: var(--text-3);
  }

  /* 卡片网格 */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }
  .stat-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
  }
  .stat-card .label {
    font-size: 12.5px; color: var(--text-2);
    margin-bottom: 8px;
  }
  .stat-card .value {
    font-size: 24px; font-weight: 600;
    color: var(--text-1);
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-card .value .unit {
    font-size: 12px; font-weight: 400;
    color: var(--text-3); margin-left: 4px;
  }
  .stat-card .sub {
    font-size: 11.5px; color: var(--text-3);
    margin-top: 6px;
  }
  .stat-card.accent .value { color: var(--wx-green); }
  .stat-card.warn .value   { color: #d99a3d; }
  .stat-card.info .value   { color: #576b95; }

  /* 需求 Top 列表 */
  .demand-row {
    display: flex; align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid #f0f2f5;
    font-size: 13px;
  }
  .demand-row:last-child { border-bottom: none; }
  .demand-row .rank {
    width: 22px; height: 22px; border-radius: 4px;
    background: #f5f7fa; color: var(--text-2);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    margin-right: 10px;
  }
  .demand-row.top1 .rank { background: var(--wx-green); color: #fff; }
  .demand-row.top2 .rank { background: #ffd591; color: #8a5a00; }
  .demand-row.top3 .rank { background: #f5e0c2; color: #8a5a00; }
  .demand-row .name { flex: 1; color: var(--text-1); }
  .demand-row .count {
    color: var(--text-2); font-variant-numeric: tabular-nums;
    margin-right: 12px;
  }
  .demand-row .bar {
    flex: 1 1 auto; min-width: 60px; height: 6px;
    background: #f0f2f5; border-radius: 3px; overflow: hidden;
    margin-right: 12px;
  }
  .demand-row .bar > i {
    display: block; height: 100%;
    background: var(--wx-green);
    border-radius: 3px;
  }
  .demand-row .pct {
    width: 50px; text-align: right;
    color: var(--text-3); font-size: 12px;
  }

  /* 多列网格 */
  .three-col {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }
  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .panel-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px; font-weight: 600;
    color: var(--text-1);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-body { padding: 4px 0; }

  /* 固定高度卡片 + 内部滚动 */
  .scroll-body {
    height: 440px;
    overflow-y: auto;
  }

  /* 每行的「明细 ›」链接 */
  .row-detail {
    color: #576b95; font-size: 12px;
    cursor: pointer;
    margin-left: 10px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .row-detail:hover { text-decoration: underline; }

  /* 明细 modal（只读，无 footer，遵循 2026-05-07 约定） */
  .detail-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 9000;
    display: none;
    align-items: center; justify-content: center;
  }
  .detail-mask.show { display: flex; }
  .detail-modal {
    width: 960px; max-width: 94vw;
    max-height: 82vh;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .detail-modal .head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; color: var(--text-1);
  }
  .detail-modal .head .close {
    width: 24px; height: 24px;
    border: none; background: transparent;
    color: var(--text-3); font-size: 18px;
    cursor: pointer; line-height: 1;
  }
  .detail-modal .head .close:hover { color: var(--text-1); }
  .detail-modal .body {
    flex: 1; overflow: auto; padding: 0;
  }

  /* 客户明细表 */
  .friend-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .friend-table thead th {
    position: sticky; top: 0;
    background: #fafbfc;
    padding: 10px 12px;
    font-weight: 500;
    font-size: 12.5px;
    color: var(--text-2);
    border-bottom: 1px solid var(--border);
    text-align: left;
    white-space: nowrap;
    z-index: 1;
  }
  .friend-table tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid #f0f2f5;
    color: var(--text-1);
    white-space: nowrap;
  }
  .friend-table tbody tr:hover td { background: #f7fcf9; }
  .friend-table tbody tr:last-child td { border-bottom: none; }
  .friend-table .col-persona { color: var(--wx-green); font-weight: 500; }
  .friend-table .col-friend { font-weight: 500; }

  .detail-modal .empty-hint {
    padding: 40px 18px; text-align: center;
    color: var(--text-3); font-size: 13px;
  }

  /* 客户等级条 */
  .level-row {
    display: flex; align-items: center;
    padding: 10px 16px;
    font-size: 13px;
  }
  .level-row .dot {
    width: 8px; height: 8px; border-radius: 50%;
    margin-right: 8px; flex-shrink: 0;
  }
  .level-row .name { flex: 1; }
  .level-row .num {
    font-variant-numeric: tabular-nums;
    color: var(--text-2); margin-right: 12px;
  }
  .level-row .bar {
    flex: 1 1 auto; min-width: 60px; height: 6px;
    background: #f0f2f5; border-radius: 3px; overflow: hidden;
    margin-right: 12px;
  }
  .level-row .bar > i { display: block; height: 100%; border-radius: 3px; }
  .level-row .pct { width: 50px; text-align: right; color: var(--text-3); font-size: 12px; }


</style>
</head>
<body>

<!-- 顶部筛选栏 -->
<div class="filter-bar">
  <div class="f-group">
    <span class="f-label">时间：</span>
    <div class="date-quick" id="dateQuick">

      <button data-q="month">近30天</button>
    </div>
  </div>
  <div class="f-group">
    <input class="f-input date" type="date" id="dateFrom">
    <span class="f-sep">至</span>
    <input class="f-input date" type="date" id="dateTo">
  </div>
  <div class="f-group">
    <span class="f-label">部门：</span>

      <option>抖音IP</option>

</div>

<!-- 主内容 -->

    <div class="panel">

    <div class="panel">

  </div>


</div>

<!-- 明细 modal -->
<div class="detail-mask" id="detailMask">
  <div class="detail-modal">
    <div class="head">
      <span id="detailTitle">详细分布</span>
      <button class="close" onclick="closeDetail()">×</button>
    </div>

  </div>
</div>

      og.label = dept;
      byDept[dept].forEach(a => {

        op.value = a.name;
        op.textContent = a.name;
        og.appendChild(op);

      sel.appendChild(og);

  function fmt(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function setRange(q) {
    const today = new Date('2026-05-11');
    let from = new Date(today), to = new Date(today);
    if (q === 'yesterday') { from.setDate(today.getDate() - 1); to.setDate(today.getDate() - 1); }
    else if (q === 'dby')  { from.setDate(today.getDate() - 2); to.setDate(today.getDate() - 2); }
    else if (q === 'week') { from.setDate(today.getDate() - 6); }
    else if (q === 'month'){ from.setDate(today.getDate() - 29); }
    fromInput.value = fmt(from);
    toInput.value   = fmt(to);
  }
  quickBtns.forEach(b => {
    b.addEventListener('click', () => {
      quickBtns.forEach(x => x.classList.remove('cur'));
      b.classList.add('cur');
      setRange(b.dataset.q);
    });
  });

  function renderPanel(key) {
    const p = PANELS[key];
    const body = document.getElementById(p.containerId);
    if (p.kind === 'level') {
      body.innerHTML = p.items.map(it => `
        <div class="level-row">
          <span class="dot" style="background:${it.color}"></span>
          <span class="name">${esc(it.name)}</span>
          <span class="num">${it.count}</span>
          <span class="bar"><i style="background:${it.color};width:${it.bar}%"></i></span>
          <span class="pct">${it.pct}</span>
          <span class="row-detail" data-panel="${key}" data-value="${esc(it.name)}">明细 ›</span>
        </div>
      `).join('');
    } else {
      body.innerHTML = p.items.map((it, i) => `
        <div class="demand-row ${rankClass(i)}">

          <span class="name">${esc(it.name)}</span>
          <span class="count">${it.count}</span>
          <span class="bar"><i style="width:${it.bar}%"></i></span>

    '吴梦琪', '黄若汐', '赵子涵', '徐一诺', '孙可欣', '马语桐', '朱沐宸', '胡雅婷',
    '郭佳怡', '何美琳', '高晓雯', '林慧敏', '冯思琪', '宋若兰', '韩梦琪', '苏若汐',
    '范子涵', '杜一诺', '丁可欣', '邓语桐', '沈沐宸', '田雅婷'
  ];

  // 用 (panel + value) hash 做确定性切片，保证每次打开同一项看到的列表一致
  function hashCode(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h * 16777619) >>> 0;
    }
    return h;
  }

  // 7 个潜在列；展示时把当前 panel 对应的列隐去（标题里已经体现）
  const ALL_COLS = [
    { key: 'friend',    label: '好友昵称', cls: 'col-friend' },
    { key: 'persona',   label: '人设号',   cls: 'col-persona' },
    { key: 'primary',   label: '第一需求' },
    { key: 'secondary', label: '第二需求' },
    { key: 'level',     label: '等级' },
    { key: 'medical',   label: '医美史' },
    { key: 'region',    label: '地区' },
  ];

  // 给定 (panel, value)，生成 count 条好友记录（每条带全部 5 维标签 + 人设号 + 昵称）
  function genTaggedFriends(panel, value, count) {
    const seed = hashCode(panel + ':' + value);
    const list = [];
    for (let i = 0; i < count; i++) {
      const pick = (offset, arr) => arr[(seed + i * offset) >>> 0 % 0x7fffffff % arr.length];
      const row = {
        friend:    FRIEND_POOL[((seed + i * 11) >>> 0) % FRIEND_POOL.length],
        persona:   PERSONA_POOL[((seed + i * 7) >>> 0) % PERSONA_POOL.length],
        primary:   PANELS.primary.items[((seed + i * 13) >>> 0) % PANELS.primary.items.length].name,
        secondary: PANELS.secondary.items[((seed + i * 17) >>> 0) % PANELS.secondary.items.length].name,
        level:     PANELS.level.items[((seed + i * 19) >>> 0) % PANELS.level.items.length].name,
        medical:   PANELS.medical.items[((seed + i * 23) >>> 0) % PANELS.medical.items.length].name,
        region:    PANELS.region.items[((seed + i * 29) >>> 0) % PANELS.region.items.length].name,
      };
      // 锁定被点击的那个维度 = 当前值
      row[panel] = value;
      list.push(row);
    }
    return list;
  }

  function openFriendDetail(panel, value) {
    const p = PANELS[panel];
    const item = p.items.find(it => it.name === value);
    if (!item) return;
    const friends = genTaggedFriends(panel, value, item.count);
    document.getElementById('detailTitle').textContent =
      `${p.label} · ${value} · 客户明细（共 ${item.count} 人）`;
    const cols = ALL_COLS.filter(c => c.key !== panel);
    const body = document.getElementById('detailBody');
    if (!friends.length) {
      body.innerHTML = `<div class="empty-hint">暂无标记记录</div>`;
    } else {
      body.innerHTML = `
        <table class="friend-table">
          <thead><tr>${cols.map(c => `<th>${c.label}</th>`).join('')}</tr></thead>
          <tbody>
            ${friends.map(f => `<tr>${cols.map(c =>
              `<td class="${c.cls || ''}">${esc(f[c.key])}</td>`
            ).join('')}</tr>`).join('')}
          </tbody>
        </table>
      `;
    }
    document.getElementById('detailMask').classList.add('show');
    document.getElementById('detailBody').scrollTop = 0;
  }

  function closeDetail() {
    document.getElementById('detailMask').classList.remove('show');
  }

  // 事件委托：绑定所有 .row-detail 点击
  document.addEventListener('click', (e) => {
    const t = e.target.closest('.row-detail');
    if (t) openFriendDetail(t.dataset.panel, t.dataset.value);
  });

  // 点遮罩关闭
  document.getElementById('detailMask').addEventListener('click', (e) => {
    if (e.target.id === 'detailMask') closeDetail();
  });

  // Esc 关闭
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDetail();
  });
</script>
</body>
</html>
