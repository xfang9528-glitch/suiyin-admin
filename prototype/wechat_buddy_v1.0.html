<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>通友管理</title><link rel="stylesheet" href="_admin_list.css">
<style>
.page { padding: 20px; max-width: 880px; margin: 0 auto; }
.card { background: #fff; border-radius: 6px; border: 1px solid var(--border); padding: 24px; margin-bottom: 16px; }
.card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; border-left: 3px solid var(--wx-green); padding-left: 8px; }
.row-cfg { display: grid; grid-template-columns: 200px 1fr; align-items: center; padding: 10px 0; border-bottom: 1px dashed #f0f2f5; }
.row-cfg:last-child { border-bottom: none; }
.row-cfg .lbl { font-size: 13px; color: var(--text-2); }
.row-cfg .val { font-size: 13px; }
.row-cfg input[type=text], .row-cfg input[type=number] { width: 200px; padding: 6px 10px; border: 1px solid #d0d7de; border-radius: 4px; font-size: 13px; }
</style></head>
<body>

<div class="page" style="overflow-y:auto; height: 100vh;">

  <div class="card">
    <h3>自动通友（被加好友请求自动通过）配置</h3>
    <div class="row-cfg">
      <span class="lbl">总开关</span>
      <span class="val"><label class="switch"><input type="checkbox" checked><span class="switch-slider"></span></label> 开启后所有人设默认按规则自动通过好友请求</span>
    </div>
    <div class="row-cfg">
      <span class="lbl">允许通过的来源</span>
      <span class="val">
        <label><input type="checkbox" checked> 群聊邀请</label>
        &nbsp;&nbsp;<label><input type="checkbox" checked> 名片分享</label>
        &nbsp;&nbsp;<label><input type="checkbox" checked> 二维码扫描</label>
        &nbsp;&nbsp;<label><input type="checkbox"> 手机号搜索</label>
        &nbsp;&nbsp;<label><input type="checkbox"> 微信号搜索</label>
      </span>
    </div>
    <div class="row-cfg">
      <span class="lbl">验证消息关键词白名单</span>
      <span class="val"><input type="text" value="艺星 / 医美 / 面诊 / 项目"> 包含任一即自动通过</span>
    </div>
    <div class="row-cfg">
      <span class="lbl">每日单账号通过上限</span>
      <span class="val"><input type="number" value="50"> 个 (微信日加好友硬上限 50-80)</span>
    </div>
    <div class="row-cfg">
      <span class="lbl">通过后欢迎语</span>
      <span class="val"><input type="text" value="您好~ 我是艺星医美专家助理 💖" style="width:380px;"></span>
    </div>
    <div class="row-cfg">
      <span class="lbl">通过间隔（防风控）</span>
      <span class="val"><input type="number" value="180"> 秒 / 个，单账号</span>
    </div>
  </div>

  <div class="card">
    <h3>账号级覆盖（可单独关闭某些人设的自动通友）</h3>
    <table>
      <thead><tr><th>人设</th><th>归属销售</th><th>自动通友</th><th>今日已通过</th><th>今日剩余</th><th>操作</th></tr></thead>
      <tbody>
        <tr><td>A 成都艺星专家助理 KK</td><td>KK17775575920</td><td><label class="switch"><input type="checkbox" checked><span class="switch-slider"></span></label></td><td class="col-num success">28</td><td class="col-num">22</td><td><button class="row-action">查看通过日志</button></td></tr>
        <tr><td>成都艺星医生助理 chloe</td><td>chloe</td><td><label class="switch"><input type="checkbox" checked><span class="switch-slider"></span></label></td><td class="col-num success">35</td><td class="col-num">15</td><td><button class="row-action">查看通过日志</button></td></tr>
        <tr><td>艺星专家助理妍妍</td><td>妍妍</td><td><label class="switch"><input type="checkbox"><span class="switch-slider"></span></label></td><td class="col-num muted">0</td><td class="col-num muted">-</td><td><button class="row-action">查看通过日志</button></td></tr>
        <tr><td>YeStar 助理-铃铃</td><td>铃铃</td><td><label class="switch"><input type="checkbox" checked><span class="switch-slider"></span></label></td><td class="col-num success">48</td><td class="col-num fail">2</td><td><button class="row-action">查看通过日志</button></td></tr>
      </tbody>
    </table>
  </div>

  <div class="card" style="text-align:right;">
    <button class="btn">取消</button>
    <button class="btn primary">确 定</button>
  </div>
</div>

</body></html>
