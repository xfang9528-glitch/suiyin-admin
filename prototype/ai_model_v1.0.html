<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>AI-模型配置</title><link rel="stylesheet" href="_admin_list.css">
<script src="_edit_modal.js" defer></script></head>
<body>

<div class="filter-bar">
  <div class="f-group"><input class="f-input wide" id="kw" placeholder="模型名称"></div>
  <button class="btn primary" onclick="render()">🔍 查询</button>
  <div class="f-spacer"></div>
  <button class="btn primary" onclick="onCreate()">＋ 创建</button>
</div>

<div class="table-wrap">
  <div class="table-card scroll" style="min-width:1100px;">
    <table>
      <thead><tr>
        <th>来源</th><th>模型名称</th><th>供应商</th><th>接口地址</th><th>场景</th><th>是否启用</th>
        <th class="col-actions">操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="pager">
  <span class="pager-info">共 2 条</span>
  <select><option>20条/页</option></select>
  <button class="pager-btn">‹</button><button class="pager-btn cur">1</button><button class="pager-btn">›</button>
</div>

<div class="toast" id="toast"></div>
<script>
const ROWS = [
  { src:'OpenAI 官方',    name:'gpt-4o-mini',         vendor:'OpenAI',    endpoint:'https://api.openai.com/v1', scenes:['话术润色','意图识别','回访生成'], enabled:true },
  { src:'Anthropic 官方', name:'claude-3.5-sonnet',   vendor:'Anthropic', endpoint:'https://api.anthropic.com/v1', scenes:['流失预警'], enabled:true },
];
function render() {
  document.getElementById('tbody').innerHTML = ROWS.map(r => `
    <tr>
      <td><span class="tag">${r.src}</span></td>
      <td><strong>${r.name}</strong></td>
      <td>${r.vendor}</td>
      <td><code style="font-size:11.5px">${r.endpoint}</code></td>
      <td>${r.scenes.map(s => `<span class="tag blue">${s}</span>`).join(' ')}</td>
      <td><label class="switch"><input type="checkbox" ${r.enabled ? 'checked' : ''}><span class="switch-slider"></span></label></td>
      <td class="col-actions">
        <button class="row-action" onclick="onEdit('${r.name.replace(/'/g, "\\'")}')">编辑</button>
        <button class="row-action danger" onclick="if(confirm('确认删除模型「${r.name}」？'))toast('已删除')">删除</button>
      </td>
    </tr>
  `).join('');
}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
function buildModelModal(title, onSubmit) {
  return createEditModal({
    title, width: 600,
    fields: [
      { label:'来源',     key:'src',      type:'select', options:['OpenAI 官方','Anthropic 官方','OpenRouter','DeepSeek','智谱 AI','百度文心','通义千问','本地部署'] },
      { label:'模型名称', key:'name',     type:'text',   placeholder:'例：gpt-4o-mini', required:true },
      { label:'供应商',   key:'vendor',   type:'text' },
      { label:'接口地址', key:'endpoint', type:'text',   placeholder:'https://api.openai.com/v1' },
      { label:'API Key',  key:'apiKey',   type:'text',   placeholder:'sk-... (生产请用密钥管理)' },
      { label:'适用场景', key:'scenes',   type:'tags',   options:['话术润色','意图识别','回访生成','流失预警','PYQ 文案','案例推荐','词控分析'] },
      { label:'是否启用', key:'enabled',  type:'switch' },
    ],
    onSubmit
  });
}
function onCreate() {
  const m = buildModelModal('新增模型', d => { ROWS.unshift({ ...d, scenes: d.scenes || [] }); render(); toast('已创建'); });
  m.open({ enabled: true });
}
function onEdit(name) {
  const r = ROWS.find(x => x.name === name);
  const m = buildModelModal('编辑模型', d => { Object.assign(r, d); render(); toast('已保存'); });
  m.open(r);
}
render();
</script></body></html>
