<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>艺星医美-深圳 · 管理后台</title>
<style>
  /* ========= 基础 ========= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-size: 14px;
    color: #1a1a1a;
    background: #f5f7fa;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d0d7de; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #a8b3bf; }
  ::-webkit-scrollbar-track { background: transparent; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

  :root {
    --wx-green: #07c160;
    --wx-green-dark: #06ad56;
    --wx-green-light: #e8f6ee;
    --header-h: 56px;
    --tab-h: 40px;
    --sidebar-w: 208px;
  }

  /* ========= 顶部 Header（对齐真实管理页：左品牌 + 青绿色顶栏） ========= */
  .header {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: #09bfae;
    border-bottom: 1px solid #09bfae;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px 0 0; z-index: 100;
  }
  .header-left {
    width: var(--sidebar-w);
    height: var(--header-h);
    background: #fff;
    border-right: 1px solid #ebeef2;
    display: flex; align-items: center; gap: 10px; color: #1a1a1a;
    padding: 0 18px;
  }
  .header-logo {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #09bfae; color: #fff; font-size: 18px; line-height: 1;
  }
  .header-brand { font-size: 16px; font-weight: 600; color: #09a898; letter-spacing: 0.2px; }
  .header-env { display: none; }
  .header-left::after {
    content: '☰';
    position: fixed;
    left: calc(var(--sidebar-w) + 24px);
    top: 17px;
    color: #fff;
    font-size: 18px;
    font-weight: 600;
  }
  .header-right {
    display: flex; align-items: center; gap: 8px; color: #4a5564;
  }
  /* ===== 用户下拉菜单 + 内嵌企业切换 ===== */
  #userMenu {
    display: none; position: fixed;
    top: 52px; right: 16px;
    background: #fff; border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.14);
    min-width: 220px; overflow: hidden; z-index: 200;
  }
  .um-head { padding: 12px 16px 10px; border-bottom: 1px solid #f0f0f0; }
  .um-name { font-weight: 600; color: #1a1a1a; font-size: 14px; }
  .um-role { font-size: 12px; color: #8a96a3; margin-top: 2px; }
  .um-label { padding: 10px 16px 4px; font-size: 11.5px; color: #98a2b0; }
  .um-tenant-list { max-height: 260px; overflow-y: auto; padding: 0 8px 4px; }
  .um-divider { height: 1px; background: #f0f0f0; margin: 2px 0; }
  .um-logout {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 16px; font-size: 14px; color: #f56c6c;
    cursor: pointer; transition: background 0.15s;
  }
  .um-logout:hover { background: #fff5f5; }

  /* 企业切换列表项（嵌在用户下拉里） */
  .tenant-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 8px; border-radius: 7px;
    font-size: 13.5px; color: #1a1a1a;
    cursor: pointer; transition: background 0.15s;
  }
  .tenant-item:hover { background: #f5f7fa; }
  .tenant-item .ti-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #c9d1da; flex-shrink: 0;
  }
  .tenant-item .ti-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tenant-item .ti-tag {
    font-size: 11px; color: var(--wx-green);
    background: var(--wx-green-light); padding: 1px 7px; border-radius: 4px;
  }
  .tenant-item.is-active { background: #f5fbf7; color: var(--wx-green); font-weight: 500; }
  .tenant-item.is-active .ti-dot { background: var(--wx-green); }
  .header-icon-btn {
    width: 32px; height: 32px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.9); font-size: 16px;
    transition: all 0.15s;
  }
  .header-icon-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
  .header-icon-btn.icon-with-dot { position: relative; }
  .header-icon-btn.icon-with-dot::after {
    content: attr(data-count);
    position: absolute; top: 4px; right: 4px;
    min-width: 14px; height: 14px; padding: 0 4px;
    border-radius: 7px;
    background: #fa5151; color: #fff;
    font-size: 10px; line-height: 14px;
    font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid #fff;
    box-sizing: content-box;
  }
  .header-user {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 10px 4px 6px; border-radius: 20px;
    transition: background 0.15s;
    color: #fff;
  }
  .header-user:hover { background: rgba(255,255,255,.14); }
  .header-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,.9); color: #9aa8b7;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 12.5px;
  }
  .header-username { font-size: 13.5px; color: #fff; }

  /* ========= 左侧菜单 ========= */
  .sidebar {
    position: fixed; top: var(--header-h); left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: #fff;
    border-right: 1px solid #ebeef2;
    overflow-y: auto;
    padding: 8px 0 80px;
    z-index: 90;
  }
  .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 20px;
    color: #4a5564;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: all 0.15s;
  }
  .menu-item:hover { background: #f5f7fa; color: #1a1a1a; }
  .menu-item-icon {
    width: 18px; height: 18px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #8a96a3;
    font-size: 16px;
  }
  .menu-item.has-sub::after {
    content: '';
    position: absolute; right: 20px; top: 50%;
    width: 6px; height: 6px;
    border-right: 1.5px solid #c0c8d1;
    border-bottom: 1.5px solid #c0c8d1;
    transform: translateY(-70%) rotate(-45deg);
    transition: transform 0.2s;
  }
  .menu-item.expanded::after {
    transform: translateY(-40%) rotate(45deg);
  }
  .menu-item.active {
    color: #09bfae;
    background: #e6f8f6;
    font-weight: 500;
  }
  .menu-item.active::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: #09bfae;
  }
  .menu-item.active .menu-item-icon { color: #09bfae; }

  .submenu { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
  .submenu.expanded { max-height: 500px; }
  .submenu-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 20px 9px 60px;
    color: #6b7684; font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .submenu-item:hover { background: #f5f7fa; color: #1a1a1a; }
  .submenu-item.active {
    color: #09bfae;
    background: #e6f8f6;
    font-weight: 500;
  }
  .submenu-item.active::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: #09bfae;
  }
  .submenu-item .todo-badge {
    margin-left: auto; margin-right: 8px;
    font-size: 10px; color: #f59e0b;
  }
  .menu-item .todo-badge {
    margin-left: auto; margin-right: 20px;
    font-size: 10px; color: #f59e0b;
  }

  /* ========= Chrome 式 Tab 栏 ========= */
  .tabbar {
    position: fixed;
    top: var(--header-h); left: var(--sidebar-w); right: 0;
    height: var(--tab-h);
    background: #fff;
    border-bottom: 1px solid #ebeef2;
    display: flex; align-items: flex-end;
    padding: 0 0 0 8px;
    z-index: 80;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    height: calc(var(--tab-h) - 4px);
    padding: 0 12px 0 16px;
    margin-right: -1px;
    font-size: 13px;
    color: #6b7684;
    background: transparent;
    border: 1px solid transparent;
    border-bottom: none;
    border-top-left-radius: 6px;
    border-top-right-radius: 6px;
    cursor: pointer;
    max-width: 200px;
    min-width: 100px;
    flex-shrink: 0;
    user-select: none;
    transition: all 0.15s;
  }
  .tab:hover { background: #fff; color: #4a5564; }
  .tab.active {
    background: #fff;
    color: #409eff;
    border-color: #ebeef2;
    font-weight: 500;
    z-index: 1;
  }
  .tab.active::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px;
    background: #409eff;
    border-top-left-radius: 6px; border-top-right-radius: 6px;
  }
  .tab-title {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tab-close {
    width: 16px; height: 16px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; line-height: 1;
    color: #8a96a3;
    opacity: 0;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
  .tab-close:hover { background: #d0d7de; color: #1a1a1a; }
  .tab.pinned .tab-close { display: none; }

  /* ========= 主内容区 ========= */
  .main {
    position: fixed;
    top: calc(var(--header-h) + var(--tab-h));
    left: var(--sidebar-w);
    right: 0; bottom: 0;
    background: #f5f7fa;
    overflow: hidden;
  }
  .iframe-container {
    width: 100%; height: 100%;
    position: relative;
  }
  .page-iframe {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    border: 0;
    display: none;
    background: #f5f7fa;
  }
  .page-iframe.active { display: block; }

  /* sidebar 顶部留白 */
  .sidebar { padding-top: 12px; }
  .menu-item { padding: 10px 20px; }
  .menu-item-icon { font-size: 15px; opacity: 0.85; }
  .menu-item.active .menu-item-icon { opacity: 1; }
</style>
</head>
<body>

<!-- 顶部 Header -->
<header class="header">
  <div class="header-left">
    <div class="header-logo">⌂</div>
    <div class="header-brand" id="headerBrand">艺星医美-深圳</div>
    <div class="header-env">管理后台</div>
  </div>
  <div class="header-right">
    <button class="header-icon-btn" title="更多">⋯</button>
    <div class="header-user" id="userBtn" onclick="toggleUserMenu(event)">
      <div class="header-avatar">房</div>
      <div class="header-username">房昕</div>
      <span style="font-size:11px;opacity:.7;margin-left:2px;">▾</span>
    </div>
    <!-- 用户气泡菜单 -->
    <div id="userMenu">
      <div class="um-head">
        <div class="um-name">房昕</div>
        <div class="um-role">超级管理员</div>
      </div>
      <!-- 企业切换区：仅多租户权限时显示 -->
      <div id="umTenantSection" style="display:none;">
        <div class="um-label">切换企业</div>
        <div class="um-tenant-list" id="tenantList"></div>
        <div class="um-divider"></div>
      </div>
      <div class="um-logout" onclick="doLogout()">
        <span>⎋</span> 退出登录
      </div>
    </div>
  </div>
</header>

<!-- 左侧菜单 -->
<nav class="sidebar" id="sidebar"></nav>

<!-- Chrome Tab 栏 -->
<div class="tabbar" id="tabbar"></div>

<!-- 主内容区 -->
<main class="main">
  <div class="iframe-container" id="iframeContainer"></div>
</main>

<script>
/* ========= 菜单数据（与艺星后台对齐 2026-05-06） ========= */
const MENU = [
  { id: 'sales',      icon: '👥', title: '销售管理', page: 'sales_v1.0.html' },
  { id: 'expert',     icon: '🎓', title: '专家管理', children: [
      { id: 'expert-info',  title: '专家信息', page: 'expert_info_v1.0.html' },
  ]},
  { id: 'friend',     icon: '👫', title: '好友管理', children: [
      { id: 'friend-list',  title: '好友列表',   page: 'friend_list_v1.0.html' },
      { id: 'group-list',   title: '群列表',     page: 'group_list_v1.0.html' },
      { id: 'friend-add',   title: '添加好友',   page: 'friend_add_v1.0.html' },
      { id: 'friend-review',title: '删退审核',   page: 'friend_review_v1.0.html' },
      { id: 'friend-tag',   title: '好友标签',   page: 'friend_tag_v1.0.html' },
  ]},
  { id: 'script',     icon: '💬', title: '话术管理', page: 'script_v1.0.html' },
  { id: 'product',    icon: '📦', title: '商品管理', page: 'product_v1.0.html' },
  { id: 'massmsg',    icon: '📣', title: '群发管理', page: 'massmsg_v1.0.html' },
  { id: 'pyq',        icon: '🌐', title: 'PYQ管理',  page: 'pyq_v1.0.html' },
  { id: 'reward',     icon: '💰', title: '分佣管理', children: [
      { id: 'reward-detail',   title: '分佣明细',  page: 'reward_detail_v1.0.html' },
      { id: 'reward-total',    title: '分佣合计',  page: 'reward_total_v1.0.html' },
      { id: 'reward-topup',    title: '充值确认',  page: 'reward_topup_v1.0.html' },
      { id: 'reward-prepay',   title: '预付确认',  page: 'reward_prepay_v1.0.html' },
      { id: 'reward-income',   title: '收入确认',  page: 'reward_income_v1.0.html' },
  ]},
  { id: 'stats',      icon: '📊', title: '数据展示', children: [
      { id: 'stats-referral',  title: '拉新记录',     page: 'stats_referral_v1.0.html' },
      { id: 'stats-sales',     title: '销售统计',     page: 'stats_sales_v1.0.html' },
      { id: 'stats-rank',      title: '销售排名',     page: 'stats_rank_v1.0.html' },
      { id: 'stats-revisit',   title: '回访统计',     page: 'stats_revisit_v1.0.html' },
      { id: 'stats-shift',     title: '上班记录',     page: 'stats_shift_v1.0.html' },
      { id: 'stats-msgratio',  title: '消息占比统计', page: 'stats_msgratio_v1.0.html' },
      { id: 'stats-viewlog',   title: '数据查看日志', page: 'stats_viewlog_v1.0.html' },
      { id: 'stats-retention', title: '留存统计',     page: 'stats_retention_v1.0.html' },
      { id: 'stats-mass',      title: '群发统计',     page: 'stats_mass_v1.0.html' },
      { id: 'stats-pyq',       title: '朋友圈统计',   page: 'stats_pyq_v1.0.html' },
      { id: 'stats-saleuse',   title: '销售使用统计', page: 'stats_saleuse_v1.0.html' },
      { id: 'stats-script',    title: '话术统计',     page: 'stats_script_v1.0.html' },
      { id: 'stats-invite',    title: '群邀请提及率', page: 'stats_invite_v1.0.html' },
  ]},
  { id: 'chat',       icon: '💭', title: '聊天管理', children: [
      { id: 'chat-all',         title: '全部聊天', page: 'chat_all_v1.0.html' },
      { id: 'chat-assign',      title: '分配记录', page: 'chat_assign_v1.0.html' },
      { id: 'chat-saleban',     title: '销售词控', page: 'chat_saleban_v1.0.html' },
      { id: 'chat-cusban',      title: '客户词控', page: 'chat_cusban_v1.0.html' },
      { id: 'chat-ai-analysis', title: '智能分析', page: 'chat_ai_analysis_v1.0.html' },
  ]},
  { id: 'wechat',     icon: '🟢', title: '微信管理', children: [
      { id: 'wechat-account', title: '账号状态', page: 'wechat_account_v1.0.html' },
      { id: 'wechat-acquire', title: '拉新文案', page: 'wechat_acquire_v1.0.html' },
      { id: 'wechat-buddy',   title: '通友管理', page: 'wechat_buddy_v1.0.html' },
  ]},
  { id: 'ai',         icon: '🤖', title: 'AI 管理', children: [
      { id: 'ai-prompt', title: 'AI提示词库', page: 'ai_prompt_v1.0.html' },
      { id: 'ai-model',  title: 'AI模型管理',   page: 'ai_model_v1.0.html' },
  ]},
  { id: 'system',     icon: '⚙️', title: '系统管理', children: [
      { id: 'sys-role',   title: '角色管理',     page: 'sys_role_v1.0.html' },
      { id: 'sys-menu',   title: '菜单管理',     page: 'sys_menu_v1.0.html' },
      { id: 'sys-tagtpl', title: '标签模板管理', page: 'sys_tagtpl_v1.0.html' },
      { id: 'sys-config', title: '系统设置',     page: 'sys_config_v1.0.html' },
  ]},
];

/* ========= 渲染侧边栏 ========= */
const sidebar = document.getElementById('sidebar');
MENU.forEach(m => {
  const hasSub = m.children && m.children.length;
  const item = document.createElement('div');
  item.className = 'menu-item' + (hasSub ? ' has-sub' : '');
  item.dataset.id = m.id;
  item.innerHTML = `
    <span class="menu-item-icon">${m.icon}</span>
    <span>${m.title}</span>
    ${m.todo ? '<span class="todo-badge">🚧</span>' : ''}
  `;
  sidebar.appendChild(item);

  if (hasSub) {
    const sub = document.createElement('div');
    sub.className = 'submenu';
    sub.dataset.parent = m.id;
    m.children.forEach(c => {
      const ci = document.createElement('div');
      ci.className = 'submenu-item';
      ci.dataset.id = c.id;
      ci.dataset.page = c.page || '_placeholder.html';
      ci.dataset.title = c.title;
      ci.dataset.parent = m.id;
      ci.innerHTML = `<span>${c.title}</span>${c.todo ? '<span class="todo-badge">🚧</span>' : ''}`;
      sub.appendChild(ci);
    });
    sidebar.appendChild(sub);
    item.addEventListener('click', () => {
      const expanded = sub.classList.toggle('expanded');
      item.classList.toggle('expanded', expanded);
    });
  } else {
    item.dataset.page = m.page || '_placeholder.html';
    item.dataset.title = m.title;
    item.addEventListener('click', () => openTab(m));
  }
});
sidebar.querySelectorAll('.submenu-item').forEach(el => {
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    openTab({ id: el.dataset.id, title: el.dataset.title, page: el.dataset.page, parent: el.dataset.parent });
  });
});

/* ========= Tab 系统（真做：状态保留） ========= */
const tabbar = document.getElementById('tabbar');
const iframeContainer = document.getElementById('iframeContainer');
const tabs = new Map(); // id -> {el, iframe, title, page, pinned}
let activeTabId = null;

// 当前企业（给 iframe 页面传 ?tenant=，多租户门控用）；初始 bzds，切换企业时更新并重载页面
var SHELL_TENANT = 'yestar-sz';
function withTenant(page) {
  if (!page) return page;
  var sep = page.indexOf('?') === -1 ? '?' : '&';
  return page + sep + 'tenant=' + SHELL_TENANT;
}

function openTab({ id, title, page, pinned = false, parent = null }) {
  if (!tabs.has(id)) {
    // 创建 tab
    const tabEl = document.createElement('div');
    tabEl.className = 'tab' + (pinned ? ' pinned' : '');
    tabEl.innerHTML = `
      <span class="tab-title">${title}</span>
      <span class="tab-close">×</span>
    `;
    tabEl.querySelector('.tab-title').addEventListener('click', () => activateTab(id));
    tabEl.addEventListener('click', (e) => {
      if (!e.target.classList.contains('tab-close')) activateTab(id);
    });
    tabEl.querySelector('.tab-close').addEventListener('click', (e) => {
      e.stopPropagation();
      closeTab(id);
    });
    tabbar.appendChild(tabEl);

    // 创建 iframe（懒加载，只在第一次打开时设 src）
    const iframe = document.createElement('iframe');
    iframe.className = 'page-iframe';
    iframe.src = withTenant(page);
    iframe.dataset.id = id;
    iframeContainer.appendChild(iframe);

    tabs.set(id, { el: tabEl, iframe, title, page, pinned, parent });
  }
  activateTab(id);
}

function activateTab(id) {
  if (activeTabId === id) return;
  tabs.forEach((t, tid) => {
    t.el.classList.toggle('active', tid === id);
    t.iframe.classList.toggle('active', tid === id);
  });
  activeTabId = id;
  // 同步侧边栏高亮
  document.querySelectorAll('.menu-item, .submenu-item').forEach(el => el.classList.remove('active'));
  const tab = tabs.get(id);
  if (tab) {
    const target = document.querySelector(`.menu-item[data-id="${id}"], .submenu-item[data-id="${id}"]`);
    if (target) {
      target.classList.add('active');
      // 如果是子菜单，展开父
      if (target.classList.contains('submenu-item') && tab.parent) {
        const parentEl = document.querySelector(`.menu-item[data-id="${tab.parent}"]`);
        const subEl = document.querySelector(`.submenu[data-parent="${tab.parent}"]`);
        if (parentEl && subEl && !subEl.classList.contains('expanded')) {
          subEl.classList.add('expanded');
          parentEl.classList.add('expanded');
        }
      }
    }
  }
}

function closeTab(id) {
  const t = tabs.get(id);
  if (!t || t.pinned) return;
  // 若关闭的是当前 tab，激活相邻
  if (activeTabId === id) {
    const ids = Array.from(tabs.keys());
    const idx = ids.indexOf(id);
    const nextId = ids[idx + 1] || ids[idx - 1];
    activeTabId = null;
    if (nextId) activateTab(nextId);
  }
  t.el.remove();
  t.iframe.remove();
  tabs.delete(id);
}

/* ========= 支持 ?page=<id> 直接定位到指定子页 ========= */
(function openFromQuery() {
  const wanted = new URLSearchParams(location.search).get('page');
  if (!wanted) return;
  for (const m of MENU) {
    if (m.id === wanted && m.page) {
      openTab({ id: m.id, title: m.title, page: m.page });
      return;
    }
    if (m.children) {
      const c = m.children.find(x => x.id === wanted);
      if (c) {
        openTab({ id: c.id, title: c.title, page: c.page || '_placeholder.html', parent: m.id });
        return;
      }
    }
  }
})();

function initTenantSwitcher() {
  // 单租户权限：不显示切换区（不占位），下拉菜单仅剩退出登录
  if (ENTERPRISES.length <= 1) return;
  document.getElementById('umTenantSection').style.display = 'block';
  renderTenantList();
}

function renderTenantList() {
  const list = document.getElementById('tenantList');
  if (!list) return;
  list.innerHTML = ENTERPRISES.map(t => {
    const active = t.id === currentTenant;
    return `<div class="tenant-item${active ? ' is-active' : ''}" onclick="switchTenant('${t.id}')">
      <span class="ti-dot"></span>
      <span class="ti-name">${t.name}</span>
      ${active ? '<span class="ti-tag">当前</span>' : ''}
    </div>`;
  }).join('');
}

function switchTenant(id) {
  const menu = document.getElementById('userMenu');
  if (id === currentTenant) { menu.style.display = 'none'; return; }
  const t = ENTERPRISES.find(x => x.id === id);
  if (!t) return;
  currentTenant = id;
  SHELL_TENANT = id;
  document.getElementById('headerBrand').textContent = t.brand;
  renderTenantList();
  menu.style.display = 'none';
  showTenantToast('已切换到「' + t.name + '」');
  // 切换企业 → 重载已打开页面，让其按新租户渲染（多租户门控实时生效）
  tabs.forEach(function(tb) { tb.iframe.src = withTenant(tb.page); });
}

function showTenantToast(msg) {
  let el = document.getElementById('tenantToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'tenantToast';
    el.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;z-index:300;transition:opacity .25s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(window._tenantToastTimer);
  window._tenantToastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1600);
}
