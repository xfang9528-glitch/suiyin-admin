name: Notify Feishu Scrum Group

on:
  push:
    branches: [master]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Get Feishu tenant_access_token
        id: token
        run: |
          RESP=$(curl -s -X POST https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal \
            -H "Content-Type: application/json" \
            -d "{\"app_id\":\"${{ secrets.FEISHU_APP_ID }}\",\"app_secret\":\"${{ secrets.FEISHU_APP_SECRET }}\"}")
          TOKEN=$(echo $RESP | jq -r '.tenant_access_token')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Send push notification
        if: github.event_name == 'push'
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          AUTHOR="${{ github.event.head_commit.author.name }}"
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          SHORT_SHA=${SHA:0:7}
          URL="https://github.com/$REPO/commit/$SHA"
          COMMIT_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')

          curl -s -X POST https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"receive_id\": \"${{ secrets.FEISHU_SCRUM_CHAT_ID }}\",
              \"msg_type\": \"interactive\",
              \"content\": \"{\\\"elements\\\":[{\\\"tag\\\":\\\"markdown\\\",\\\"content\\\":\\\"**📦 代码更新推送**\\\\n\\\\n**仓库**: $REPO\\\\n**提交**: [$SHORT_SHA]($URL)\\\\n**作者**: $AUTHOR\\\\n**时间**: $COMMIT_TIME\\\\n**消息**: $COMMIT_MSG\\\"}],\\\"header\\\":{\\\"title\\\":{\\\"tag\\\":\\\"plain_text\\\",\\\"content\\\":\\\"碎银管理页原型更新\\\"},\\\"template\\\":\\\"green\\\"}}\"
            }"

      - name: Send release notification
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TITLE="${{ github.event.release.name }}"
          URL="${{ github.event.release.html_url }}"
          BODY=$(echo '${{ github.event.release.body }}' | head -5)

          curl -s -X POST https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=chat_id \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"receive_id\": \"${{ secrets.FEISHU_SCRUM_CHAT_ID }}\",
              \"msg_type\": \"interactive\",
              \"content\": \"{\\\"elements\\\":[{\\\"tag\\\":\\\"markdown\\\",\\\"content\\\":\\\"**🚀 新版本发布**\\\\n\\\\n**版本**: [$TAG]($URL)\\\\n**标题**: $TITLE\\\\n\\\\n$BODY\\\"}],\\\"header\\\":{\\\"title\\\":{\\\"tag\\\":\\\"plain_text\\\",\\\"content\\\":\\\"碎银管理页新版本发布\\\"},\\\"template\\\":\\\"blue\\\"}}\"
            }"
